name: Patrimoine AI — application Mac

# Construit l'application Mac (.dmg) sur un vrai Mac de GitHub, l'essaie (cours en direct réels, bilan PDF, sauvegardes, IA du Mac),
# puis la publie dans « Releases » (étiquette patrimoine-mac-vX.Y.Z). Nouvelle version = changer « version » dans mac/package.json
# et ajouter sa section dans mac/NOUVEAUTES.md. Une version déjà publiée n'est pas republiée.
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'config.js', 'marches.js', 'calculs.js', 'manifest.webmanifest', 'icon*', 'vendor/**', 'banque/**', 'mac/**', 'tests/**', '.github/workflows/mac.yml']

concurrency:
  group: patrimoine-mac
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrôler le moteur de cours et les calculs
        run: node tests/marches.test.js && node tests/calculs.test.js && node tests/banque.test.js
      - name: Installer les dépendances
        working-directory: mac
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Construire l'application
        working-directory: mac
        run: npm run dist
      - name: IA du Mac — modèle de langage (gardé en cache entre deux essais)
        uses: actions/cache@v4
        with:
          path: ~/ia-modele
          key: qwen3-4b-instruct-2507-q4km
      - name: Télécharger le modèle s'il n'est pas en cache
        run: |
          mkdir -p ~/ia-modele; f=~/ia-modele/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          [ -s "$f" ] || curl -L --fail --retry 3 -o "$f" "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          ls -la ~/ia-modele
      - name: Diagnostic des sources (cours et actualités) depuis ce Mac
        run: |
          for u in "https://news.google.com/rss/search?q=bourse&hl=fr&gl=FR&ceid=FR:fr" "https://query1.finance.yahoo.com/v1/finance/search?q=petrole&quotesCount=0&newsCount=3"; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (Macintosh) Chrome/150 Safari/537.36' "$u") $u"; done
      - name: Lancer l'application construite et l'essayer
        working-directory: mac
        timeout-minutes: 30
        run: |
          PATRIMOINE_IA_DOSSIER="$HOME/ia-modele" PATRIMOINE_AUTOTEST="$PWD/autotest.json" "dist/mac-arm64/Patrimoine AI.app/Contents/MacOS/Patrimoine AI" || true
          cat autotest.json
          node -e '
            const r = require("./autotest.json"), ko = [];
            if (r.erreur) ko.push("erreur : " + r.erreur);
            if (r.erreursConsole) ko.push("console : " + r.erreursConsole.join(" | "));
            if (r.erreursPage && r.erreursPage.length) ko.push("page : " + r.erreursPage.join(" | "));
            const p = r.page || {};
            if (!p.mac || !p.hosted || !p.classe) ko.push("pont Mac absent");
            if (!(p.net > 0) || !(p.dettes > 0) || !(p.budget > 0) || p.objectifs !== 1) ko.push("calculs : " + JSON.stringify(p));
            if (!r.marches || !(r.marches.n >= 4)) ko.push("cours Yahoo directs : " + JSON.stringify(r.marches));
            if (!r.graphique || !(r.graphique.points >= 5)) ko.push("historique Yahoo : " + JSON.stringify(r.graphique));
            if (!r.direct || !(r.direct.coursEnDirect > 0 || r.direct.yahoo === "open" || r.direct.binance === "open")) ko.push("cours en direct (flux) : " + JSON.stringify(r.direct));
            if (!r.actualites || !(r.actualites.n >= 5)) ko.push("actualités : " + JSON.stringify(r.actualites));
            if (!r.ia || !r.ia.pont || !r.ia.provider) ko.push("IA du Mac : " + JSON.stringify(r.ia));
            if (!r.coffre || !r.coffre.ok || !r.coffre.ouvert || !r.coffre.ouvert.ok) ko.push("coffre à documents : " + JSON.stringify(r.coffre));
            const v = r.v63 || {};
            if (v.ops !== 3 || v.dep !== 93.49 || v.cat !== "revenu,abonnement,alimentation" || v.fire !== 750000 || v.passifs !== "string") ko.push("budget réel et simulations : " + JSON.stringify(v));
            const q = r.iaReponse || {};
            if (!q.installee || q.erreur || !(String(q.texte || "").length > 80)) ko.push("réponse de l’IA du Mac : " + JSON.stringify(q));
            if (!r.sauvegarde || !(r.sauvegarde.n >= 1)) ko.push("sauvegarde : " + JSON.stringify(r.sauvegarde));
            if (!r.pdf || !r.pdf.ok || !(r.pdf.taille > 20000)) ko.push("bilan PDF : " + JSON.stringify(r.pdf));
            if (!r.maj || !r.maj.version) ko.push("mises à jour : " + JSON.stringify(r.maj));
            const bq = r.banque || {};
            if (!bq.page || bq.page.configure !== true || bq.retour !== 200 || bq.comptes !== 2 || !(bq.ops > 10) || !bq.trousseau) ko.push("liaison bancaire (démonstration) : " + JSON.stringify(bq));
            if (ko.length) { console.log("Échecs :", ko.join(" ; ")); process.exit(1); } else console.log("Application : tout fonctionne");'
      - name: Contrôler que tous les fichiers sont dans l'application
        working-directory: mac
        run: |
          npx --yes @electron/asar list "dist/mac-arm64/Patrimoine AI.app/Contents/Resources/app.asar" > contenu.txt
          for f in main.js preload.js maj.js ia-locale.js ia-worker.js banque-locale.js app/index.html app/marches.js app/calculs.js app/config.js app/vendor/pdfjs/pdf.min.js; do grep -q "/$f$" contenu.txt || { echo "Fichier absent de l'application : $f"; exit 1; }; done
      - name: Contrôler que l'application tourne sur puce Apple
        working-directory: mac
        run: |
          a=$(lipo -archs "dist/mac-arm64/Patrimoine AI.app/Contents/MacOS/Patrimoine AI")
          echo "Architectures : $a"; case " $a " in *" arm64 "*) ;; *) exit 1;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: Patrimoine-AI-mac
          path: mac/dist/*.dmg
      - name: Publier la version
        working-directory: mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "patrimoine-mac-v$VERSION"; then
            echo "La version $VERSION est déjà publiée : rien à faire (changer la version dans mac/package.json pour publier)."
            exit 0
          fi
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' NOUVEAUTES.md > notes.md
          printf '\n%s\n' "Installation : ouvrir le .dmg et glisser Patrimoine AI dans Applications. Au premier lancement : clic droit sur l'application → Ouvrir. Les versions suivantes s'installent toutes seules." >> notes.md
          gh release create "patrimoine-mac-v$VERSION" "dist/Patrimoine-AI-$VERSION-arm64.dmg" \
            --title "Patrimoine AI pour Mac $VERSION" --notes-file notes.md --target "${{ github.sha }}"
