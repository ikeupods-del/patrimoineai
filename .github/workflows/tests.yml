name: Patrimoine AI — contrôles complets

# Contrôles rapides (cours, calculs, fonctions bancaires) puis scénarios dans un vrai navigateur : l'application, Mes banques,
# les rappels de paiement et l'accessibilité (axe-core, thèmes clair et sombre). Lancé à chaque modification et sur les pull requests.
on:
  push:
    paths: ['index.html', 'calculs.js', 'marches.js', 'config.js', 'sw.js', 'banque/**', 'mac/banque-locale.js', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrôles rapides
        run: node tests/marches.test.js && node tests/calculs.test.js && node tests/banque.test.js
      - name: Les fonctions bancaires s'assemblent
        run: |
          for f in banque/routes/*.mjs; do npx --yes esbuild@0.24.0 "$f" --bundle --platform=node --target=node18 --format=esm --outfile="$RUNNER_TEMP/bundle/$(basename "$f")" --log-level=error; done
      - name: Navigateur de test
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm install playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Scénarios dans le navigateur
        env:
          PW: ${{ runner.temp }}/pw/node_modules/playwright
          AXE: ${{ runner.temp }}/pw/node_modules/axe-core/axe.min.js
        run: node tests/e2e.js && node tests/banque-e2e.js && node tests/banque-mac.js
