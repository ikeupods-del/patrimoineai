# Publie Patrimoine AI (produit par QuenTools) sur GitHub Pages à chaque push sur main.
# Une seule fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Les contrôles rapides (cours, calculs, fonctions bancaires) passent avant toute publication
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/marches.test.js && node tests/calculs.test.js && node tests/banque.test.js
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html connexion-mac.html config.js marches.js calculs.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png _site/
          cp -r vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
