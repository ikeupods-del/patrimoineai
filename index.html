<style>

:root[data-theme=light]{color-scheme:light;--bg:#f3f4f1;--card:#fff;--card2:#eceee9;--line:rgba(20,30,25,.11);--tx:#16201b;--mut:#5b6961;--p:#047857;--pt:#047857;--onp:#fff;--ok:#047857;--warn:#a16207;--red:#dc2626;--onred:#fff;--blue:#1d4ed8;--shadow:0 12px 32px rgba(20,30,25,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:var(--pt)}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:650}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.pos{color:var(--ok)}.neg{color:var(--red)}.warnc{color:var(--warn)}
.mt{margin-top:14px}.mt2{margin-top:22px}
.app{display:flex;height:100dvh}
.side{display:none;width:248px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:4px 12px 18px}

.navi:hover{background:var(--card2)}.navi.on{background:var(--card2);color:var(--pt)}
.side .sp{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.acts{display:flex;gap:2px}

.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));scroll-behavior:smooth}
.wrap{max-width:1040px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card+.card{margin-top:14px}
.ct{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.grid2>.card{margin-top:0}
.span2{grid-column:1/-1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{display:flex;gap:8px;align-items:flex-start}.row2 .inp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--p);color:var(--onp);font-weight:700;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.sec:hover{background:var(--card2)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.dng{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn.dngf{background:var(--red);color:var(--onred)}
.btn.blk{width:100%}.btn.sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}

.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--tx)}

.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}

.hero .lab{color:var(--mut);font-size:13px}
.tot{font:600 clamp(40px,11vw,58px)/1.05 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.big{font:600 34px/1.1 var(--num);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.delta{font-weight:600;font-size:14px}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{fill:var(--mut);font-size:9px}
.rng{display:flex;gap:6px;margin-top:14px}

.alloc{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut);line-height:1.2}.dc b{font:600 22px var(--num);color:var(--tx)}
.lg{flex:1;min-width:200px;display:flex;flex-direction:column}

.item{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;text-align:left}
.item:hover{border-color:color-mix(in srgb,var(--pt) 45%,var(--line))}
.item .ir{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item.sm{padding:10px 12px;font-size:14px}
.it{display:flex;align-items:center;gap:12px;min-width:0}.it>div{min-width:0}
.it b,.it .mut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rt b{font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px;align-items:center;margin:10px 0 12px}
.tools input{flex:1}.tools select{width:auto;flex:none}
.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.empty{text-align:center;padding:26px 12px}.empty .ico{margin:0 auto 10px;width:52px;height:52px}
.empty p{max-width:36ch;margin:6px auto 14px}
/* insights */
.ins{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}

.ins>.ic{margin-top:2px}
.ins .acts2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}

.gauge{width:150px;flex:none;color:var(--tx)}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:14px 0}

.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}.kv span{color:var(--mut)}.kv b{text-align:right;font-weight:600}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
/* forms */
.fld{margin-top:14px}
.fld>label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.opt{font-weight:400;color:var(--mut);font-size:12px;margin-left:4px}
.inp{position:relative}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;color:var(--tx);min-height:46px;outline:none}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--pt)}
input.bad{border-color:var(--red)}
.inp.has input{padding-right:52px}
.suf{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
input[type=range]{padding:0;min-height:30px;border:0;background:none;accent-color:var(--p)}
input[type=file]{padding:10px;font-size:14px}
.hint{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.45}
.err{font-size:12px;color:var(--red);margin-top:5px}.err:empty{display:none}
.live{font-size:13px;color:var(--mut);margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:12px}.live:empty{display:none}
.tile{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);margin-bottom:8px;text-align:left}
.tile:hover{border-color:var(--pt)}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;font-size:14px;min-height:36px;display:flex;align-items:center}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .15s}
.sw[aria-checked=true]{background:var(--p)}.sw[aria-checked=true] i{transform:translateX(20px);background:var(--onp)}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
/* chat */
.msg{max-width:90%;padding:10px 14px;border-radius:16px;margin:10px 0;line-height:1.6;font-size:14.5px;overflow-wrap:anywhere}
.msg.u{background:var(--p);color:var(--onp);margin-left:auto;border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.m{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.err{border-color:var(--red)}
.md p{margin:6px 0}.md p:first-child,.md h4:first-child{margin-top:0}.md h4{font-size:15px;margin:12px 0 4px}.md ul,.md ol{padding-left:20px;margin:6px 0}.md li{margin:3px 0}.md code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:13px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0 4px;margin-top:8px}
.composer textarea{min-height:46px;max-height:140px;resize:none}
.composer .btn{width:46px;padding:0;flex:none}
/* nav */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);min-height:50px}
.tab.on{color:var(--pt)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--p);color:var(--onp);box-shadow:var(--shadow);display:grid;place-items:center;z-index:25}
body[data-view=ai] .fab,body[data-view=set] .fab{display:none}
body[data-view=ai] .content{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
/* sheet */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sh .22s ease;overscroll-behavior:contain}
.sh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;z-index:2}
.sh h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes sh{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--bg);text-decoration:underline;font-weight:700;flex:none;min-height:32px}
@media(min-width:900px){
.side{display:flex}.tabs,.fab{display:none!important}
.content{padding:28px 40px 60px}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.composer{bottom:0}
body[data-view=ai] .content{padding-bottom:20px}
#modal{align-items:center}.sheet{border-radius:22px;max-height:88dvh}
#toast{bottom:28px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.sidein{display:flex;flex-direction:column;gap:4px;flex:1}
/* v3 : indicateurs, assistant, diagnostic */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpis>div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}

.gbtn:hover{background:#f7f8f8}

<script>
'use strict';

function load(){
  let d;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
  d=d&&typeof d==='object'&&!Array.isArray(d)?d:{};
  d.assets=Array.isArray(d.assets)?d.assets.filter(a=>a&&typeof a==='object'):[];
  d.assets.forEach(a=>{if(!a.id)a.id=newId()});
  d.plat=d.plat&&typeof d.plat==='object'?d.plat:{};
  d.hist=Array.isArray(d.hist)?d.hist:[];
  d.chat=Array.isArray(d.chat)?d.chat:[];
  d.watch=Array.isArray(d.watch)?d.watch:[];d.del=d.del&&typeof d.del==='object'?d.del:{};d.mt=d.mt&&typeof d.mt==='object'?d.mt:{};
  d.set=Object.assign({theme:'auto',hide:false,auto:true,prov:localStorage.getItem(KK)?'gemini':'local',fb:true,gmodel:'',gsrc:'key',mtab:'etf'},d.set||{});
  return d;
}

const pVec=n=>D.plat[n]||PL[n]||PL['Autre plateforme'];
const pScore=n=>{const v=pVec(n);return Math.round((v[0]*.3+v[1]*.15+v[2]*.25+v[3]*.3)/5*100)};

/* ===================== Calculs ===================== */
const isRisky=a=>a.cat==='crowd'||a.cat==='immo';
const live=a=>a.status!=='rembourse';
function val(a){
  if(a.cat==='bourse')return num(a.qty)*(num(a.price)||num(a.pru));
  return (a.value===''||a.value==null)?num(a.amount):num(a.value);
}
function inv(a){
  if(a.cat==='bourse')return num(a.qty)*num(a.pru);
  if(a.status==='rembourse'&&val(a)===0)return 0;   // remboursé et retiré : n'entre plus dans les totaux
  return num(a.amount);
}
const col=s=>s>=70?'var(--ok)':s>=50?'var(--warn)':'var(--red)';
const chip=s=>`<span class="badge" style="--c:${col(s)}">${s}/100</span>`;
const label=s=>s>=70?'Solide':s>=50?'À surveiller':'Fragile';
function aDetail(a){
  const base=pScore(a.plat||'Autre plateforme');let s=base;const parts=[['Fiabilité de la plateforme',base,true]];
  const add=(l,d)=>{s+=d;parts.push([l,d])};
  if(a.status==='retard')add('Remboursement en retard',-15);
  if(a.status==='defaut')add('Projet en défaut',-50);
  if(num(a.dur)>48)add('Durée supérieure à 4 ans',-5);
  const r=num(a.rate);
  if(r>12)add('Taux supérieur à 12 % (risque proportionnel)',-15);else if(r>10)add('Taux supérieur à 10 %',-8);
  return{score:Math.max(0,Math.min(100,s)),parts};
}
const aScore=a=>aDetail(a).score;
function portfolio(){
  const R=D.assets.filter(a=>isRisky(a)&&live(a)),tot=R.reduce((s,a)=>s+inv(a),0);
  if(!R.length||tot<=0)return null;
  const base=R.reduce((s,a)=>s+aScore(a)*inv(a),0)/tot;let sc=base;
  const by={};R.forEach(a=>{const k=a.plat||'Autre plateforme';by[k]=(by[k]||0)+inv(a)});
  const ents=Object.entries(by).sort((x,y)=>y[1]-x[1]),top=ents[0][1]/tot*100,n=ents.length,notes=[];
  let pc=0,pd=0;
  if(top>40){pc=(top-40)*.5;sc-=pc;notes.push('Concentration : '+Math.round(top)+' % sur une seule plateforme')}
  if(n<3){pd=8;sc-=8;notes.push('Moins de 3 plateformes')}
  const bad=R.filter(a=>a.status==='retard'||a.status==='defaut').length;
  if(bad)notes.push(bad+' projet(s) en retard ou en défaut');
  return{score:Math.max(0,Math.round(sc)),base:Math.round(base),pc:Math.round(pc),pd,notes,tot,n,top,topName:ents[0][0],by:ents,R};
}
function totals(){
  const tv=D.assets.reduce((s,a)=>s+val(a),0),ti=D.assets.reduce((s,a)=>s+inv(a),0);
  return{tv,ti,gain:tv-ti,pct:ti>0?(tv-ti)/ti*100:null};
}
function byCat(){
  const by={};D.assets.forEach(a=>{const v=val(a);if(v>0)by[a.cat]=(by[a.cat]||0)+v});
  return Object.entries(by).sort((x,y)=>y[1]-x[1]);
}
function endDate(a){
  if(!isRisky(a)||!a.date||!num(a.dur))return null;
  const d=new Date(a.date+'T12:00:00');if(isNaN(d))return null;
  d.setMonth(d.getMonth()+Math.round(num(a.dur)));return d;
}
const monthsTo=d=>Math.round((d-new Date())/2629800000);
function dueTxt(a){
  const e=endDate(a);if(!e)return '';const m=monthsTo(e);
  if(a.status==='rembourse')return 'terminé';
  if(m<0)return 'échéance dépassée';if(m===0)return 'échéance ce mois-ci';
  return 'dans '+m+' mois';
}
function yearly(){
  return D.assets.filter(a=>a.cat!=='bourse'&&live(a)&&a.status!=='defaut'&&num(a.rate)>0)
    .reduce((s,a)=>s+(isRisky(a)?inv(a):val(a))*num(a.rate)/100,0);
}
function snap(){
  if(!D.assets.length||D.assets.every(a=>a.demo))return;
  const T=totals(),d=today(),e={d,v:Math.round(T.tv),i:Math.round(T.ti)},L=D.hist[D.hist.length-1];
  if(L&&L.d===d)D.hist[D.hist.length-1]=e;else D.hist.push(e);
  if(D.hist.length>1500)D.hist=D.hist.slice(-1500);
}
function histPts(range){
  let H=D.hist.filter(h=>h&&h.d&&isFinite(h.v));
  if(range!=='all'){const c=new Date();c.setDate(c.getDate()-num(range));const cs=c.toLocaleDateString('sv-SE');H=H.filter(h=>h.d>=cs)}
  return H.map(h=>({t:Date.parse(h.d+'T12:00:00'),v:h.v,d:h.d}));
}
function yearsToGoal(goal,cap,mo,rate){
  if(cap>=goal)return 0;const r=rate/1200;let c=cap;
  for(let i=1;i<=720;i++){c=c*(1+r)+mo;if(c>=goal)return i/12}
  return null;
}

/* ===================== Alertes (calcul local, sans IA) ===================== */
function insights(){
  const A=D.assets,out=[];if(!A.length)return out;
  const T=totals(),pf=portfolio(),now=new Date();
  const add=(lvl,title,text,act)=>out.push({lvl,title,text,act});
  A.filter(a=>a.status==='defaut').forEach(a=>add('bad','Projet en défaut : '+a.name,'Le remboursement est compromis. Contactez la plateforme et suivez la procédure de recouvrement.',{l:'Ouvrir la fiche',a:'detail',id:a.id}));
  A.filter(a=>a.status==='retard').forEach(a=>add('warn','Remboursement en retard : '+a.name,'Demandez à la plateforme la nouvelle date de remboursement et les garanties activables.',{l:'Ouvrir la fiche',a:'detail',id:a.id}));
  A.filter(a=>a.status==='cours'&&endDate(a)&&endDate(a)<now).forEach(a=>add('warn','Échéance dépassée : '+a.name,'Prévue le '+fd(endDate(a))+'. Vérifiez si le remboursement est reçu, prolongé ou en retard, puis mettez le statut à jour.',{l:'Mettre à jour',a:'detail',id:a.id}));
  if(pf){
    if(pf.top>40)add('warn','Trop de poids sur '+pf.topName,Math.round(pf.top)+' % de votre crowdlending et de votre immobilier fractionné est chez une seule plateforme. Répartir limite l’impact d’une défaillance.',{l:'Voir les plateformes',a:'go',v:'analyse'});
    else if(pf.n<3)add('info','Peu de plateformes','Vos placements sont répartis sur '+pf.n+' plateforme(s). Au moins trois limitent le risque lié à une seule société.');
    const bp={};pf.R.forEach(a=>{const k=(a.prom||'').trim().toLowerCase();if(k)bp[k]=(bp[k]||{n:a.prom.trim(),v:0}),bp[k].v+=inv(a)});
    const tp=Object.values(bp).sort((x,y)=>y.v-x.v)[0];
    if(tp&&tp.v/pf.tot>.25)add('warn','Un même porteur de projet : '+tp.n,'Il concentre '+Math.round(tp.v/pf.tot*100)+' % de vos montants à risque, même si les projets sont sur des plateformes différentes.');
    const hi=pf.R.filter(a=>num(a.rate)>12);
    if(hi.length)add('info','Taux supérieurs à 12 %','Un rendement élevé rémunère un risque élevé : '+hi.slice(0,3).map(a=>a.name).join(', ')+(hi.length>3?' et '+(hi.length-3)+' autre(s)':'')+'.');
    const share=T.tv>0?pf.R.reduce((s,a)=>s+val(a),0)/T.tv*100:0;
    if(share>50)add('warn','Poids élevé des placements peu liquides',Math.round(share)+' % de votre patrimoine est en crowdlending ou immobilier fractionné : difficile à revendre et exposé à la perte en capital.');
    else if(share>30)add('info','Placements peu liquides : '+Math.round(share)+' %','Ils sont bloqués jusqu’à l’échéance et exposés à la perte en capital. Gardez de quoi faire face aux imprévus ailleurs.');
  }
  const B=A.filter(a=>a.cat==='bourse'),bt=B.reduce((s,a)=>s+val(a),0);
  if(B.length>=2&&bt>0){const m=B.slice().sort((x,y)=>val(y)-val(x))[0];if(val(m)/bt>.5)add('warn','Une seule ligne pèse '+Math.round(val(m)/bt*100)+' % de votre bourse',m.name+' domine votre portefeuille boursier.',{l:'Voir la ligne',a:'detail',id:m.id})}
  const nt=B.filter(a=>!a.tick).length;
  if(nt)add('info',nt+' position(s) sans ticker','Sans ticker Yahoo, les cours ne peuvent pas être actualisés automatiquement.',{l:'Voir la bourse',a:'filter',c:'bourse'});
  const st=B.filter(a=>a.tick&&(!a.pxts||Date.now()-a.pxts>7*864e5)).length;
  if(st)add('info','Cours à actualiser','Le cours de '+st+' position(s) date de plus de 7 jours.',{l:'Actualiser',a:'refresh'});
  if(A.length>=3&&!A.some(a=>a.cat==='cash'))add('info','Aucune liquidité renseignée','Ajoutez vos livrets et comptes pour voir la part de votre patrimoine disponible immédiatement.',{l:'Ajouter un livret',a:'add',c:'cash'});
  if(A.length>=3&&!A.every(a=>a.demo)&&(!D.lastBackup||Date.now()-D.lastBackup>30*864e5))add('info','Pensez à sauvegarder','Vos données ne sont que sur cet appareil. Un export régulier évite de tout perdre en cas de changement de téléphone ou d’effacement du navigateur.',{l:'Exporter maintenant',a:'exp'});
  if(!out.some(o=>o.lvl==='bad'||o.lvl==='warn'))out.push({lvl:'good',title:'Rien d’alarmant',text:'Aucun point de vigilance détecté sur vos données actuelles.'});
  const ord={bad:0,warn:1,info:2,good:3};return out.sort((x,y)=>ord[x.lvl]-ord[y.lvl]);
}

/* ===================== Graphiques SVG ===================== */
function lineChart(S,o={}){
  const all=S.flatMap(s=>s.p);if(all.length<2)return '';
  const W=340,H=o.h||130,pl=6,pr=6,pt=8,pb=20;
  let x0=Math.min(...all.map(p=>p.t)),x1=Math.max(...all.map(p=>p.t)),y0=Math.min(...all.map(p=>p.v)),y1=Math.max(...all.map(p=>p.v));
  if(y1===y0){y1+=1;y0-=1}const pd=(y1-y0)*.12;y0-=pd;y1+=pd;
  const X=t=>pl+(t-x0)/((x1-x0)||1)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb),f=v=>v.toFixed(1);
  const gid='g'+(o.id||'a');
  const paths=S.map((s,k)=>{
    const d=s.p.map((p,i)=>(i?'L':'M')+f(X(p.t))+' '+f(Y(p.v))).join('');
    const area=k===0&&s.area?`<path d="${d}L${f(X(s.p[s.p.length-1].t))} ${H-pb}L${f(X(s.p[0].t))} ${H-pb}Z" fill="url(#${gid})"/>`:'';
    return area+`<path d="${d}" fill="none" style="stroke:${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="4 4"':''}/>`;
  }).join('');
  const L=S[0].p,last=L[L.length-1],xl=o.xl||[fd(new Date(x0)),fd(new Date(x1))];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Graphique')}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${S[0].c};stop-opacity:.28"/><stop offset="1" style="stop-color:${S[0].c};stop-opacity:0"/></linearGradient></defs><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--line)"/>${paths}<circle cx="${f(X(last.t))}" cy="${f(Y(last.v))}" r="3.5" style="fill:${S[0].c}"/><text x="${pl}" y="${H-5}">${esc(xl[0])}</text><text x="${W-pr}" y="${H-5}" text-anchor="end">${esc(xl[1])}</text></svg>`;
}
function donut(ent,tot){
  const R=46,C=2*Math.PI*R;let off=0;
  const segs=ent.map(([c,v])=>{const fr=v/tot,len=Math.max(0,fr*C-(ent.length>1?2:0));
    const s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${CATS[c].c}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=fr*C;return s}).join('');
  return `<svg viewBox="0 0 120 120" class="donut" role="img" aria-label="Répartition du patrimoine par type de placement"><circle cx="60" cy="60" r="${R}" fill="none" style="stroke:var(--card2)" stroke-width="14"/>${segs}</svg>`;
}
function gauge(s){
  const L=Math.PI*50,d=s/100*L;
  return `<svg viewBox="0 0 120 70" class="gauge" role="img" aria-label="Indice de fiabilité ${s} sur 100"><path d="M10 60A50 50 0 0 1 110 60" fill="none" style="stroke:var(--card2)" stroke-width="10" stroke-linecap="round"/>${s>0?`<path d="M10 60A50 50 0 0 1 110 60" fill="none" style="stroke:${col(s)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${L.toFixed(1)}"/>`:''}<text x="60" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="currentColor" style="font-family:var(--num)">${s}</text></svg>`;
}
/* Mini rendu Markdown sûr (l'entrée est échappée avant transformation) */
function md(t){
  const L=esc(t).split('\n');let h='',ul=false,ol=false;
  const cl=()=>{if(ul){h+='</ul>';ul=false}if(ol){h+='</ol>';ol=false}};
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const raw of L){
    const l=raw.trim();let m;
    if(!l){cl();continue}
    if(m=l.match(/^#{1,4}\s+(.*)/)){cl();h+='<h4>'+inl(m[1])+'</h4>'}
    else if(m=l.match(/^[-*•]\s+(.*)/)){if(!ul){cl();h+='<ul>';ul=true}h+='<li>'+inl(m[1])+'</li>'}
    else if(m=l.match(/^\d+[.)]\s+(.*)/)){if(!ol){cl();h+='<ol>';ol=true}h+='<li>'+inl(m[1])+'</li>'}
    else{cl();h+='<p>'+inl(l)+'</p>'}
  }
  cl();return h;
}

<div class="g2"><div class="fld"><label for="t-tmi">Tranche marginale</label><select id="t-tmi" data-in="calc">${[0,11,30,41,45].map(x=>`<option value="${x}"${x===30?' selected':''}>${x} %</option>`).join('')}</select></div><div class="fld"><label for="t-ps">Prélèvements sociaux</label><select id="t-ps" data-in="calc"><option value="18.6">18,6 %</option><option value="17.2">17,2 %</option></select></div></div>

function calc(){if(UI.tool==='tax')calcTax();else if(UI.tool==='proj')calcProj();else calcNew()}
function calcTax(){
  const g=id=>num($(id).value),I=g('t-inc'),T=g('t-tmi')/100,P=g('t-ps')/100,pfu=I*(.128+P),bar=I*P+I*(1-.068)*T,win=pfu<=bar;
  const bx=(t,v,w)=>`<div class="box"${w?' style="border-color:var(--pt)"':''}><div class="sm mut">${t}</div><div class="big" style="font-size:26px">${eur(v)}</div><div class="sm">net ${eur(I-v)}</div></div>`;
  $('t-out').innerHTML=`<div class="g2">${bx('PFU (flat tax)',pfu,win)}${bx('Barème progressif',bar,!win)}</div><p class="mt"><b class="pos">${win?'Le PFU':'Le barème progressif'}</b> est plus avantageux, avec ${eur(Math.abs(pfu-bar))} d’écart par an.</p>`;
}
function calcProj(){
  const g=id=>num($(id).value),cap=g('p-cap'),m=g('p-mo'),rr=g('p-r'),r=rr/1200,y=Math.max(0,Math.min(60,Math.round(g('p-y')))),t=num($('p-env').value)/100;
  let c=cap,iv=cap;const A=[{t:0,v:c}],B=[{t:0,v:iv}];
  for(let k=1;k<=y*12;k++){c=c*(1+r)+m;iv+=m;if(k%12===0){A.push({t:k/12,v:c});B.push({t:k/12,v:iv})}}
  const gain=c-iv,tax=Math.max(0,gain)*t,net=c-tax;
  let goal='';
  if(D.goal>0){const yr=yearsToGoal(D.goal,cap,m,rr);goal=`<div class="kv"><span>Objectif de ${eur(D.goal)}</span><b>${yr===0?'déjà atteint':yr==null?'hors de portée avec ces paramètres':'atteint en '+nf(yr,1)+' ans (avant impôt)'}</b></div>`}
  $('p-out').innerHTML=(y>=1?lineChart([{p:A,c:'var(--pt)',area:true},{p:B,c:'var(--mut)',dash:true}],{id:'p',xl:['Aujourd’hui','Dans '+y+' ans'],aria:'Projection du capital'})+`<div class="xs mut" style="margin:4px 0 8px">Trait plein : valeur estimée. Pointillés : sommes versées.</div>`:'')
    +`<div class="kv"><span>Sommes versées</span><b>${eur(iv)}</b></div><div class="kv"><span>Valeur brute</span><b>${eur(c)}</b></div><div class="kv"><span>Gain brut</span><b>${eur(gain)}</b></div><div class="kv"><span>Impôt à la sortie</span><b>${eur(tax)}</b></div><div class="kv"><span>Net après impôt</span><b class="pos">${eur(net)}</b></div><div class="kv"><span>En euros d’aujourd’hui (inflation 2 %)</span><b>${eur(net/Math.pow(1.02,y))}</b></div>${goal}`;
}
function calcNew(){
  const g=id=>num($(id).value),a=g('n-amt'),rt=g('n-rate'),d=g('n-dur'),T=totals(),gross=a*rt/100*d/12,tax=gross*.314,net=gross-tax,ann=a>0&&d>0?net/a*12/d*100:0,w=T.tv+a>0?a/(T.tv+a)*100:0;
  $('n-out').innerHTML=`<div class="kv"><span>Intérêts bruts sur la durée</span><b>${eur(gross)}</b></div><div class="kv"><span>Impôt (PFU 31,4 %)</span><b>${eur(tax)}</b></div><div class="kv"><span>Intérêts nets</span><b class="pos">${eur(net)}</b></div><div class="kv"><span>Rendement net annualisé</span><b>${nf(ann,1)}\u00a0%</b></div><div class="kv"><span>Capital et intérêts récupérés</span><b>${eur(a+net)}</b></div><div class="kv"><span>Poids dans votre patrimoine</span><b>${nf(w,1)}\u00a0%</b></div><div class="box mt"><span class="sm">Si ce projet était perdu en totalité, vous perdriez <b class="neg">${eur(a)}</b>${T.tv>0?', soit '+nf(a/(T.tv+a)*100,1)+' % de votre patrimoine':''}.</span></div>`;
}

/* fetch avec délai maximal : évite qu'une requête bloquée fige l'assistant */
async function tfetch(url,opt,ms){
  if(typeof url==='string'&&url.indexOf('/api/market')===0){let o;try{o=await marketApi(url)}catch(e){o={error:e.message}}return new Response(JSON.stringify(o),{status:o.error?502:200,headers:{'content-type':'application/json'}})}
  ms=ms||45000;const c=typeof AbortController!=='undefined'?new AbortController():null,t=c?setTimeout(()=>c.abort(),ms):0;
  try{return await fetch(url,Object.assign({},opt||{},c?{signal:c.signal}:{}))}
  catch(e){const ab=e&&e.name==='AbortError',x=Error(ab?'Pas de réponse au bout de '+Math.round(ms/1000)+' s.':'Connexion impossible : appareil hors ligne, réseau filtré ou requête bloquée par le navigateur.');x.st=ab?-2:-1;throw x}
  finally{if(t)clearTimeout(t)}
}

  if(/referer|referrer/i.test(m))return 'referer';
  if(/location is not supported|not available in your country/i.test(m))return 'region';
  if(st===401||/API key not valid|API_KEY_INVALID|API key expired|invalid api key/i.test(m))return 'key';
  if(st===403&&/SERVICE_DISABLED|has not been used|is disabled|not been enabled/i.test(m))return 'disabled';
  if(st===403)return 'key';
  if(st===404||/not found|not supported for generateContent|no longer available/i.test(m))return 'nomodel';
  if(st===429||/quota|rate.?limit|RESOURCE_EXHAUSTED/i.test(m)){if(/limit:\s*0\b/i.test(m))return 'free0';if(/per.?day|PerDay|daily/i.test(m))return 'daily';return 'rpm'}

/* Aiguillage : IA locale, ou fournisseur en ligne avec repli automatique sur l'IA locale */
async function sendAI(q,force){
  q=String(q||'').trim();if(!q||AIBUSY)return;
  const h=chatHist();D.chat.push({r:'u',t:q});AIBUSY=true;renderAI();
  const p=force||aiProv(),off=navigator.onLine===false;let msg;
  const local=note=>{const r=LAI.answer(q);return{r:'m',t:r.t,sug:r.sug,src:'local',note}};
  if(p==='local'){await sleep(180);msg=local('')}
  else if(!keyOf(p))msg=local('Aucune clé '+PROV[p].n+' enregistrée : l’IA locale a répondu.');
  else if(off)msg=local('Hors ligne : l’IA locale a répondu.');
  else{
    try{const t=await gen([{text:q}],SYS+'\n\nDossier actuel (JSON) :\n'+JSON.stringify(dossier()),h,p);msg={r:'m',t,src:LASTM}}
    catch(e){
      if(D.set.fb!==false){msg=local(PROV[p].n+' indisponible, l’IA locale a pris le relais. Motif : '+e.message.split('\n')[0]);msg.cloudErr=e.message;msg.retry=p}
      else msg={r:'m',t:e.message,err:true};
    }
  }
  D.chat.push(msg);D.chat=D.chat.slice(-60);AIBUSY=false;save();renderAI();
}
function askAI(q){go('ai');sendAI(q)}

/* ===================== IA locale (hors ligne, aucune donnée ne sort de l'appareil) =====================
   Moteur autonome : compréhension par intentions et entités (placements, plateformes, catégories, montants,
   taux, durées), mémoire du fil de discussion, calculs sur vos données et base de connaissances financières. */
function metrics(){
  const T=totals(),A=D.assets,by={};byCat().forEach(([c,v])=>{by[c]=v});
  const sh=c=>T.tv>0?(by[c]||0)/T.tv*100:0;
  const rated=A.filter(a=>a.cat!=='bourse'&&live(a)&&num(a.rate)>0&&a.status!=='defaut'),rb=rated.reduce((s,a)=>s+(isRisky(a)?inv(a):val(a)),0),y=yearly();
  const risky=A.filter(a=>isRisky(a)&&live(a)),rv=risky.reduce((s,a)=>s+val(a),0);
  const trouble=A.filter(a=>a.status==='retard'||a.status==='defaut');
  const top=A.slice().sort((x,y)=>val(y)-val(x))[0],w=Object.values(by).map(v=>T.tv>0?v/T.tv:0);
  return{T,by,sh,y,wr:rb>0?y/rb*100:0,rv,rs:T.tv>0?rv/T.tv*100:0,trouble,tv2:trouble.reduce((s,a)=>s+inv(a),0),top,topS:top&&T.tv>0?val(top)/T.tv*100:0,
    eff:w.length?1/w.reduce((s,x)=>s+x*x,0):0,ncat:Object.keys(by).length,pf:portfolio(),cash:by.cash||0};
}
const LAI=(()=>{
  const N=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'`]/g,' ').replace(/[^a-z0-9%€.,/\s-]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
  const E=n=>nf(n)+'\u00a0€',P=(n,d=1)=>nf(n,d)+'\u00a0%',pick=a=>a[Math.floor(Math.random()*a.length)];
  const W=(t,k)=>k.length<=3?new RegExp('(^| )'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$|[?!.,])').test(t):new RegExp('(^| )'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(t);
  let ctx={};

  /* ---------- Extraction des nombres ---------- */
  function nums(q){
    const s=String(q).toLowerCase().replace(/\u00a0/g,' '),out=[],re=/(\d{1,3}(?:[ \u202f.]\d{3})+|\d+)(?:,(\d+)|\.(\d{1,2})(?!\d))?\s*(k ?€|k ?euros?|k\b|keur|m€|millions?|€|euros?|eur\b|%|pour ?cent|mois|ans?\b|années?|annees?)?/g;let m;
    while((m=re.exec(s))){
      let v=parseFloat(m[1].replace(/[ \u202f.]/g,'')+((m[2]||m[3])?'.'+(m[2]||m[3]):'')),u=(m[4]||'').replace(/\s/g,'');
      if(/^k/.test(u)){v*=1000;u='€'}else if(/^m€|^million/.test(u)){v*=1e6;u='€'}else if(/€|euro|eur/.test(u))u='€';else if(/%|cent/.test(u))u='%';else if(u==='mois')u='mois';else if(/^an|^ann/.test(u))u='ans';
      const after=s.slice(re.lastIndex,re.lastIndex+24),before=s.slice(Math.max(0,m.index-26),m.index);
      out.push({v,u,after,before,mo:/^\s*(\/ ?mois|par mois|chaque mois|mensuel|tous les mois|\/m\b)/.test(after)||/(chaque mois|par mois|mensuellement)\s*(de\s*)?$/.test(before)});
    }
    return out;
  }
  const money=q=>{const L=nums(q).filter(x=>!x.mo&&(x.u==='€'||(!x.u&&x.v>=100&&!/tmi|tranche/.test(x.before))));return L.length?L[0].v:null};
  const monthly=q=>{const L=nums(q).filter(x=>x.mo&&(x.u==='€'||!x.u));return L.length?L[0].v:null};
  const rate=q=>{const L=nums(q).filter(x=>x.u==='%'&&!/tmi|tranche/.test(x.before));return L.length?L[0].v:null};
  const months=q=>{const L=nums(q);const m=L.find(x=>x.u==='mois'&&!x.mo);if(m)return m.v;const y=L.find(x=>x.u==='ans');return y?y.v*12:null};
  const years=q=>{const L=nums(q);const y=L.find(x=>x.u==='ans');if(y)return y.v;const m=L.find(x=>x.u==='mois'&&!x.mo);return m?m.v/12:null};
  const tmi=q=>{const t=N(q);if(!/tmi|tranche|taux marginal|bareme/.test(t))return null;const L=nums(q).filter(x=>[0,11,30,41,45].includes(x.v));return L.length?L[0].v:null};

  /* ---------- Entités ---------- */
  const STOP=new Set(['exemple','projet','residence','programme','operation','livret','compte','assurance','epargne','fonds','monde','bourse','plateforme','placement','actions','action','immobilier','crowdlending','banque','france','groupe','societe','dans','pour','avec','mon','mes']);
  function findAsset(t){
    let best=null,bs=0;
    D.assets.forEach(a=>{
      const n=N(String(a.name||'').replace(/\(exemple\)/i,''));let s=0;
      if(n.length>=4&&t.includes(n))s=10;
      else n.split(' ').filter(w=>w.length>=4&&!STOP.has(w)).forEach(w=>{if(W(t,w))s+=w.length>=5?2:1});
      if(a.tick&&W(t,N(a.tick)))s+=5;
      if(s>bs){bs=s;best=a}
    });
    return bs>=2?best:null;
  }
  function findPlat(t){
    const L=[...new Set(Object.keys(PL).concat(D.assets.map(a=>a.plat).filter(Boolean)))].filter(p=>p!=='Autre plateforme');
    if(/(^| )mpb( |$)/.test(t))return 'Ma Première Brique';
    return L.find(p=>{const n=N(p);return n.length>=4&&t.includes(n)})||null;
  }
  const CSYN={bourse:['bourse','actions','etf','compte titre','cto','trackers','portefeuille boursier','titres'],crowd:['crowdlending','crowdfunding','pret participatif','prets participatifs','financement participatif','crowd'],immo:['immobilier','briques','brique','immo','fractionne'],epargne:['assurance vie','assurances vie','per','epargne retraite','epargne salariale','pel'],cash:['livret','livrets','liquidite','liquidites','cash','compte courant','ldds','lep'],autre:['crypto','bitcoin','autre']};
  function findCat(t){for(const c in CSYN)if(CSYN[c].some(k=>W(t,k)))return c;return null}

  /* ---------- Intentions ---------- */
  const IN={
    hello:[['bonjour',3],['salut',3],['hello',3],['coucou',3],['bonsoir',3],['hey',2]],
    thanks:[['merci',3],['super',1],['parfait',1],['genial',1],['top',1]],

    total:[['combien',2],['total',2],['montant',1],['valeur',1],['patrimoine',1],['vaut',2],['possede',2],['j ai',1]],

    liquid:[['liquidit',3],['precaution',3],['urgence',2],['disponible',2],['imprevu',2],['matelas',3],['tresorerie',2]],
    advice:[['conseil',3],['ameliorer',3],['optimis',3],['que faire',2],['que dois je',3],['recommand',3],['strategie',2],['priorite',3],['idee',1],['astuce',2],['suggest',2],['par quoi commencer',3]],
    market:[['le cours',3],['cours de',3],['cours d',3],['marches',3],['marche',2],['cac',3],['nasdaq',3],['dax',3],['s p',2],['stoxx',3],['wall street',3],['seance',2],['hausse du jour',3],['baisse du jour',3],['bourse aujourd hui',3],['comment va la bourse',3]],
    list:[['liste',3],['mes placements',2],['quels placements',3],['inventaire',3],['tous mes',2],['detail de mes',2]]
  };
  function scoreIn(t){
    return Object.keys(IN).map(id=>({id,s:IN[id].reduce((s,[k,w])=>s+((k.includes('\\')?new RegExp(k).test(t):W(t,k))?w:0),0)})).sort((a,b)=>b.s-a.s);
  }

  /* ---------- Base de connaissances ---------- */
  const KB=[
    {k:['pfu','flat tax','prelevement forfaitaire'],t:`#### Le PFU (« flat tax »)\nC’est l’imposition par défaut des revenus du capital (intérêts, dividendes, plus-values) : **31,4 %** en 2026, soit **12,8 %** d’impôt sur le revenu et **18,6 %** de prélèvements sociaux (17,2 % pour l’assurance-vie et certains produits d’épargne).\n\n- Il s’applique au crowdlending, au compte-titres et aux dividendes.\n- Vous pouvez opter pour le **barème progressif** si votre tranche marginale est de 0 % ou 11 % : l’option vaut alors pour tous vos revenus du capital de l’année.\n- Le simulateur « Impôt » de l’onglet Outils compare les deux avec vos chiffres.`,s:['Combien d’impôt sur mes intérêts ?','PFU ou barème pour une TMI à 11 % ?']},
    {k:['bareme','tmi','tranche marginale'],t:`#### Barème progressif et TMI\nLa tranche marginale d’imposition (TMI : 0, 11, 30, 41 ou 45 %) est le taux qui s’applique à la dernière part de vos revenus. Opter pour le barème fait imposer vos revenus du capital à votre TMI, plus les prélèvements sociaux, avec 6,8 % de CSG déductible.\n\n- **TMI 0 % ou 11 %** : le barème est généralement plus avantageux que le PFU.\n- **TMI 30 % et plus** : le PFU l’emporte presque toujours.\n\nDites-moi par exemple « impôt avec une TMI à 11 % » pour un calcul sur vos revenus.`,s:['Impôt avec une TMI à 11 %','Qu’est-ce que le PFU ?']},
    {k:['crowdlending','pret participatif','prets participatifs','crowdfunding','financement participatif'],t:`#### Le crowdlending\nVous prêtez de l’argent à une entreprise (souvent un promoteur immobilier) via une plateforme, contre un taux annoncé, souvent de 8 à 12 % par an, pour 12 à 36 mois.\n\n**Les risques**\n- **Perte en capital** : aucune garantie de remboursement, un projet peut faire défaut.\n- **Retards** fréquents, et prolongations prévues par les contrats.\n- **Illiquidité** : l’argent est bloqué jusqu’au remboursement.\n- Remboursement souvent **in fine** : tout le risque se joue à l’échéance.\n\n**Les bonnes pratiques**\n- Petits montants répartis sur de nombreux projets et au moins trois plateformes.\n- Plateforme agréée PSFP par l’AMF (règlement européen, en vigueur depuis novembre 2023).\n- Lire les garanties : hypothèque de premier rang, caution de la maison mère, fiducie.\n- Intérêts imposés au PFU de 31,4 %.`,s:['Quelles garanties regarder ?','Que faire si un projet est en retard ?']},
    {k:['immobilier fractionne','fractionne','briques','brique'],t:`#### L’immobilier fractionné\nDes plateformes comme Bricks ou Ma Première Brique vous permettent d’investir de petites sommes dans des projets immobiliers, souvent sous forme de prêts à un promoteur ou de parts d’un bien.\n\n- Rendement annoncé souvent entre 7 et 11 %, **non garanti**.\n- Mêmes risques que le crowdlending : retard, défaut, argent bloqué.\n- Vérifiez s’il s’agit d’un prêt (obligation, dette) ou d’une part de propriété : le risque et la fiscalité diffèrent.`},
    {k:['scpi','pierre papier'],t:`#### Les SCPI\nUne SCPI achète et loue un parc immobilier (bureaux, commerces, santé…) et vous reverse les loyers. Le rendement de distribution tourne souvent autour de 4 à 6 % brut.\n\n- **Frais d’entrée** élevés (souvent 8 à 12 %) : horizon de 8 à 10 ans conseillé.\n- La valeur des parts peut **baisser**, comme on l’a vu en 2023 et 2024.\n- Revente pas toujours immédiate.\n- Loyers imposés comme revenus fonciers (TMI + 17,2 %), sauf détention via une assurance-vie.`},
    {k:['etf','tracker','fonds indiciel','msci','s p 500','sp 500','nasdaq'],t:`#### Les ETF (trackers)\nUn ETF réplique un indice (MSCI World, S&P 500…) : en une seule ligne, vous détenez des centaines d’entreprises, avec des frais faibles (souvent 0,1 à 0,4 % par an).\n\n- Idéal pour la **diversification** et le **long terme** (8 ans et plus).\n- Il suit le marché à la hausse comme à la baisse : des chutes de 30 % ou plus sont possibles.\n- Beaucoup d’ETF monde sont éligibles au **PEA** grâce à une réplication synthétique.\n- Des versements réguliers (DCA) lissent le prix d’achat.`},
    {k:['pea','plan d epargne en actions'],t:`#### Le PEA\n- Plafond de versement : **150 000 €** (225 000 € avec le PEA-PME).\n- Actions européennes et ETF éligibles, y compris des ETF monde.\n- Après **5 ans** : gains exonérés d’impôt sur le revenu, seuls les prélèvements sociaux restent dus.\n- Retrait avant 5 ans : clôture du plan dans la plupart des cas, et gains imposés au PFU.\n\nC’est souvent l’enveloppe la plus efficace pour investir en actions à long terme.`},
    {k:['assurance vie','assurances vie','fonds euros','fonds euro','unites de compte'],t:`#### L’assurance-vie\n- **Fonds euros** : capital garanti par l’assureur, rendement modeste.\n- **Unités de compte** (ETF, SCPI…) : plus de potentiel, capital non garanti.\n- Fiscalité douce après **8 ans** : abattement annuel de 4 600 € sur les gains retirés (9 200 € pour un couple).\n- Transmission : jusqu’à **152 500 € par bénéficiaire** hors succession pour les versements faits avant 70 ans.\n- L’argent reste disponible à tout moment, contrairement au PER.`},
    {k:['per','plan epargne retraite','epargne retraite'],t:`#### Le PER\n- Les versements sont **déductibles** de votre revenu imposable, dans la limite d’un plafond : intéressant si votre TMI est de 30 % ou plus.\n- L’argent est **bloqué jusqu’à la retraite**, sauf cas précis (achat de la résidence principale, accidents de la vie).\n- À la sortie, le capital issu des versements déduits est imposé.\n\nL’avantage dépend surtout de l’écart entre votre TMI aujourd’hui et celle de votre retraite.`},
    {k:['livret a','ldds','lep','livret'],t:`#### Les livrets réglementés\n- **Livret A** : plafond de 22 950 €. **LDDS** : 12 000 €. **LEP** : 10 000 €, sous conditions de revenus et mieux rémunéré.\n- Intérêts **exonérés** d’impôt et de prélèvements sociaux, argent disponible à tout moment.\n- Taux fixés par l’État et révisés en général deux fois par an.\n\nC’est l’endroit naturel de l’épargne de précaution.`},
    {k:['precaution','epargne de securite','matelas','fonds d urgence'],t:`#### L’épargne de précaution\nC’est une réserve disponible immédiatement pour les imprévus : panne de voiture, perte d’emploi, dépense de santé.\n\n- Repère courant : **3 à 6 mois de dépenses**, davantage pour un indépendant.\n- À placer sur un livret (Livret A, LDDS, LEP) et **jamais** en crowdlending, SCPI ou bourse.\n- Elle passe avant les placements risqués : elle évite de devoir vendre au mauvais moment.\n\nIndiquez vos dépenses mensuelles (par exemple « mes dépenses sont de 2 000 € par mois ») pour que je calcule votre couverture.`},
    {k:['diversif'],t:`#### La diversification\nRépartir son argent pour qu’un seul problème ne fasse pas trop de dégâts :\n- **Entre classes d’actifs** : liquidités, bourse, immobilier, prêts.\n- **À l’intérieur** de chaque classe : un ETF monde plutôt qu’une seule action, beaucoup de petits projets plutôt qu’un gros.\n- **Entre intermédiaires** : plusieurs plateformes, plusieurs porteurs de projet.\n\nDemandez « comment mieux diversifier mes placements ? » pour une analyse de votre répartition.`},
    {k:['interets composes','capitalisation','boule de neige'],t:`#### Les intérêts composés\nLes gains produisent à leur tour des gains. Exemple : 10 000 € placés à 5 % par an deviennent environ **16 289 €** en 10 ans, **26 533 €** en 20 ans et **43 219 €** en 30 ans, sans aucun versement.\n\nLe temps compte donc davantage que le montant de départ. Pour une projection personnalisée, écrivez par exemple : « simule 200 € par mois à 6 % pendant 20 ans ».`},
    {k:['inflation','pouvoir d achat'],t:`#### L’inflation\nElle réduit la valeur réelle de votre argent : avec 2 % d’inflation par an, 10 000 € n’achètent plus que l’équivalent de 8 200 € d’aujourd’hui au bout de 10 ans.\n\n- Un placement à 3 % avec 2 % d’inflation ne rapporte réellement que 1 % environ.\n- Les actions et l’immobilier protègent en général mieux sur le long terme que les livrets.`},
    {k:['dca','investissement programme','versements programmes','lisser','versements reguliers'],t:`#### Investir régulièrement (DCA)\nVerser la même somme chaque mois, quel que soit le marché :\n- Vous achetez davantage de parts quand les prix baissent.\n- Vous évitez de tout investir juste avant une chute.\n- Cela crée une habitude simple, souvent automatisable chez le courtier.\n\nC’est une méthode de discipline, pas une garantie de gain.`},
    {k:['garantie','garanties','hypotheque','caution','gapd','fiducie','nantissement','surete'],t:`#### Les garanties d’un projet\nDe la plus solide à la plus faible, en général :\n- **Fiducie-sûreté** : le bien est transféré à un tiers en garantie.\n- **Hypothèque de premier rang** : vous êtes payé en premier sur la vente du bien. En deuxième rang, la banque passe avant vous.\n- **Garantie autonome à première demande (GAPD)** ou **caution** : ne vaut que ce que vaut le garant. Préférez la maison mère solide à une SPV sans actifs.\n- **Nantissement de parts** : utile, mais faible si la société ne vaut plus rien.\n\nVérifiez qui garantit, à quel rang et pour quel montant par rapport à la dette.`},
    {k:['in fine','amortissable','amortissement'],t:`#### In fine ou amortissable\n- **In fine** : vous recevez les intérêts (parfois seulement à la fin) et tout le capital à l’échéance. Le risque est concentré sur la fin du projet.\n- **Amortissable** : vous récupérez une part du capital à chaque échéance. Le risque diminue avec le temps et l’argent peut être réinvesti progressivement.`},
    {k:['defaut','en retard','retard','recouvrement','procedure collective','redressement','liquidation judiciaire'],t:`#### Projet en retard ou en défaut\n1. Demandez par écrit à la plateforme la cause, la nouvelle date et les garanties activables.\n2. Suivez les communications : la plateforme gère en général le recouvrement et la déclaration de créance.\n3. Ne réinvestissez pas chez le même porteur tant que la situation n’est pas réglée.\n4. Mettez le statut à jour dans l’application pour garder un indice réaliste.\n5. En cas de perte définitive, elle peut sous conditions être imputée sur les intérêts de même nature : demandez l’attestation à la plateforme.\n\nUn retard n’est pas une perte : beaucoup de projets finissent remboursés, avec des intérêts de retard.`},
    {k:['amf','agrement','orias','psfp','regule','regulation','arnaque'],t:`#### Vérifier une plateforme\n- **Crowdlending** : agrément de prestataire de services de financement participatif (PSFP) délivré par l’AMF, à vérifier dans le registre sur amf-france.org.\n- **Conseillers et intermédiaires** : immatriculation à l’ORIAS (orias.fr).\n- Consultez les **listes noires** de l’AMF et de l’ACPR.\n- Méfiez-vous des rendements « garantis » élevés, de la pression pour décider vite et des demandes de virement vers l’étranger.`},
    {k:['crypto','bitcoin','ethereum'],t:`#### Les cryptomonnaies\n- Très **volatiles** : des baisses de 50 à 80 % se sont déjà produites plusieurs fois.\n- Plus-values imposées au moment de la conversion en euros (flat tax), pas lors des échanges entre cryptos.\n- Prestataire à choisir parmi ceux enregistrés auprès de l’AMF (PSAN) ou agréés MiCA.\n- Règle de prudence courante : n’y mettre que ce que vous acceptez de perdre en totalité.`},
    {k:['l or','lingot','napoleon','metal precieux','metaux precieux'],t:`#### L’or\n- Valeur refuge en période de crise, mais ne verse ni intérêts ni dividendes.\n- Or physique : frais d’achat et de revente, stockage. ETC ou ETF sur l’or : plus simple.\n- Fiscalité spécifique : taxe forfaitaire sur le prix de vente, ou régime des plus-values avec justificatifs.\n- Souvent limité à une petite part du patrimoine (5 à 10 %).`},
    {k:['frais'],t:`#### Les frais\nIls grignotent la performance chaque année : 1 % de frais en plus sur 20 ans représente près de 18 % de capital en moins.\n- Comparez les frais de gestion (ETF souvent sous 0,3 %, fonds actifs souvent au-dessus de 1,5 %).\n- En assurance-vie : frais sur versements et frais de gestion annuels.\n- En SCPI : frais d’entrée élevés, d’où un horizon long.`},
    {k:['obligation','obligations'],t:`#### Les obligations\nUne obligation est un prêt à un État ou à une entreprise, remboursé à une date fixée, avec des intérêts réguliers. Le risque dépend de l’émetteur. Leur prix baisse quand les taux montent, et monte quand les taux baissent. Les fonds et ETF obligataires permettent de diversifier.`},
    {k:['krach','baisse des marches','volatil','chute','marche baisse'],t:`#### Quand la bourse baisse\n- Les baisses de 20 à 30 % font partie du cycle normal des marchés.\n- Vendre dans la panique transforme une perte temporaire en perte définitive.\n- Avec une épargne de précaution et un horizon long, on peut attendre, voire continuer ses versements.\n- La diversification (ETF monde) limite l’impact d’une entreprise ou d’un pays.`},
    {k:['document','documents','verifier avant','avant d investir','due diligence','quoi verifier'],t:`#### Avant d’investir dans un projet\n1. **La plateforme** : agrément AMF (PSFP), ancienneté, taux de défaut publiés.\n2. **Le porteur** : comptes sur Pappers ou Infogreffe, historique, procédures (BODACC).\n3. **Le projet** : permis de construire purgé, taux de précommercialisation, apport du promoteur (au moins 10 %).\n4. **Les garanties** : rang de l’hypothèque, qui se porte caution, fiducie.\n5. **Le contrat** : in fine ou amortissable, possibilité de prolongation, subordination.\n6. **Votre exposition** : le projet ne devrait pas dépasser quelques pourcents de votre patrimoine.\n\nL’import de contrat (bouton « Importer ») repère automatiquement une partie de ces points.`},
    {k:['pea','assurance vie'],all:true,t:`#### PEA ou assurance-vie ?\n- **Contenu** : PEA pour les actions et ETF européens ou éligibles ; assurance-vie pour le fonds euros, les unités de compte, les SCPI.\n- **Plafond** : 150 000 € de versements sur le PEA ; pas de plafond en assurance-vie.\n- **Fiscalité** : PEA exonéré d’impôt sur le revenu après 5 ans ; assurance-vie avec abattement de 4 600 € par an (9 200 € en couple) après 8 ans.\n- **Frais** : souvent plus bas sur un PEA en ligne avec des ETF.\n- **Transmission** : avantage net pour l’assurance-vie.\n\nBeaucoup d’épargnants utilisent les deux : le PEA pour les actions à long terme, l’assurance-vie pour la sécurité (fonds euros) et la transmission.`}
  ];
  function scoreKB(t){

  /* ---------- Réponses sur vos données ---------- */

  function advList(X){

    if(pf&&pf.top>40)o.push(`**Orientez vos prochains projets hors de ${pf.topName}**, qui concentre ${P(pf.top,0)} de vos placements participatifs.`);

    if(pf&&pf.R.some(a=>num(a.rate)>10))o.push(`**Relisez les garanties des projets à plus de 10 %** : un taux élevé rémunère un risque élevé.`);
    if(!X.by.bourse&&X.T.tv>5000)o.push(`**Pour le long terme** (8 ans et plus), un ETF monde diversifié, par exemple dans un PEA, est une piste souvent citée pour compléter votre patrimoine. Il peut baisser fortement en cours de route.`);
    if(!D.goal)o.push(`**Fixez-vous un objectif chiffré** depuis l’accueil pour suivre votre progression.`);
    if(A.length>=3&&(!D.lastBackup||Date.now()-D.lastBackup>30*864e5))o.push(`**Exportez une sauvegarde** : vos données ne sont que sur cet appareil.`);
    if(!o.length)o.push('Votre situation ne montre pas de déséquilibre marqué. Continuez vos versements réguliers et revoyez vos plateformes deux fois par an.');

  function aDue(){
    const A=D.assets.filter(a=>isRisky(a)&&live(a)),now=new Date(),w=A.filter(a=>endDate(a));
    if(!A.length)return 'Vous n’avez pas de projet de crowdlending ou d’immobilier fractionné en cours.';

    const exp=a=>inv(a)*(1+num(a.rate)/100*num(a.dur)/12);

    if(L.length){const tv=L.reduce((t,a)=>t+inv(a),0);s+=`\n\nVous y avez **${E(tv)}** sur ${L.length} projet${L.length>1?'s':''}`+(pf&&isRisky(L[0])?`, soit ${P(tv/pf.tot*100,0)} de vos placements participatifs`:'')+'.\n'+L.slice(0,6).map(a=>`- ${a.name} : ${E(val(a))}${a.status!=='cours'?' ('+(ST[a.status]||'').toLowerCase()+')':''}`).join('\n')}
    else s+='\n\nVous n’avez pas de projet sur cette plateforme.';
    return s+'\n\nCes notes sont des estimations modifiables dans l’onglet Analyse. Vérifiez l’agrément AMF et les taux de défaut publiés.';

  function aTax(q){
    const X=metrics(),inc=money(q)||Math.round(X.y),tm=tmi(q),ps=/assurance vie|pel/.test(N(q))?.172:.186;
    if(!inc)return 'Indiquez le montant de vos revenus du capital, par exemple « impôt sur 1 500 € d’intérêts avec une TMI à 11 % ».';
    const pfu=inc*(.128+ps),bar=t=>inc*ps+inc*(1-.068)*t/100;
    let s=`#### Impôt sur ${E(inc)} de revenus du capital\n- **PFU** (${P((.128+ps)*100)}) : **${E(pfu)}**, il vous reste ${E(inc-pfu)}.\n`;
    if(tm!=null){const b=bar(tm);s+=`- **Barème, TMI ${tm} %** : **${E(b)}**, il vous reste ${E(inc-b)}.\n\n${b<pfu?'Le barème est plus avantageux':'Le PFU est plus avantageux'}, avec ${E(Math.abs(pfu-b))} d’écart.`}
    else s+=[0,11,30,41].map(t=>`- Barème, TMI ${t} % : ${E(bar(t))}${bar(t)<pfu?' (moins que le PFU)':''}`).join('\n')+'\n\nLe barème ne vaut le coup qu’avec une TMI de 0 ou 11 %. Précisez votre TMI pour un calcul exact.';

  }
  function aSim(q){
    const T=totals();let cap=money(q),m=monthly(q),r=rate(q),y=years(q);const dflt=[];
    if(cap==null){cap=T.tv;dflt.push('capital de départ = votre patrimoine actuel')}
    if(m==null){m=0;if(!money(q)){m=200;dflt.push('200 € par mois')}}
    if(r==null){r=5;dflt.push('5 % par an')}
    if(y==null){y=15;dflt.push('15 ans')}
    y=Math.min(60,Math.max(1,y));const rm=r/1200;let c=cap,iv=cap;for(let k=0;k<Math.round(y*12);k++){c=c*(1+rm)+m;iv+=m}
    const g=c-iv;
    let s=`#### Projection sur ${nf(y,y%1?1:0)} ans\nAvec ${E(cap)} au départ${m?` et ${E(m)} par mois`:''} à ${P(r)} par an :\n- Sommes versées : ${E(iv)}\n- Valeur estimée : **${E(c)}**\n- Dont gains : ${E(g)}\n- Après PFU sur les gains : ${E(c-Math.max(0,g)*.314)}\n- En euros d’aujourd’hui (2 % d’inflation) : ${E((c-Math.max(0,g)*.314)/Math.pow(1.02,y))}`;
    if(D.goal){const yt=yearsToGoal(D.goal,cap,m,r);s+=`\n\nVotre objectif de ${E(D.goal)} serait ${yt===0?'déjà atteint':yt==null?'hors de portée avec ces paramètres':'atteint en '+nf(yt,1)+' ans'}.`}
    if(dflt.length)s+=`\n\nHypothèses retenues faute de précision : ${dflt.join(', ')}.`+(dflt.length>1?' Vous pouvez écrire par exemple « 10 000 € plus 300 € par mois à 6 % pendant 20 ans ».':'');
    return s+'\n\nProjection théorique à rendement constant : les marchés ne progressent jamais en ligne droite.';
  }
  function aGoal(q){
    const T=totals(),g=money(q)||D.goal;
    if(!g)return 'Vous n’avez pas encore d’objectif. Dites par exemple « objectif 100 000 € », ou fixez-le depuis l’accueil.';
    const m=monthly(q)||200,r=rate(q)||5,yt=yearsToGoal(g,T.tv,m,r);
    let s=`#### Objectif de ${E(g)}\nVous en êtes à **${E(T.tv)}**, soit ${P(Math.min(100,T.tv/g*100),0)}.\n\n`;
    s+=yt===0?'Il est déjà atteint.':yt==null?`Avec ${E(m)} par mois à ${P(r)}, il n’est pas atteignable en moins de 60 ans.`:`Avec ${E(m)} par mois à ${P(r)} par an, vous l’atteindriez dans environ **${nf(yt,1)} ans**.`;
    if(yt){const alt=[[m*2,r],[m,r+2]].map(([mm,rr])=>[mm,rr,yearsToGoal(g,T.tv,mm,rr)]);s+='\n\n'+alt.map(([mm,rr,t])=>`- Avec ${E(mm)} par mois à ${P(rr)} : ${t==null?'hors de portée':nf(t,1)+' ans'}`).join('\n')}

  }
  function aNew(q){
    const a=money(q),r=rate(q),d=months(q),T=totals(),X=metrics(),pl=findPlat(N(q));
    if(!a||!r||!d){const miss=[!a&&'le montant',!r&&'le taux annuel',!d&&'la durée'].filter(Boolean);
      return `Pour évaluer ce projet, il me manque ${miss.join(', ')}. Écrivez par exemple : « projet de 2 000 € à 10 % sur 24 mois chez Bricks ».\n\nEn attendant, les points à vérifier :\n- Agrément AMF de la plateforme et taux de défaut publiés\n- Santé financière du porteur (Pappers, Infogreffe)\n- Garanties : rang de l’hypothèque, caution de la maison mère, fiducie\n- Permis de construire purgé et précommercialisation\n- Clauses de prolongation et de subordination`}
    const gross=a*r/100*d/12,net=gross*(1-.314),ann=net/a*12/d*100,w=a/(T.tv+a)*100;
    let s=`#### Projet de ${E(a)} à ${P(r)} sur ${d} mois\n- Intérêts bruts : ${E(gross)}, nets de PFU : **${E(net)}**\n- Rendement net annualisé : **${P(ann)}**\n- Poids dans votre patrimoine : ${P(w)}\n- Si tout était perdu : −${E(a)}\n`;

    if(X.rs+w>40)warn.push(`Vos placements peu liquides passeraient à environ ${P((X.rv+a)/(T.tv+a)*100,0)} du patrimoine.`);
    if(pl&&X.pf){const cur=(X.pf.by.find(x=>x[0]===pl)||[0,0])[1],np=(cur+a)/(X.pf.tot+a)*100;s+=`- Part de ${pl} dans vos projets : ${P(np,0)} après investissement\n`;if(np>40)warn.push(`${pl} dépasserait 40 % de vos placements participatifs.`)}

    s+=warn.length?'\n#### Points d’attention\n'+warn.map(x=>'- '+x).join('\n'):'\nCe montant reste raisonnable au regard de votre patrimoine.';
    return s+'\n\nLe rendement annoncé n’est pas garanti : un projet peut être prolongé ou faire défaut.';
  }
  function aLiquid(q){
    const X=metrics(),dep=/depense|charges|budget|vis avec|depens/.test(N(q))?(monthly(q)||money(q)):null;
    let s=`#### Vos liquidités\n**${E(X.cash)}** disponibles immédiatement (${P(X.sh('cash'),0)} du patrimoine).`;
    if(X.by.epargne)s+=` S’y ajoutent ${E(X.by.epargne)} en assurance-vie et épargne, retirables en quelques jours ou semaines (hors PER).`;
    s+=`\n\n${E(X.rv)} sont bloqués dans des placements participatifs jusqu’à leur échéance.`;
    if(dep){const mo=X.cash/dep;s+=`\n\nAvec ${E(dep)} de dépenses par mois, vos liquidités couvrent **${nf(mo,1)} mois**. ${mo<3?'C’est en dessous du repère de 3 à 6 mois : renforcez-les en priorité.':mo>12?'C’est confortable, peut-être plus que nécessaire : une partie pourrait être placée à plus long terme.':'C’est dans le repère habituel de 3 à 6 mois ou au-dessus.'}`}
    else s+='\n\nRepère courant : 3 à 6 mois de dépenses sur des livrets. Indiquez vos dépenses mensuelles (« mes dépenses sont de 2 000 € par mois ») pour calculer votre couverture.';

  }
  function aAdvice(){const X=metrics();return '#### Mes suggestions, par ordre de priorité\n'+advList(X).map((x,i)=>(i+1)+'. '+x).join('\n')+NC}
  function aList(){
    const G={};D.assets.forEach(a=>{(G[a.cat]=G[a.cat]||[]).push(a)});
    return '#### Vos placements\n'+Object.keys(G).map(c=>`**${CATS[c].n}**\n`+G[c].sort((a,b)=>val(b)-val(a)).slice(0,12).map(a=>`- ${a.name} : ${E(val(a))}`).join('\n')).join('\n\n');

  function aMarket(t){
    if(!HOSTED)return 'Les cours en direct ne sont disponibles que lorsque l’application est en ligne (GitHub Pages).';
    const d=MK.data,ix=d.idx&&d.idx.items;let hit=null;
    Object.keys(d).forEach(k=>((d[k]&&d[k].items)||[]).forEach(x=>{if(hit)return;const n=N(x.n),s=N(x.s.replace(/[\^=]/g,' ')).trim();if((n.length>=3&&W(t,n))||(s.length>=2&&W(t,s)))hit=x}));
    const ch=x=>x.ch==null?'variation inconnue':(x.ch>=0?'+':'−')+nf(Math.abs(x.ch),2)+' %';
    if(hit)return `**${hit.n}** (${hit.s}) cote **${pxf(hit.p,hit.c)}**, ${ch(hit)} par rapport à la clôture précédente.`+((D.watch||[]).includes(hit.s)?'':'\n\nTouchez la valeur dans la section Marchés de l’accueil pour voir son graphique ou l’ajouter à vos favoris.');

    const all=['etf','eu','us','fav'].flatMap(k=>(d[k]&&d[k].items)||[]).filter(x=>x.ch!=null);

  function aHelp(){
    return `Je suis l’**IA locale** de Patrimoine AI. Je fonctionne **sans Internet** et vos données ne quittent jamais l’appareil. Je calcule à partir de vos placements et je connais les bases de l’investissement en France.\n\n**Exemples de questions**\n- « Fais le bilan de mon patrimoine »\n- « Quels sont mes risques ? », « Comment mieux diversifier ? »\n- « Quand arrivent mes échéances ? », « Combien je touche d’intérêts ? »\n- « Parle-moi de Bricks » ou du nom d’un de vos placements\n- « Simule 300 € par mois à 6 % pendant 20 ans »\n- « Projet de 2 000 € à 10 % sur 24 mois, j’y vais ? »\n- « Impôt avec une TMI à 11 % », « C’est quoi le PEA ? »\n\nPour des réponses rédigées plus librement, vous pouvez activer Gemini ou Grok dans les réglages. Je reste disponible hors ligne.`;
  }
  function aInsight(q){

    if(/défaut/i.test(t))tips=['Contactez la plateforme et demandez l’état de la procédure et des garanties.','Conservez tous les échanges et, en cas de perte définitive, l’attestation pour vos impôts.','Mettez le statut à jour pour garder un indice réaliste.'];
    else if(/retard/i.test(t))tips=['Demandez par écrit la cause du retard et la nouvelle date prévue.','Vérifiez les garanties prévues au contrat et si des intérêts de retard s’appliquent.','Évitez de nouveaux projets avec le même porteur d’ici là.'];
    else if(/Échéance dépassée/i.test(t))tips=['Vérifiez votre compte sur la plateforme : le remboursement est peut-être arrivé.','Sinon, passez le projet en « En retard » et contactez la plateforme.'];
    else if(/poids sur|plateformes/i.test(t))tips=['Investissez vos prochains projets sur d’autres plateformes agréées.','Repère courant : pas plus de 30 à 40 % sur une seule plateforme.','Laissez les remboursements rééquilibrer naturellement la répartition.'];
    else if(/porteur/i.test(t))tips=['Ne financez plus ce porteur tant que sa part dépasse 25 %.','Vérifiez sa santé financière (comptes déposés, procédures).'];

    else if(/liquides/i.test(t))tips=['Dirigez les nouveaux versements vers des supports disponibles.','Gardez 3 à 6 mois de dépenses sur des livrets.'];
    else if(/seule ligne/i.test(t))tips=['Diversifiez avec un ETF large plutôt que d’ajouter à cette ligne.','Fixez une part maximale par ligne, par exemple 20 %.'];

  /* ---------- Aiguillage ---------- */
  const SUG={global:['Que me conseilles-tu en priorité ?','Quels sont mes principaux risques ?','Quand arrivent mes échéances ?'],risk:['Comment mieux diversifier ?','Explique mon indice de fiabilité','Que faire si un projet est en retard ?'],divers:['Que me conseilles-tu en priorité ?','Combien j’ai de liquidités ?'],score:['Quels sont mes principaux risques ?','Comment mieux diversifier ?'],due:['Combien je touche d’intérêts ?','Fais le bilan de mon patrimoine'],income:['Impôt avec une TMI à 11 %','Quand arrivent mes échéances ?'],perf:['Fais le bilan de mon patrimoine','Comment mieux diversifier ?'],total:['Fais le bilan de mon patrimoine','Comment mieux diversifier ?'],tax:['C’est quoi le PFU ?','Combien je touche d’intérêts ?'],sim:['Simule 500 € par mois à 7 % pendant 20 ans','Quand vais-je atteindre mon objectif ?'],goal:['Simule 300 € par mois à 6 % pendant 15 ans','Que me conseilles-tu en priorité ?'],newproj:['Quelles garanties regarder ?','Comment mieux diversifier ?'],liquid:['C’est quoi l’épargne de précaution ?','Fais le bilan de mon patrimoine'],advice:['Quels sont mes principaux risques ?','Simule 300 € par mois à 6 % pendant 15 ans'],list:['Fais le bilan de mon patrimoine'],help:['Fais le bilan de mon patrimoine','Simule 200 € par mois à 5 % pendant 10 ans']};
  const FOL={global:'advice',risk:'divers',divers:'advice',score:'risk',due:'income',income:'tax',perf:'divers',total:'divers',advice:'risk',liquid:'advice'};
  const DATA=['global','risk','divers','score','due','income','perf','total','liquid','advice','list'];
  const DEF=/(c est quoi|qu est ce|definition|explique moi (le|la|les|l )|comment (ca )?(marche|fonctionne)|a quoi sert|difference entre|que choisir|avantages?|inconvenients?|c est quoi la difference)/;
  function run(id,q,o){
    const has=D.assets.length>0;
    if(DATA.includes(id)&&!has)return 'Vous n’avez pas encore de placement enregistré. Ajoutez-en un (bouton +) ou chargez les exemples depuis l’accueil, et je pourrai analyser votre situation.\n\nJe peux déjà répondre à des questions générales : « C’est quoi le crowdlending ? », « PEA ou assurance-vie ? », « Simule 200 € par mois à 5 % pendant 10 ans ».';
    switch(id){
      case 'hello':return pick(['Bonjour ! ','Bonjour, ravi de vous aider. '])+(has?`Votre patrimoine suivi s’élève à ${E(totals().tv)}. Que voulez-vous savoir ? Un bilan, vos risques, vos échéances, une simulation ?`:'Ajoutez vos placements pour une analyse personnalisée, ou posez-moi une question générale sur l’épargne et l’investissement.');
      case 'thanks':return pick(['Avec plaisir. ','Je vous en prie. '])+'Autre chose à examiner ?';
      case 'help':return aHelp();
      case 'global':return aGlobal();
      case 'risk':return aRisk();
      case 'divers':return aDivers();
      case 'score':return aScoreTxt();
      case 'due':return aDue();
      case 'income':return aIncome();
      case 'perf':return aPerf(o.cat);
      case 'total':return o.cat?aCat(o.cat):aTotal();
      case 'tax':return aTax(q);
      case 'sim':return aSim(q);
      case 'goal':return aGoal(q);
      case 'newproj':return aNew(q);
      case 'liquid':return aLiquid(q);
      case 'advice':return aAdvice();
      case 'list':return o.cat?aCat(o.cat):aList();
      case 'market':return aMarket(N(q));
    }
    return null;
  }
  function answer(q){
    const t=N(q);let out=null,id=null,sug=null;
    if(/^explique moi ce point de vigilance/.test(t)){out=aInsight(q);id='risk'}
    if(!out){
      const sc=scoreIn(t),top=sc[0],kb=scoreKB(t),P1=pers(t),def=DEF.test(t);
      const asset=D.assets.length?findAsset(t):null,plat=findPlat(t),cat=findCat(t),words=t.split(' ').length;
      const fol=/^(et|ok et|puis|aussi|detaille|developpe|plus de details?|pourquoi|c est a dire|precise|encore)( |$)/.test(t);
      if((top.id==='hello'||top.id==='thanks')&&top.s>=2&&words<=5&&(sc[1].s<2)){id=top.id}
      else if(kb.e&&((def&&!(P1&&top.s>=3&&DATA.includes(top.id)))||(kb.s>=4&&top.s<3)||(kb.e.all&&kb.s>=6))){out=kb.e.t;sug=kb.e.s||null;id='kb'}
      else if(asset&&(top.s<3||['total','perf','due','risk','score','income'].includes(top.id))){out=aAsset(asset);id='asset';ctx.asset=asset.id}
      else if(plat&&(top.s<3||['score','risk','total'].includes(top.id))&&!['newproj'].includes(top.id)){out=aPlat(plat);id='plat'}
      else if(top.s>=2||(top.s>0&&!cat)){id=top.id}
      else if(cat){out=aCat(cat);id='cat';ctx.cat=cat}
      else if(kb.e){out=kb.e.t;sug=kb.e.s||null;id='kb'}
      else if(fol&&ctx.rid&&FOL[ctx.rid]){id=FOL[ctx.rid]}
      else if(fol&&ctx.redo){out=ctx.redo();id=ctx.rid}
      else if(nums(q).some(x=>x.u==='%')&&nums(q).some(x=>x.u==='ans'||x.u==='mois')){id='sim'}
      if(!out&&id)out=run(id,q,{cat});
    }
    let fb=false;
    if(!out){fb=true;
      out=pick(['Je n’ai pas bien saisi la question.','Je ne suis pas sûr de comprendre.'])+' Je réponds le mieux à des questions sur vos placements (bilan, risques, diversification, échéances, revenus, performance), à des simulations chiffrées et aux notions de base (PEA, assurance-vie, crowdlending, PFU…).\n\nEssayez par exemple une des suggestions ci-dessous.';
      sug=['Fais le bilan de mon patrimoine','Quels sont mes principaux risques ?','Aide : que sais-tu faire ?'];
    }
    if(id&&out&&id!=='kb'&&!fb){const o=out;ctx.rid=id;ctx.redo=()=>o}
    return{t:out,sug:sug||SUG[id]||(D.assets.length?['Fais le bilan de mon patrimoine','Que me conseilles-tu en priorité ?']:null)};
  }
  /* Rapport local sur un contrat importé */
  function report(r){
    const T=totals(),g=r.g||[],fl=r.fl||[];let sc=50+Math.min(3,g.length)*8-fl.length*8-(r.rate>12?10:0);sc=Math.max(5,Math.min(90,sc));
    let s=`#### Analyse locale du document\n- Projet : ${r.name||'non détecté'}\n- Plateforme : ${r.plat||'non détectée'}, porteur : ${r.prom||'non détecté'}\n- Montant : ${r.amount?E(r.amount):'non détecté'}, taux : ${r.rate!=null?P(r.rate):'non détecté'}, durée : ${r.dur?r.dur+' mois':'non détectée'}\n`;
    s+='\n#### Garanties\n'+(g.length?g.map(x=>'- '+x).join('\n')+'\n- Vérifiez le rang de l’hypothèque et qui se porte caution : la maison mère vaut mieux qu’une société de projet sans actifs.':'- Aucune garantie reconnue dans le texte : point à éclaircir avant d’investir.');

    s+='\n\n#### Questions à poser à la plateforme\n1. Quel est le rang exact des garanties, et leur valeur par rapport à la dette ?\n2. Quel apport le porteur met-il dans l’opération ?\n3. Le permis est-il purgé, et quel est le taux de précommercialisation ?\n4. Dans quels cas la durée peut-elle être prolongée, et à quel taux ?\n5. Quel est l’historique de retards et de défauts de ce porteur sur la plateforme ?';
    s+=`\n\n#### Verdict prudent\nNote indicative du dossier : **${sc}/100** (${label(sc).toLowerCase()}).`+(T.tv>0?` Par prudence, un ticket de l’ordre de ${E(Math.max(100,Math.round(T.tv*.03/50)*50))} au plus (environ 3 % de votre patrimoine) limiterait l’impact d’un défaut.`:'');
    return s+'\n\nAnalyse automatique par mots-clés : elle ne remplace pas la lecture complète du contrat.';
  }
  return{answer,report,reset:()=>{ctx={}}};

const CATAL={bourse:'bourse',crowd:'crowd',crowdlending:'crowd',immo:'immo',immobilier:'immo',epargne:'epargne','épargne':'epargne',cash:'cash',liquidites:'cash','liquidités':'cash',autre:'autre'};
const STAL={'':'cours',cours:'cours','en cours':'cours',rembourse:'rembourse','remboursé':'rembourse',retard:'retard','en retard':'retard',defaut:'defaut','défaut':'defaut'};
const CSVT='catégorie;nom;plateforme;montant;valeur;taux;durée;statut;date;quantité;pru;ticker\ncrowd;Résidence des Lilas;Bienprêter;5000;5000;9,5;24;cours;2026-01-15;;;\nbourse;ETF Monde;;;;;;;;10;480;CW8.PA\ncash;Livret A;Ma banque;4500;4500;1,5;;;;;;\n';
function parseCSV(t){
  const ok=[],bad=[];
  String(t).split(/\r?\n/).forEach((l,i)=>{
    if(!l.trim())return;
    const c=l.split(/[;\t]/.test(l)?/[;\t]/:/,/).map(x=>x.trim().replace(/^"|"$/g,'')),cat=CATAL[c[0].toLowerCase()];
    if(!cat){if(!(i===0&&/cat/i.test(c[0])))bad.push('Ligne '+(i+1)+' : catégorie « '+c[0]+' » inconnue');return}
    if(c.length<4||!c[1]){bad.push('Ligne '+(i+1)+' : nom et montant attendus');return}
    const a={id:newId(),cat,name:c[1],status:STAL[(c[7]||'').toLowerCase()]||'cours'};
    let dt=c[8]||'';const m=dt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)dt=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(/^\d{4}-\d{2}-\d{2}$/.test(dt))a.date=dt;
    if(cat==='bourse'){a.tick=(c[11]||'').toUpperCase();a.qty=num(c[9])||1;a.pru=num(c[10])||(num(c[9])?0:num(c[3]));}
    else{a.plat=c[2]||(isRisky(a)?'Autre plateforme':'');a.amount=num(c[3]);a.value=c[4]===''||c[4]==null?'':num(c[4]);a.rate=c[5]?num(c[5]):'';a.dur=c[6]?num(c[6]):''}
    ok.push(a);
  });
  return{ok,bad};
}

async function gemContract(){
  const o=$('imp-g'),f=$('imp-f').files[0],txt=IMP.text||$('imp-t').value||'',p=aiProv(),img=txt.trim().length<=30&&!!f;o.style.color='';

  if(img&&!keyOf('gemini')){o.style.color='var(--red)';o.textContent='Ce document est un scan ou une photo : sa lecture demande une clé Gemini (Réglages, Assistant IA).';return}
  if(!img&&(p==='local'||!keyOf(p)||navigator.onLine===false)){loc();return}
  o.textContent='Analyse en cours, cela peut prendre jusqu’à une minute…';
  try{
    const parts=[];

    parts.push({text:'Analyse ce contrat ou cette fiche de placement participatif. Donne : 1) résumé (montant, taux, durée, remboursement) 2) garanties réelles et leur solidité (rang de l’hypothèque, caution de qui, GAPD…) 3) clauses risquées (prorogation, subordination, frais) 4) société emprunteuse et son groupe si mentionnés 5) 5 questions à poser à la plateforme 6) verdict prudent et conseil (part maximale du patrimoine à y mettre).'});

/* --- Chiffrement : AES-GCM 256, clé dérivée (PBKDF2) de la phrase secrète. Tout est chiffré sur l'appareil avant l'envoi. --- */
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYS=new Map();let SALT=null;
function deriveKey(pass,salt){
  const k=pass+'\u0000'+b64(salt);
  if(!KEYS.has(k))KEYS.set(k,(async()=>{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})());
  return KEYS.get(k);
}
async function seal(obj,pass,extra){
  SALT=SALT||crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pass,SALT),new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify(Object.assign({app:'patrimoine',v:1,at:new Date().toISOString(),salt:b64(SALT),iv:b64(iv)},extra||{},{ct:b64(new Uint8Array(ct))}));
}
async function unseal(txt,pass){
  const o=typeof txt==='string'?JSON.parse(txt):txt;
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await deriveKey(pass,unb64(o.salt)),unb64(o.ct))))}
  catch(e){const x=Error('Phrase secrète incorrecte pour cette sauvegarde.');x.st=403;throw x}
}

/* --- GitHub : jeton « gist » + gists secrets (aucun serveur, aucun compte QuenTools) --- */
const KGH='pat_gh_token',KPW='pat_pass',KGI='pat_gist',KGU='pat_gh_user';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const GIST_DESC='Patrimoine AI — sauvegarde chiffrée (produit par QuenTools, ne pas modifier)',MAIN='patrimoine-sauvegarde.enc.json';
async function ghf(path,opt){
  const t=lsGet(KGH);if(!t){const e=Error('Connectez-vous à GitHub (Réglages).');e.st=401;throw e}
  opt=opt||{};let r;
  try{r=await tfetch('https://api.github.com'+path,{method:opt.method||'GET',cache:'no-store',body:opt.body,headers:Object.assign({Authorization:'Bearer '+t,Accept:'application/vnd.github+json'},opt.body?{'Content-Type':'application/json'}:{})},30000)}
  catch(e){throw Error('GitHub injoignable (connexion internet ?)')}
  if(r.status===401){const e=Error('Jeton GitHub refusé ou expiré : reconnectez-vous.');e.st=401;throw e}
  if(r.status===403){const e=Error('GitHub refuse l’accès : le jeton doit avoir le droit « gist » (ou limite atteinte, réessayez plus tard).');e.st=403;throw e}
  if(r.status===404)return null;
  if(!r.ok)throw Error('GitHub a répondu '+r.status);
  return r;
}
async function gistFind(create){
  let id=lsGet(KGI);if(id&&await ghf('/gists/'+id))return id;lsSet(KGI,null);
  for(let p=1;p<=5;p++){const l=await(await ghf('/gists?per_page=100&page='+p)).json();
    const g=l.find(x=>x.description===GIST_DESC&&x.files[MAIN]);if(g){lsSet(KGI,g.id);return g.id}if(l.length<100)break}
  if(!create)return null;
  const g=await(await ghf('/gists',{method:'POST',body:JSON.stringify({description:GIST_DESC,public:false,files:{[MAIN]:{content:'{}'}}})})).json();
  lsSet(KGI,g.id);return g.id;
}
const gfile=async f=>f?(f.truncated?(await fetch(f.raw_url,{cache:'no-store'})).text():f.content):null;
async function gistRead(){ /* -> {id,files} */
  const id=await gistFind(false);if(!id)return null;
  const g=await(await ghf('/gists/'+id)).json();return{id,files:g.files};
}
function passOf(){const p=lsGet(KPW);if(!p){const e=Error('Phrase secrète manquante : reconnectez-vous.');e.st=401;throw e}return p}
async function mainDoc(g){ /* enveloppe en clair {rev,at,dev} + données déchiffrées à la demande */
  const t=g&&g.files[MAIN]?await gfile(g.files[MAIN]):null;if(!t||t==='{}')return{rev:0,env:null};
  return{rev:JSON.parse(t).rev||0,env:JSON.parse(t)};
}
async function gsync(path,opt){
  const u=new URL(path,location.origin),q=u.searchParams,m=opt.method||'GET',pass=passOf();
  if(m==='GET'){
    const g=await gistRead();
    if(q.has('backups')){return{backups:g?Object.keys(g.files).map(n=>(n.match(/^sauvegarde-(\d{4}-\d{2}-\d{2})\.enc\.json$/)||[])[1]).filter(Boolean).sort().reverse():[]}}
    if(q.get('backup')){const d=q.get('backup'),f=g&&g.files['sauvegarde-'+d+'.enc.json'];if(!f)throw Error('Sauvegarde introuvable');const doc=await unseal(await gfile(f),pass);return{data:doc.data}}
    const cur=await mainDoc(g),since=Number(q.get('since'));
    if(!cur.env)return{rev:0,data:null};
    if(since&&since===cur.rev)return{rev:cur.rev,same:true};
    const doc=await unseal(cur.env,pass);return{rev:cur.rev,data:doc.data,at:cur.env.atMs||0,dev:doc.dev||''};
  }
  if(m==='PUT'){
    const b=JSON.parse(opt.body),g=await gistRead(),cur=await mainDoc(g);
    if((Number(b.baseRev)||0)!==cur.rev){const doc=await unseal(cur.env,pass);return{_st:409,conflict:true,rev:cur.rev,data:doc.data,at:cur.env.atMs||0}}
    const rev=cur.rev+1,at=Date.now(),id=g?g.id:await gistFind(true),day=new Date().toISOString().slice(0,10);
    const txt=await seal({data:b.data,dev:String(b.dev||'').slice(0,60)},pass,{rev,atMs:at});
    if(txt.length>9e6)throw Error('Données trop volumineuses pour la sauvegarde GitHub');
    const files={[MAIN]:{content:txt},['sauvegarde-'+day+'.enc.json']:{content:txt}};
    const old=Object.keys((g&&g.files)||{}).filter(n=>/^sauvegarde-\d{4}-\d{2}-\d{2}\.enc\.json$/.test(n)&&n!=='sauvegarde-'+day+'.enc.json').sort().reverse().slice(29);
    old.forEach(n=>{files[n]=null});
    if(!await ghf('/gists/'+id,{method:'PATCH',body:JSON.stringify({files})})){lsSet(KGI,null);throw Error('Sauvegarde GitHub introuvable, réessayez.')}
    return{rev,at};
  }
  throw Error('Opération non prise en charge');
}
async function api(path,opt,ms){
  opt=opt||{};let d;
  if(path.indexOf('/api/sync')===0)d=await gsync(path,opt);
  else throw Error('Service non disponible dans cette version.');
  d._st=d._st||200;return d;
}
