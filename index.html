const CATAL={bourse:'bourse',crowd:'crowd',crowdlending:'crowd',immo:'immo',immobilier:'immo',epargne:'epargne','épargne':'epargne',cash:'cash',liquidites:'cash','liquidités':'cash',autre:'autre',bien:'bien','immobilier physique':'bien',residence:'bien','résidence':'bien',logement:'bien',credit:'credit','crédit':'credit',pret:'credit','prêt':'credit',emprunt:'credit'};
const STAL={'':'cours',cours:'cours','en cours':'cours',rembourse:'rembourse','remboursé':'rembourse',retard:'retard','en retard':'retard',defaut:'defaut','défaut':'defaut'};
const CSVT='catégorie;nom;plateforme;montant;valeur;taux;durée;statut;date;quantité;pru;ticker\ncrowd;Résidence des Lilas;Bienprêter;5000;5000;9,5;24;cours;2026-01-15;;;\nbourse;ETF Monde;;;;;;;;10;480;CW8.PA\ncash;Livret A;Ma banque;4500;4500;1,5;;;;;;\n';
function parseCSV(t){
  const ok=[],bad=[];
  String(t).split(/\r?\n/).forEach((l,i)=>{
    if(!l.trim())return;
    const c=l.split(/[;\t]/.test(l)?/[;\t]/:/,/).map(x=>x.trim().replace(/^"|"$/g,'')),cat=CATAL[c[0].toLowerCase()];
    if(!cat){if(!(i===0&&/cat/i.test(c[0])))bad.push('Ligne '+(i+1)+' : catégorie « '+c[0]+' » inconnue');return}
    if(c.length<4||!c[1]){bad.push('Ligne '+(i+1)+' : nom et montant attendus');return}
    const a={id:newId(),cat,name:c[1],status:STAL[(c[7]||'').toLowerCase()]||'cours'};
    let dt=c[8]||'';const m=dt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)dt=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(/^\d{4}-\d{2}-\d{2}$/.test(dt))a.date=dt;
    if(cat==='bourse'){a.tick=(c[11]||'').toUpperCase();a.qty=num(c[9])||1;a.pru=num(c[10])||(num(c[9])?0:num(c[3]));}
    else{a.plat=c[2]||(isRisky(a)?'Autre plateforme':'');a.amount=num(c[3]);a.value=c[4]===''||c[4]==null?'':num(c[4]);a.rate=c[5]?num(c[5]):'';a.dur=c[6]?num(c[6]):''}
    ok.push(a);
  });
  return{ok,bad};
}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
/* Sauvegarde exportée : chiffrée par défaut (AES-GCM 256, clé PBKDF2 de 600 000 tours tirée du mot de passe, sel propre au fichier).
   En clair seulement sur demande explicite : un fichier de sauvegarde finit souvent dans un e-mail ou un nuage. */
async function sealExport(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({app:'patrimoine',export:1,v:1,it:600000,at:new Date().toISOString(),salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))});
}
async function unsealExport(o,pass){
  try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(o.salt),iterations:Math.min(5e6,Math.max(1e5,+o.it||600000)),hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.ct))))}
  catch(e){throw Error('Mot de passe incorrect pour cette sauvegarde.')}
}

/* Mot de passe ou phrase secrète assez solide : 12 caractères au moins, pas une suite ni un mot de passe courant ; '' si c'est bon */
function forcePhrase(p){
  p=String(p||'');const b=p.toLowerCase().replace(/\s+/g,'');
  if(p.length<12)return 'Trop court : 12 caractères au moins (une petite phrase de 3 ou 4 mots est idéale).';
  if(/^(.)\1+$/.test(b)||/^(0123456789|1234567890|azertyuiop|qwertyuiop|abcdefghijkl)/.test(b)||/^(motdepasse|password|patrimoine|azerty|qwerty|123456|soleil|bonjour|doudou)/.test(b))return 'Trop facile à deviner : choisissez une petite phrase à vous.';
  if(new Set(b).size<6)return 'Trop répétitif : variez les caractères.';
  return '';
}

/* Test de connexion détaillé : dit précisément ce qui bloque */
async function openDiag(pv){
  const p=pv||keyProv();
  sheet('Test de connexion '+PROV[p].n,`<div id="dg"></div><div id="dg2"></div>`);
  const o=$('dg'),line=(ok,t,sub)=>{if(!$('dg'))return;o.insertAdjacentHTML('beforeend',`<div class="dgl"><span style="color:${ok===null?'var(--mut)':ok?'var(--ok)':'var(--red)'}">${ic(ok===null?'refresh':ok?'check':'alert',20)}</span><div><b>${esc(t)}</b>${sub?`<div class="sm mut" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(sub)}</div>`:''}</div></div>`)},pop=()=>{if($('dg')&&o.lastChild)o.lastChild.remove()};
  line(navigator.onLine!==false,'Connexion Internet',navigator.onLine===false?'L’appareil semble hors ligne. L’IA locale reste disponible.':'Appareil en ligne.');
  if(p==='grok'){
    const k=localStorage.getItem(KX);if(!k){line(false,'Aucune clé xAI enregistrée');return}
    line(/^xai-/.test(k),'Format de la clé',/^xai-/.test(k)?'Commence bien par xai-.':'Une clé xAI commence normalement par xai-.');
    line(null,'Essai de réponse…');const t0=Date.now();
    try{await grok('Réponds uniquement : OK');pop();line(true,'Grok répond',LASTM+', en '+nf((Date.now()-t0)/1000,1)+' s.')}catch(e){pop();line(false,'Grok ne répond pas',e.message)}
    return;
  }
  if(srvAI()){
    line(null,'Essai de Gemini…');const t0=Date.now();
    try{const r=await api('/api/ai',{},60000);pop();
      if(r.ok)line(true,'Gemini répond via '+r.label,'Modèle '+r.model+', en '+nf((Date.now()-t0)/1000,1)+' s. Compte : '+r.user+'.');
      else line(false,'Gemini ne répond pas via '+r.label,(r.errors||[]).map(x=>x.m+' : '+x.t).join('\n')||'Aucun détail.');
    }catch(e){pop();line(false,'Gemini injoignable ou accès refusé',e.message)}
    return;
  }
  const k=localStorage.getItem(KK);
  if(!k){line(false,'Aucune clé Gemini enregistrée','Ajoutez-la dans les réglages. L’IA locale fonctionne sans clé.');return}
  line(/^AIza[0-9A-Za-z_-]{35}$/.test(k),'Format de la clé',!/^AIza/.test(k)?'La clé ne commence pas par AIza : ce n’est probablement pas une clé Gemini API.':k.length!==39?'Longueur inhabituelle ('+k.length+' caractères au lieu de 39) : la clé est peut-être tronquée.':'Correct : 39 caractères, commence par AIza.');
  line(null,'Vérification de la clé auprès de Google…');let t0=Date.now(),L=[];
  try{L=await gList(k,true);pop();line(true,'Clé acceptée par Google',L.length+' modèle(s) de texte disponibles, dont '+L.slice(0,3).join(', ')+'. Réponse en '+(Date.now()-t0)+' ms, méthode '+['en-tête','paramètre d’adresse','requête simple'][+localStorage.getItem(KGT)||0]+'.')}
  catch(e){pop();line(false,'Clé ou accès refusé',(GMSG[e.kind]?GMSG[e.kind]+'\n\n':'')+'Réponse de Google : '+e.message);return}
  line(null,'Essai de génération de texte…');t0=Date.now();
  try{const r=await gem([{text:'Réponds uniquement : OK'}]);pop();line(true,'Gemini répond',LASTM+', en '+nf((Date.now()-t0)/1000,1)+' s. Réponse : « '+r.slice(0,30)+' ».')}
  catch(e){pop();line(false,'Génération impossible',e.message)}
  if($('dg2'))$('dg2').innerHTML=`<p class="hint mt">Les modèles qui échouent (introuvables, hors offre gratuite, quota du jour atteint) sont automatiquement écartés pendant quelques heures, et le suivant est essayé. Vous pouvez aussi imposer un modèle dans les réglages.</p><button class="btn blk mt" data-act="closeM">Fermer</button>`;

      const n=bouts.reduce((s,b)=>s+b.length,0),son=new Float32Array(n);let k=0;bouts.forEach(b=>{son.set(b,k);k+=b.length});

/* --- Chiffrement : AES-GCM 256, clé dérivée (PBKDF2) de la phrase secrète. Tout est chiffré sur l'appareil avant l'envoi. --- */
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYS=new Map();let SALT=null;
function deriveKey(pass,salt){
  const k=pass+'\u0000'+b64(salt);
  if(!KEYS.has(k))KEYS.set(k,(async()=>{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})());
  return KEYS.get(k);
}
async function seal(obj,pass,extra){
  SALT=SALT||crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pass,SALT),new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify(Object.assign({app:'patrimoine',v:1,at:new Date().toISOString(),salt:b64(SALT),iv:b64(iv)},extra||{},{ct:b64(new Uint8Array(ct))}));
}
async function unseal(txt,pass){
  const o=typeof txt==='string'?JSON.parse(txt):txt;
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await deriveKey(pass,unb64(o.salt)),unb64(o.ct))))}
  catch(e){const x=Error('Phrase secrète incorrecte pour cette sauvegarde.');x.st=403;throw x}
}

/* --- Google (Firebase Auth) + Firestore : sauvegarde chiffrée, aucun serveur à gérer --- */
const KPW='pat_pass',KGU='pat_user',FBV='10.14.1',APP_ID='patrimoine'; /* une entrée par app : users/{uid}/apps/{APP_ID} */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const MAXENC=950000; /* limite d'un document Firestore ≈ 1 Mo */
let FBP=null;
function fb(){ /* charge le SDK Firebase à la demande */
  if(!CFG.firebase||!CFG.firebase.apiKey)return Promise.reject(Error('Firebase non configuré (config.js).'));
  if(!FBP)FBP=(async()=>{
    const B='https://www.gstatic.com/firebasejs/'+FBV+'/',[A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(CFG.firebase);return{A,Au,Fs,auth:Au.getAuth(app),db:Fs.getFirestore(app)};
  })().catch(e=>{FBP=null;throw Error('Service Google injoignable (connexion internet ?)')});
  return FBP;
}
async function fbUser(){ /* utilisateur Firebase courant (attend la restauration de session) */
  const F=await fb();await F.auth.authStateReady();
  if(!F.auth.currentUser){const e=Error('Connectez-vous avec Google (Réglages).');e.st=401;throw e}
  return{F,u:F.auth.currentUser};
}
function fbErr(e){
  const c=e&&e.code||'';
  if(c==='permission-denied'){const x=Error('Accès refusé par Firestore : publiez les règles de sécurité (voir README).');x.st=403;return x}
  if(c==='unavailable'||c==='deadline-exceeded'||c==='auth/network-request-failed')return Error('Google injoignable (connexion internet ?)');
  if(c==='resource-exhausted')return Error('Quota Firestore gratuit atteint, réessayez plus tard.');
  if(c==='failed-precondition'||c==='not-found'){const x=Error('Base Firestore introuvable : créez-la dans la console Firebase (voir README).');x.st=403;return x}
  return e;
}
const uref=(F,u,...p)=>F.Fs.doc(F.db,'users',u.uid,'apps',APP_ID,...p);
function passOf(){const p=lsGet(KPW);if(!p){const e=Error('Phrase secrète manquante : reconnectez-vous.');e.st=401;throw e}return p}
async function mainDoc(F,u){ /* enveloppe {rev,env} ; env = objet chiffré */
  const s=await F.Fs.getDoc(uref(F,u));const t=s.exists()?s.data().main:null;
  if(!t||t==='{}')return{rev:0,env:null};
  const env=JSON.parse(t);return{rev:env.rev||0,env};
}
async function gsync(path,opt){
  const u0=new URL(path,location.origin),q=u0.searchParams,m=opt.method||'GET',pass=passOf();
  const{F,u}=await fbUser();
  try{
    if(m==='GET'){
      if(q.has('backups')){const s=await F.Fs.getDocs(F.Fs.collection(F.db,'users',u.uid,'apps',APP_ID,'backups'));return{backups:s.docs.map(d=>d.id).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse()}}
      if(q.get('backup')){const s=await F.Fs.getDoc(uref(F,u,'backups',q.get('backup')));if(!s.exists())throw Error('Sauvegarde introuvable');const doc=await unseal(JSON.parse(s.data().txt),pass);return{data:doc.data}}
      const cur=await mainDoc(F,u),since=Number(q.get('since'));
      if(!cur.env)return{rev:0,data:null};
      if(since&&since===cur.rev)return{rev:cur.rev,same:true};
      const doc=await unseal(cur.env,pass);return{rev:cur.rev,data:doc.data,at:cur.env.atMs||0,dev:doc.dev||''};
    }
    if(m==='PUT'){
      const b=JSON.parse(opt.body),day=new Date().toISOString().slice(0,10),ref=uref(F,u);
      let cf=null;
      /* on chiffre avec la révision suivante, en s'appuyant sur une lecture transactionnelle de la révision courante */
      const cur0=await mainDoc(F,u);
      if((Number(b.baseRev)||0)!==cur0.rev){const doc=cur0.env?await unseal(cur0.env,pass):null;return{_st:409,conflict:true,rev:cur0.rev,data:doc?doc.data:null,at:cur0.env?cur0.env.atMs||0:0}}
      const rev=cur0.rev+1,at=Date.now(),txt=await seal({data:b.data,dev:String(b.dev||'').slice(0,60)},pass,{rev,atMs:at});
      if(txt.length>MAXENC)throw Error('Données trop volumineuses pour la sauvegarde (limite ≈ 1 Mo chiffré).');
      await F.Fs.runTransaction(F.db,async tx=>{
        const s=await tx.get(ref),t=s.exists()?s.data().main:null,r=t&&t!=='{}'?(JSON.parse(t).rev||0):0;
        if(r!==cur0.rev){cf={rev:r,t};return}
        tx.set(ref,{main:txt,rev,at},{merge:true});
        tx.set(uref(F,u,'backups',day),{txt,rev,at});
      });
      if(cf){const env=JSON.parse(cf.t),doc=await unseal(env,pass);return{_st:409,conflict:true,rev:cf.rev,data:doc.data,at:env.atMs||0}}
      /* ne garder que les 30 dernières sauvegardes quotidiennes */
      try{const s=await F.Fs.getDocs(F.Fs.collection(F.db,'users',u.uid,'apps',APP_ID,'backups')),ids=s.docs.map(d=>d.id).sort().reverse().slice(30);
        await Promise.all(ids.map(id=>F.Fs.deleteDoc(uref(F,u,'backups',id))))}catch(e){}
      return{rev,at};
    }
  }catch(e){throw fbErr(e)}
  throw Error('Opération non prise en charge');
}
async function api(path,opt,ms){
  opt=opt||{};let d;
  if(path.indexOf('/api/sync')===0)d=await gsync(path,opt);
  else throw Error('Service non disponible dans cette version.');
  d._st=d._st||200;return d;
}

const SF=['goal','goals','budget','plat','lastBackup','chat','watch','alerts','target','ops','regles','fire','bank','rappels'];
let SNAP=null;
const ajson=a=>{const o=Object.assign({},a);delete o.u;return JSON.stringify(o)};
const snapOf=()=>({a:Object.fromEntries(D.assets.map(a=>[a.id,ajson(a)])),f:Object.fromEntries(SF.map(f=>[f,JSON.stringify(D[f]===undefined?null:D[f])]))});
function track(){
  D.del=D.del&&typeof D.del==='object'?D.del:{};D.mt=D.mt&&typeof D.mt==='object'?D.mt:{};
  if(!SNAP){SNAP=snapOf();return false}
  const now=Date.now(),seen={};let ch=false;
  D.assets.forEach(a=>{const j=ajson(a);seen[a.id]=1;if(SNAP.a[a.id]!==j){a.u=now;ch=true}});
  Object.keys(SNAP.a).forEach(id=>{if(!seen[id]){D.del[id]=now;ch=true}});
  SF.forEach(f=>{if(SNAP.f[f]!==JSON.stringify(D[f]===undefined?null:D[f])){D.mt[f]=now;ch=true}});

  marches:['Marchés et bourse','bourse OR CAC 40 OR Wall Street OR marchés actions','trend'],
  tech:['Technologie','technologie OR intelligence artificielle OR semi-conducteurs OR Nvidia OR Apple OR start-up','cpu'],
  energie:['Pétrole et énergie','pétrole OR OPEP OR gaz naturel OR prix de l’énergie OR électricité','sun'],
  matieres:['Or et matières premières','cours de l’or OR cuivre OR matières premières OR blé','coins'],
  taux:['Banques centrales et taux','BCE OR Fed OR taux directeur OR inflation OR taux d’intérêt','bank'],
  immo:['Immobilier','immobilier OR crédit immobilier OR taux immobilier OR SCPI','house'],
  crypto:['Crypto','bitcoin OR ethereum OR cryptomonnaies','gem'],
  banques:['Banques et assurance','banques OR assurance OR assurance-vie','shield'],
  industrie:['Industrie et automobile','industrie OR automobile OR aéronautique OR Airbus','building'],
  conso:['Luxe et consommation','luxe OR LVMH OR consommation OR distribution','card'],
  sante:['Santé et pharmacie','pharmacie OR laboratoire pharmaceutique OR Sanofi OR Novo Nordisk','users'],
  emploi:['Emploi et conjoncture','emploi OR chômage OR PIB OR récession OR conjoncture','calc'],
  epargne:['Épargne et placements','livret A OR assurance-vie OR PEA OR épargne OR placements','wallet'],
  mes:['Mes placements','','star']
};
const NRG={monde:['Monde',''],france:['France','France'],europe:['Europe','(Europe OR zone euro OR UE OR Allemagne)'],usa:['États-Unis','(États-Unis OR Wall Street OR américain)'],asie:['Asie','(Asie OR Chine OR Japon OR Inde OR Corée)'],chine:['Chine','Chine'],japon:['Japon','Japon'],moyen:['Moyen-Orient','(Moyen-Orient OR Arabie saoudite OR Golfe OR Iran OR Israël)'],latam:['Amérique latine','(Amérique latine OR Brésil OR Mexique OR Argentine)'],afrique:['Afrique','Afrique']};
const NW={items:[],at:0,busy:false,err:'',key:'',q:'',per:'2d'};
const newsLabel=()=>{const t=NTH[D.set.nth]||NTH.une,g=NRG[D.set.nrg]||NRG.monde;return t[0]+(D.set.nrg&&D.set.nrg!=='monde'?' · '+g[0]:'')};
function newsMine(){
  const N=[...new Set(D.assets.filter(a=>a.cat==='bourse'&&a.name).map(a=>String(a.name).replace(/\(exemple\)/i,'').replace(/\b(ETF|UCITS|Acc|Dist|EUR|C)\b/g,'').trim()).filter(n=>n.length>=3))].slice(0,8);
  const P=[...new Set(D.assets.filter(a=>(a.cat==='crowd'||a.cat==='immo')&&a.plat&&a.plat!=='Autre plateforme').map(a=>a.plat))].slice(0,4);
  return N.concat(P).map(x=>'"'+x.replace(/"/g,'')+'"').join(' OR ');
}
function newsQuery(th,rg,free){
  let base=free||(th==='mes'?newsMine():(NTH[th]||NTH.une)[1]);if(!base)return '';
  const reg=(NRG[rg]||NRG.monde)[1];
  return '('+base+')'+(reg?' '+reg:'')+' when:'+NW.per;
}
const newsUrl=q=>'https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=fr&gl=FR&ceid=FR:fr';
async function newsGet(url){
  if(MAC){const r=await tfetch(url,{},15000);if(!r.ok)throw Error('Google Actualités ne répond pas (erreur '+r.status+').');const t=await r.text();if(!/<rss|<item/i.test(t))throw Error('Google Actualités a renvoyé une page inattendue : réessayez plus tard.');return t}
  for(const px of PROXIES()){try{const r=await tfetch(px+encodeURIComponent(url),{},12000);if(r.ok){const t=await r.text();if(/<rss|<item/i.test(t))return t}}catch(e){}}
  throw Error('Actualités indisponibles pour le moment (connexion ou relais bloqué).');
}
function newsParse(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml'),out=[],seen=new Set();
  doc.querySelectorAll('item').forEach(it=>{
    const g=s=>{const e=it.querySelector(s);return e?e.textContent.trim():''};
    const src=g('source'),link=g('link'),t0=g('title'),t=src&&t0.endsWith(' - '+src)?t0.slice(0,-(src.length+3)):t0.replace(/ - [^-]{2,40}$/,'');
    const ts=Date.parse(g('pubDate'))||0,k=t.toLowerCase().replace(/[^a-z0-9à-ÿ]/g,'').slice(0,60);
    if(!t||!/^https:\/\//.test(link)||seen.has(k))return;seen.add(k);out.push({t,u:link,s:src||'Presse',ts});
  });
  return out.sort((a,b)=>b.ts-a.ts).slice(0,40);
}
/* Source de secours si Google Actualités ne répond pas : la recherche de Yahoo Finance (titres en anglais) */
const NEN={une:'economy markets',marches:'stock market',tech:'technology stocks',energie:'oil prices OPEC',matieres:'gold commodities',taux:'ECB Fed interest rates',immo:'real estate housing market',crypto:'bitcoin crypto',banques:'banks insurers',industrie:'automakers industry',conso:'luxury retail',sante:'pharma',emploi:'jobs economy',epargne:'savings',mes:''};
const NREN={monde:'',france:'France',europe:'Europe',usa:'US',asie:'Asia',chine:'China',japon:'Japan',moyen:'Middle East',latam:'Latin America',afrique:'Africa'};
async function newsYahoo(text){
  const d=await yget('/v1/finance/search?q='+encodeURIComponent(text.slice(0,80))+'&quotesCount=0&newsCount=20');
  const L=(d&&d.news||[]).filter(n=>n.title&&/^https:\/\//.test(n.link||'')).map(n=>({t:n.title,u:n.link,s:n.publisher||'Yahoo Finance',ts:(n.providerPublishTime||0)*1000,en:1}));
  if(!L.length)throw Error('Actualités indisponibles pour le moment.');return L.sort((a,b)=>b.ts-a.ts);
}
const NCACHE=new Map();
async function newsFetch(q,alt){
  const hit=NCACHE.get(q);if(hit&&Date.now()-hit.at<10*60e3)return hit.items;
  let items;
  try{items=newsParse(await newsGet(newsUrl(q)))}
  catch(e){if(!alt)throw e;try{items=await newsYahoo(alt)}catch(x){throw e}}
  NCACHE.set(q,{at:Date.now(),items});return items;
}
const newsAlt=(th,rg,free)=>free?free:th==='mes'?D.assets.filter(a=>a.cat==='bourse'&&a.name).map(a=>a.name).slice(0,2).join(' '):[NEN[th]||NEN.une,NREN[rg]||''].join(' ').trim();
async function newsLoad(force){
  if(!HOSTED){NW.err='file';renderNews();return}
  const q=newsQuery(D.set.nth||'une',D.set.nrg||'monde',NW.q.trim());
  if(!q){NW.items=[];NW.err='';NW.key='';renderNews();return}
  if(!force&&NW.key===q&&Date.now()-NW.at<10*60e3)return;
  if(force)NCACHE.delete(q);NW.busy=true;NW.key=q;renderNews();
  try{const items=await newsFetch(q,newsAlt(D.set.nth||'une',D.set.nrg||'monde',NW.q.trim()));if(NW.key!==q)return;NW.items=items;NW.at=Date.now();NW.err='';try{localStorage.setItem('pat_news',JSON.stringify({q,at:NW.at,items:items.slice(0,20)}))}catch(e){}}
  catch(e){if(NW.key!==q)return;NW.err=e.message;let old=null;try{old=JSON.parse(localStorage.getItem('pat_news')||'null')}catch(x){}if(old&&old.q===q){NW.items=old.items;NW.at=old.at;NW.err+=' Dernières nouvelles enregistrées affichées.'}}
  finally{if(NW.key===q){NW.busy=false;renderNews();newsMini();setTitle()}}
}
const ago=ts=>{if(!ts)return '';const m=Math.round((Date.now()-ts)/60e3);if(m<1)return 'à l’instant';if(m<60)return 'il y a '+m+' min';const h=Math.round(m/60);if(h<24)return 'il y a '+h+' h';const d=Math.round(h/24);return d===1?'hier':'il y a '+d+' jours'};
const newsRow=(n,big)=>`<a class="nwi${big?' nwbig':''}" href="${esc(n.u)}" target="_blank" rel="noopener noreferrer"><span class="nws"><i>${esc((n.s||'?').slice(0,1).toUpperCase())}</i>${esc(n.s)} · ${esc(ago(n.ts))}</span><b>${esc(n.t)}</b></a>`;
function renderNews(){
  const el=$('v-news');if(!el)return;const th=D.set.nth||'une',rg=D.set.nrg||'monde';
  if(!HOSTED){el.innerHTML='<section class="card"><h3>Actualités</h3><p class="sm mut" style="margin-top:6px">Les actualités s’affichent quand l’application est ouverte en ligne ou dans l’application Mac.</p></section>';return}
  const keep=document.activeElement&&document.activeElement.id==='nw-q';
  let h=`<section class="card"><div class="lbl">Région</div><div class="chips">${Object.entries(NRG).map(([k,v])=>`<button class="chip${rg===k?' on':''}" data-act="nrg" data-v="${k}">${esc(v[0])}</button>`).join('')}</div>
  <div class="lbl" style="margin-top:10px">Thème</div><div class="chips" style="flex-wrap:wrap">${Object.entries(NTH).map(([k,v])=>`<button class="chip${th===k&&!NW.q.trim()?' on':''}" data-act="nth" data-v="${k}">${ic(v[2],14)}${esc(v[0])}</button>`).join('')}</div>
  <div class="tools" style="margin:12px 0 0"><input id="nw-q" type="search" placeholder="Ou cherchez un sujet : Airbus, Tesla, SCPI, inflation…" value="${esc(NW.q)}" data-in="nwq" aria-label="Chercher un sujet"><select data-ch="nper" aria-label="Période">${[['1d','24 heures'],['2d','2 jours'],['7d','7 jours'],['30d','30 jours']].map(o=>`<option value="${o[0]}"${NW.per===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select><button class="ibtn${NW.busy?' spin':''}" data-act="nre" aria-label="Actualiser les actualités">${ic('refresh',18)}</button></div></section>`;
  if(th==='mes'&&!NW.q.trim()&&!newsMine())h+=`<section class="card mt"><p class="sm mut">Ajoutez des actions ou des ETF (ou des projets sur une plateforme) dans vos placements : leurs actualités apparaîtront ici.</p></section>`;
  else if(NW.busy&&!NW.items.length)h+=`<div class="mt">${'<div class="mkr sk" style="min-height:74px"></div>'.repeat(6)}</div>`;
  else{
    if(NW.err&&NW.err!=='file')h+=`<p class="sm ${NW.items.length?'mut':'neg'} mt">${esc(NW.err)}</p>`;
    if(NW.items.length){const [f,...rest]=NW.items;h+=`<div class="nwg mt">${newsRow(f,true)}${rest.map(n=>newsRow(n)).join('')}</div><p class="hint">${f.en?'Google Actualités ne répond pas pour le moment : titres de Yahoo Finance (en anglais) en attendant.':'Titres et liens fournis par Google Actualités, en français.'} L’article s’ouvre sur le site du journal${MAC?' dans votre navigateur':''}. Les actualités ne sont pas des conseils d’investissement.</p>`}
    else if(!NW.err&&NW.key)h+=`<section class="card mt"><p class="sm mut">Aucun article sur cette période. Essayez « 7 jours » ou une autre région.</p></section>`;
  }
  el.innerHTML=h;
  if(keep){const i=$('nw-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
/* Accueil : les derniers titres du thème choisi */
function newsMini(){
  const el=$('nwmini');if(!el)return;
  if(!HOSTED||!NW.items.length){el.hidden=true;return}
  el.hidden=false;el.innerHTML=`<div class="ct"><h3>${ic('news',18)}&nbsp;Actualités · ${esc(newsLabel())}</h3><button class="btn sm sec" data-act="go" data-v="news">Tout voir</button></div><div class="nwg">${NW.items.slice(0,4).map(n=>newsRow(n)).join('')}</div>`;
}
/* Fiche d'une valeur : ses dernières actualités */
async function mkNews(s,name){
  const o=$('mk-nw');if(!o||!name)return;
  try{const L=await newsFetch('"'+String(name).replace(/"/g,'')+'" when:7d',String(name));if(CUR.mk!==s||!$('mk-nw'))return;o.innerHTML=L.length?`<div class="lbl" style="margin-top:16px">Actualités</div><div class="nwg">${L.slice(0,4).map(n=>newsRow(n)).join('')}</div>`:''}
  catch(e){if($('mk-nw'))$('mk-nw').innerHTML=''}
}

/* ===================== Cours en direct : flux continus ===================== */
const FXC=new Set();
const fxOf=c=>{if(!c||c==='EUR')return 1;const q=FEED&&FEED.get(c+'EUR=X');return q?q.p:(MK.fx[c]>0?MK.fx[c]:0)};
const FEED=(window.Marches&&HOSTED)?Marches.createFeed({
  onTick:(L)=>liveTick(L),onStatus:()=>mkStatus(),
  poll:async S=>{const r=await yquotes(S);Object.values(r).forEach(q=>{if(q&&q.c&&q.c!=='EUR'&&!FXC.has(q.c)){FXC.add(q.c)}});return r},
  schedule:f=>(typeof requestAnimationFrame==='function'&&!document.hidden)?requestAnimationFrame(f):setTimeout(f,50)
}):null;
const sameDay=ts=>new Date(ts).toLocaleDateString('sv-SE')===today();
function dayGain(){
  let g=0,b=0,n=0;
  D.assets.forEach(a=>{if(a.cat==='bourse'&&a.prev>0&&num(a.price)>0&&a.pxts&&sameDay(a.pxts)){g+=num(a.qty)*(num(a.price)-a.prev);b+=num(a.qty)*a.prev;n++}});
  return n?{g,n,pct:b>0?g/b*100:null}:null;
}
const gainHTML=T=>`${sgn(T.gain)}${T.pct!=null?' ('+pct(T.pct)+')':''} <span class="mut" style="font-weight:400">par rapport aux ${eur(T.ti)} investis</span>`;
function dayHTML(){
  const d=dayGain();if(!d)return '';
  const dir=FEED&&FEED.status().mode==='direct';
  return `<span class="${d.g>=0?'pos':'neg'}">Aujourd’hui ${sgn(d.g)}${d.pct!=null?' ('+pct(d.pct)+')':''}</span> <span class="mut" style="font-weight:400">${dir?'· en direct':''}</span>`;
}
let LSAVE=0,LLIST=0;
function liveSync(){
  if(!FEED)return;
  if(D.set.live===false){FEED.close();mkStatus();return}
  const port=D.assets.filter(a=>a.cat==='bourse'&&a.tick).map(a=>a.tick.toUpperCase()),fx=[...FXC].map(c=>c+'EUR=X');
  FEED.watch('port',port.concat(fx));
  FEED.watch('idx',tabSyms('idx'));
  FEED.watch('mk',UI.view==='mk'?tabSyms(MK.tab).slice(0,60):[]);
  FEED.watch('sheet',$('modal').classList.contains('open')&&CUR.mk?[CUR.mk]:[]);
  FEED.watch('alerts',D.alerts.filter(a=>!a.hit).map(a=>a.s));
}
function liveTick(L){
  let fxNew=false,pf=false;
  L.forEach(s=>{const q=FEED.get(s);if(!q)return;const m=/^([A-Z]{3})EUR=X$/.exec(s);if(m)MK.fx[m[1]]=q.p;else if(q.c&&q.c!=='EUR'&&!FXC.has(q.c)){FXC.add(q.c);fxNew=true}});
  const set=new Set(L);
  D.assets.forEach(a=>{
    if(a.cat!=='bourse'||!a.tick)return;const q=FEED.get(a.tick.toUpperCase());if(!q)return;
    const f=fxOf(q.c);if(!(f>0))return;
    if(!set.has(a.tick.toUpperCase())&&!(q.c&&set.has(q.c+'EUR=X')))return;
    const np=Math.round(q.p*f*1e4)/1e4;
    if(np!==num(a.price)){a.price=np;pf=true}
    if(q.pc>0)a.prev=Math.round(q.pc*f*1e4)/1e4;
    a.pxsrc='Direct';a.pxts=q.t&&q.t>Date.now()-864e5?Math.max(q.t,a.pxts||0):Date.now();
  });
  if(pf&&!LSAVE)LSAVE=setTimeout(()=>{LSAVE=0;save()},60000);
  if(D.alerts.length)alertCheck(set);
  if(fxNew)liveSync();
  liveRepaint(set,pf);
}
function liveRepaint(set,pf){
  document.querySelectorAll('[data-q]').forEach(el=>{if(set.has(el.dataset.q))qApply(el,mkq(el.dataset.q))});
  if(pf){
    const T=totals(),a=$('h-tot');
    if(a){a.dataset.fixe='1';const t=eur(T.net);if(a.textContent!==t){a.textContent=t;a.classList.remove('fl-up','fl-dn');void a.offsetWidth;a.classList.add(a._v>T.net?'fl-dn':'fl-up');a._v=T.net}}if($('h-brut'))$('h-brut').textContent=eur(T.tv);
    if($('h-gain')&&T.ti>0)$('h-gain').className='delta '+(T.gain>=0?'pos':'neg'),$('h-gain').innerHTML=gainHTML(T);
    if($('h-day'))$('h-day').innerHTML=dayHTML();
    document.querySelectorAll('[data-own]').forEach(el=>{const as=D.assets.find(x=>x.id===el.dataset.own);if(as)el.textContent=eur(val(as))});
    if(UI.view==='assets'&&!LLIST&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))){LLIST=setTimeout(()=>{LLIST=0;if(UI.view==='assets')renderList()},1200)}
  }
  if(CUR.mk&&set.has(CUR.mk)&&$('mkc')&&MK.range==='1d'&&MK.pts&&Date.now()-(MK.drawn||0)>3000){
    const q=FEED.get(CUR.mk),last=MK.pts[MK.pts.length-1];
    if(q){if(Date.now()-last[0]>240000)MK.pts.push([Date.now(),q.p]);else last[1]=q.p;mkDraw()}
  }
  mkStatus();
  if(pf&&D.set.bar&&typeof macBar==='function'){clearTimeout(liveRepaint.b);liveRepaint.b=setTimeout(macBar,2000)}
}
setInterval(()=>{if(UI.view==='mk')mkStatus()},1000);

/* ===================== Démarrage ===================== */
function init(){
  applyTheme();$('gear').innerHTML=ic('sliders',22);$('fab').innerHTML=ic('plus',26);renderNav();render();renderAI();show(location.hash.slice(1)||'home');
  if(D.assets.length)save();
  if(D.set.auto!==false&&navigator.onLine!==false&&D.assets.some(a=>a.cat==='bourse'&&a.tick&&(!a.pxts||Date.now()-a.pxts>6*36e5)))refresh(true);
  setTimeout(autoTickers,4000);
  SNAP=snapOf();syncUI();idLoad();macInit();setTimeout(dueNotify,6000);setTimeout(fxRefresh,3000);
  bqFinir();setTimeout(rapNotifier,7000);setInterval(rapNotifier,3600e3);
  if(HOSTED){try{const o=JSON.parse(localStorage.getItem('pat_news')||'null');if(o&&Array.isArray(o.items)){NW.items=o.items;NW.at=0;newsMini()}}catch(e){}setTimeout(()=>newsLoad(),2500)}
  if(HOSTED){mkLoad('idx',true);mkLoad(MK.tab,true);setInterval(mkRefresh,10*60e3);liveSync();mkStatus();
    setInterval(()=>{if(!document.hidden&&syncOn())syncNow()},90e3);
    let LHID=0;
    document.addEventListener('visibilitychange',()=>{
      /* sur le Mac, la fenêtre fermée reste ouverte en arrière-plan : le flux des cours continue pour les alertes et la barre des menus */
      if(document.hidden){clearTimeout(LHID);LHID=setTimeout(()=>{if(MAC&&(D.set.bar||D.alerts.some(a=>!a.hit)))return;if(FEED)FEED.close();mkStatus()},60e3);if(LSAVE){clearTimeout(LSAVE);LSAVE=0;save()}}
      else{clearTimeout(LHID);if(syncOn())syncNow();mkRefresh();liveSync();if(FEED)FEED._poll();rapNotifier();if(UI.view==='home')renderHome()}
    });
    window.addEventListener('online',()=>{if(syncOn())syncNow()});
    if(!MAC&&'serviceWorker' in navigator){
      const had=!!navigator.serviceWorker.controller;let reloaded=false;
      navigator.serviceWorker.register('sw.js').then(r=>{setInterval(()=>r.update().catch(()=>{}),30*60e3)}).catch(()=>{});
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded)return;reloaded=true;if($('modal').classList.contains('open')||($('ai-q')&&$('ai-q').value)){toast('Nouvelle version prête',{l:'Recharger',fn:()=>location.reload()})}else location.reload()});
    }
  }
}
init();
</script></body></html>
