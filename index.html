/* --- Suivi des modifications (fusion fine entre appareils) --- */
const SF=['goal','plat','lastBackup','chat','watch'];
let SNAP=null;
const ajson=a=>{const o=Object.assign({},a);delete o.u;return JSON.stringify(o)};
const snapOf=()=>({a:Object.fromEntries(D.assets.map(a=>[a.id,ajson(a)])),f:Object.fromEntries(SF.map(f=>[f,JSON.stringify(D[f]===undefined?null:D[f])]))});
function track(){
  D.del=D.del&&typeof D.del==='object'?D.del:{};D.mt=D.mt&&typeof D.mt==='object'?D.mt:{};
  if(!SNAP){SNAP=snapOf();return false}
  const now=Date.now(),seen={};let ch=false;
  D.assets.forEach(a=>{const j=ajson(a);seen[a.id]=1;if(SNAP.a[a.id]!==j){a.u=now;ch=true}});
  Object.keys(SNAP.a).forEach(id=>{if(!seen[id]){D.del[id]=now;ch=true}});
  SF.forEach(f=>{if(SNAP.f[f]!==JSON.stringify(D[f]===undefined?null:D[f])){D.mt[f]=now;ch=true}});
  SNAP=snapOf();return ch;
}
const payload=()=>({v:3,assets:D.assets,del:D.del||{},mt:D.mt||{},hist:D.hist,goal:D.goal??null,plat:D.plat,lastBackup:D.lastBackup??null,chat:D.chat,watch:D.watch||[]});
/* Fusion : chaque placement garde sa version la plus récente, les suppressions sont respectées, l'historique est réuni. */
function mergeRemote(R){
  if(!R||typeof R!=='object')return false;
  let localWins=false;const L=D,del=Object.assign({},R.del||{});
  Object.entries(L.del||{}).forEach(([k,t])=>{if(!(del[k]>=t)){del[k]=t;if(!R.del||R.del[k]!==t)localWins=true}});
  const cut=Date.now()-120*864e5;Object.keys(del).forEach(k=>{if(del[k]<cut)delete del[k]});
  const rm=new Map((R.assets||[]).map(a=>[a.id,a])),lm=new Map(L.assets.map(a=>[a.id,a])),out=[];
  const keep=a=>!(del[a.id]>=(a.u||0));
  L.assets.forEach(la=>{const ra=rm.get(la.id);let w=la;
    if(ra){if((ra.u||0)>(la.u||0))w=ra;else if((la.u||0)>(ra.u||0))localWins=true}
    else if(!(del[la.id]>=(la.u||0)))localWins=true;
    if(keep(w))out.push(w)});
  (R.assets||[]).forEach(ra=>{if(!lm.has(ra.id)&&keep(ra))out.push(ra)});
  L.assets=out;L.del=del;
  const mt=Object.assign({},L.mt||{});
  const emp=v=>v==null||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
  SF.forEach(f=>{const rt=(R.mt||{})[f]||0,lt=(L.mt||{})[f]||0;
    if(rt>lt||(rt===lt&&emp(L[f])&&!emp(R[f]))){L[f]=R[f]===null?undefined:R[f];mt[f]=rt}
    else if(lt>rt||(rt===lt&&!emp(L[f])&&emp(R[f])))localWins=true;});
  L.mt=mt;if(L.goal==null)delete L.goal;
  const H=new Map((R.hist||[]).map(h=>[h.d,h]));(L.hist||[]).forEach(h=>{if(!H.has(h.d)){H.set(h.d,h);localWins=true}else H.set(h.d,h)});
  L.hist=[...H.values()].sort((x,y)=>String(x.d).localeCompare(String(y.d))).slice(-1500);
  if(!Array.isArray(L.chat))L.chat=[];if(!Array.isArray(L.watch))L.watch=[];if(!L.plat||typeof L.plat!=='object')L.plat={};
  SNAP=snapOf();
  try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}
  return localWins;
}
/* --- Synchronisation --- */
const SY={rev:+localStorage.getItem('pat_rev')||0,busy:false,dirty:localStorage.getItem('pat_dirty')==='1',t:null,last:+localStorage.getItem('pat_synced')||0,err:'',again:false};
const syncOn=()=>HOSTED&&!!ID.user;
function syncSoon(){SY.dirty=true;localStorage.setItem('pat_dirty','1');if(!syncOn())return;clearTimeout(SY.t);SY.t=setTimeout(syncNow,1500);syncUI()}
async function syncNow(){
  if(!syncOn())return;if(SY.busy){SY.again=true;return}
  if(navigator.onLine===false){SY.err='hors ligne';syncUI();return}
  SY.busy=true;SY.err='';syncUI();
  try{
    let r=await api('/api/sync?since='+SY.rev),changed=false,push=SY.dirty;
    if(!r.same){
      const first=!localStorage.getItem('pat_rev')&&r.data&&(r.data.assets||[]).length&&D.assets.some(a=>!a.demo);
      let how=first?await firstChoice(r.data):'merge';
      if(how==='cancel')throw Error('synchronisation mise en pause, touchez « Synchroniser maintenant »');
      if(how==='remote'){const set=D.set;D=Object.assign(load(),r.data);D.set=set;['assets','hist','chat','watch'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});SNAP=snapOf();try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}push=false;SY.dirty=false;changed=true}
      else if(how==='local'){const now=Date.now(),mine=new Set(D.assets.map(a=>a.id));D.del=D.del||{};(r.data.assets||[]).forEach(a=>{if(!mine.has(a.id))D.del[a.id]=now});D.assets.forEach(a=>{a.u=now});D.mt=D.mt||{};SF.forEach(f=>{D.mt[f]=now});SNAP=snapOf();push=true}
      else if(r.data){push=mergeRemote(r.data)||push;changed=true}
      else if(D.assets.length||D.hist.length)push=true;
      SY.rev=r.rev;
    }
    for(let k=0;push&&k<3;k++){
      const w=await api('/api/sync',{method:'PUT',body:JSON.stringify({baseRev:SY.rev,dev:DEV,data:payload()})});
      if(w._st===409){mergeRemote(w.data);SY.rev=w.rev;changed=true;continue}
      SY.rev=w.rev;push=false;

function ynorm(meta){
  if(!meta)return null;
  let p=meta.regularMarketPrice,pc=meta.chartPreviousClose??meta.previousClose??meta.regularMarketPreviousClose,c=meta.currency||'';
  if(!(p>0))return null;
  if(c==='GBp'||c==='GBX'){p/=100;if(pc)pc/=100;c='GBP'}
  if(c==='ZAc'||c==='ILA'){p/=100;if(pc)pc/=100;c=c==='ZAc'?'ZAR':'ILS'}
  return{p,pc:pc>0?pc:null,c,t:meta.regularMarketTime?meta.regularMarketTime*1000:null,n:meta.shortName||meta.longName||''};
}
async function ysparks(syms){
  const res={};
  for(let i=0;i<syms.length;i+=20){
    const b=syms.slice(i,i+20),d=await yget('/v7/finance/spark?symbols='+encodeURIComponent(b.join(','))+'&range=1d&interval=1d');
    if(!d)continue;const L=d.spark&&d.spark.result;
    if(Array.isArray(L))L.forEach(x=>{const q=ynorm(x&&x.response&&x.response[0]&&x.response[0].meta);if(q)res[x.symbol]=q});
    else Object.values(d).forEach(x=>{if(x&&x.symbol){const cl=(x.close||[]).filter(v=>v!=null);const q=ynorm({regularMarketPrice:cl[cl.length-1],chartPreviousClose:x.chartPreviousClose??x.previousClose,currency:x.currency});if(q)res[x.symbol]=q}});
  }
  return res;
}

const MCACHE=new Map();
async function marketApi(url){
  const u=new URL(url,location.origin),sp=u.searchParams,key=u.search.replace(/[?&]b=\d+/,'');
  const hit=MCACHE.get(key);if(hit&&hit.exp>Date.now())return hit.v;
  const keep=(o,ttl)=>{MCACHE.set(key,{v:o,exp:Date.now()+ttl});return o};
  if(sp.get('chart')){
    const R={'1mo':'1d','6mo':'1d','1y':'1d','5y':'1wk'},range=R[sp.get('range')]?sp.get('range'):'6mo',s=sp.get('chart');
    const d=await yget('/v8/finance/chart/'+encodeURIComponent(s)+`?range=${range}&interval=${R[range]}`),r=d&&d.chart&&d.chart.result&&d.chart.result[0];
    if(!r)return{error:'Historique indisponible'};
    let k=1,c=(r.meta&&r.meta.currency)||'';if(c==='GBp'||c==='GBX'){k=.01;c='GBP'}
    const cl=((r.indicators||{}).quote||[{}])[0].close||[];
    return keep({s,c,pts:(r.timestamp||[]).map((t,i)=>[t*1000,cl[i]==null?null:+(cl[i]*k).toFixed(4)]).filter(p=>p[1]!=null)},18e5);
  }
  if(sp.has('search')){
    const d=await yget('/v1/finance/search?q='+encodeURIComponent(sp.get('search').slice(0,60))+'&quotesCount=8&newsCount=0');
    if(!d)return{error:'Recherche indisponible'};
    return keep({quotes:(d.quotes||[]).filter(x=>x.symbol).map(x=>({symbol:x.symbol,shortname:x.shortname||x.longname||'',exchDisp:x.exchDisp||'',type:x.quoteType||''}))},864e5);
  }
  const list=sp.get('list');let syms;
  if(list){if(!LISTS[list])return{error:'Liste inconnue'};syms=LISTS[list].map(x=>x[0])}
  else syms=(sp.get('symbols')||'').split(',').map(s=>s.trim().toUpperCase()).filter(s=>/^[\w.\-^=]{1,20}$/.test(s)).slice(0,60);
  if(!syms.length)return{error:'Aucun symbole'};
  const q=await yquotes(syms),items=syms.filter(s=>q[s]).map(s=>ypack(s,q[s])),ck='pat_mk_'+(list||'');
  if(!items.length){if(list){try{const old=JSON.parse(localStorage.getItem(ck)||'null');if(old)return Object.assign(old,{stale:true})}catch(e){}}return{error:'Cours indisponibles pour le moment (relais bloqué ou hors ligne).'}}
  const body={list:list||null,at:Date.now(),items,fx:await yfx(items.map(i=>i.c)),missing:syms.filter(s=>!q[s])};
  if(list)lsSet(ck,JSON.stringify(body));
  return keep(body,list?3e5:12e4);
}

    setInterval(()=>{if(!document.hidden&&syncOn())syncNow()},90e3);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(syncOn())syncNow();mkRefresh()}});
    window.addEventListener('online',()=>{if(syncOn())syncNow()});
    if('serviceWorker' in navigator){
      const had=!!navigator.serviceWorker.controller;let reloaded=false;
      navigator.serviceWorker.register('sw.js').then(r=>{setInterval(()=>r.update().catch(()=>{}),30*60e3)}).catch(()=>{});
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded)return;reloaded=true;if($('modal').classList.contains('open')||($('ai-q')&&$('ai-q').value)){toast('Nouvelle version prête',{l:'Recharger',fn:()=>location.reload()})}else location.reload()});
    }
  }
}
init();
