<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patrimoine AI · QuenTools</title><meta name="author" content="QuenTools"><meta name="theme-color" content="#151311">
<script src="config.js"></script><script src="marches.js"></script><script src="calculs.js"></script><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:dark;--bg:#151311;--card:#211e1b;--card2:#2b2723;--line:rgba(255,255,255,.09);--tx:#f4f2ee;--mut:#a59f95;--p:#10b981;--pt:#34d399;--onp:#04231a;--ok:#34d399;--warn:#fbbf24;--red:#f87171;--onred:#2a0808;--blue:#60a5fa;--shadow:0 12px 32px rgba(0,0,0,.4);--num:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#f3f4f1;--card:#fff;--card2:#eceee9;--line:rgba(20,30,25,.11);--tx:#16201b;--mut:#5b6961;--p:#047857;--pt:#047857;--onp:#fff;--ok:#047857;--warn:#a16207;--red:#dc2626;--onred:#fff;--blue:#1d4ed8;--shadow:0 12px 32px rgba(20,30,25,.14)}}
:root[data-theme=light]{color-scheme:light;--bg:#f3f4f1;--card:#fff;--card2:#eceee9;--line:rgba(20,30,25,.11);--tx:#16201b;--mut:#5b6961;--p:#047857;--pt:#047857;--onp:#fff;--ok:#047857;--warn:#a16207;--red:#dc2626;--onred:#fff;--blue:#1d4ed8;--shadow:0 12px 32px rgba(20,30,25,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:var(--pt)}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:650}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.pos{color:var(--ok)}.neg{color:var(--red)}.warnc{color:var(--warn)}
.mt{margin-top:14px}.mt2{margin-top:22px}
.app{display:flex;height:100dvh}
.side{display:none;width:248px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:4px 12px 18px}
.brand svg{color:var(--pt)}
.navi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mut);font-weight:600;width:100%;min-height:44px}
.navi:hover{background:var(--card2)}.navi.on{background:var(--card2);color:var(--pt)}
.side .sp{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.acts{display:flex;gap:2px}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.ibtn:hover{background:var(--card2);color:var(--tx)}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));scroll-behavior:smooth}
.wrap{max-width:1040px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card+.card{margin-top:14px}
.ct{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.grid2>.card{margin-top:0}
.span2{grid-column:1/-1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{display:flex;gap:8px;align-items:flex-start}.row2 .inp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--p);color:var(--onp);font-weight:700;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.sec:hover{background:var(--card2)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.dng{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn.dngf{background:var(--red);color:var(--onred)}
.btn.blk{width:100%}.btn.sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--tx)}
.chip.on{border-color:var(--pt);color:var(--pt);background:color-mix(in srgb,var(--pt) 12%,transparent)}
.chip .n{font-weight:700;opacity:.7}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
/* hero */
.hero .lab{color:var(--mut);font-size:13px}
.tot{font:600 clamp(40px,11vw,58px)/1.05 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.big{font:600 34px/1.1 var(--num);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.delta{font-weight:600;font-size:14px}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{fill:var(--mut);font-size:9px}
.rng{display:flex;gap:6px;margin-top:14px}
.rng .chip{min-height:32px;padding:0 12px}
/* donut */
.alloc{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dw{position:relative;width:132px;height:132px;flex:none}.donut{width:100%;height:100%}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut);line-height:1.2}.dc b{font:600 22px var(--num);color:var(--tx)}
.lg{flex:1;min-width:200px;display:flex;flex-direction:column}
.lgi{display:grid;grid-template-columns:12px 1fr auto;column-gap:10px;align-items:center;padding:8px 6px;border-radius:10px;min-height:44px}
.lgi:hover{background:var(--card2)}
.lgi i{width:10px;height:10px;border-radius:50%}
.lgi em{grid-column:2/4;font-style:normal;color:var(--mut);font-size:12px;margin-top:-2px}
/* lists */
.item{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;text-align:left}
.item:hover{border-color:color-mix(in srgb,var(--pt) 45%,var(--line))}
.item .ir{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item.sm{padding:10px 12px;font-size:14px}
.it{display:flex;align-items:center;gap:12px;min-width:0}.it>div{min-width:0}
.it b,.it .mut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rt b{font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px;align-items:center;margin:10px 0 12px}
.tools input{flex:1}.tools select{width:auto;flex:none}
.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.empty{text-align:center;padding:26px 12px}.empty .ico{margin:0 auto 10px;width:52px;height:52px}
.empty p{max-width:36ch;margin:6px auto 14px}
/* insights */
.ins{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ins:first-child{border-top:0;padding-top:2px}
.ins>.ic{margin-top:2px}
.ins .acts2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pt);border-radius:99px}
.gauge{width:150px;flex:none;color:var(--tx)}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:14px 0}
.steps li{counter-increment:s;display:flex;gap:12px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--pt);font-weight:700;font-size:13px;display:grid;place-items:center}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}.kv span{color:var(--mut)}.kv b{text-align:right;font-weight:600}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
/* forms */
.fld{margin-top:14px}
.fld>label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.opt{font-weight:400;color:var(--mut);font-size:12px;margin-left:4px}
.inp{position:relative}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;color:var(--tx);min-height:46px;outline:none}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--pt)}
input.bad{border-color:var(--red)}
.inp.has input{padding-right:52px}
.suf{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
input[type=range]{padding:0;min-height:30px;border:0;background:none;accent-color:var(--p)}
input[type=file]{padding:10px;font-size:14px}
.hint{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.45}
.err{font-size:12px;color:var(--red);margin-top:5px}.err:empty{display:none}
.live{font-size:13px;color:var(--mut);margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:12px}.live:empty{display:none}
.tile{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);margin-bottom:8px;text-align:left}
.tile:hover{border-color:var(--pt)}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;font-size:14px;min-height:36px;display:flex;align-items:center}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .15s}
.sw[aria-checked=true]{background:var(--p)}.sw[aria-checked=true] i{transform:translateX(20px);background:var(--onp)}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
/* chat */
.msg{max-width:90%;padding:10px 14px;border-radius:16px;margin:10px 0;line-height:1.6;font-size:14.5px;overflow-wrap:anywhere}
.msg.u{background:var(--p);color:var(--onp);margin-left:auto;border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.m{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.err{border-color:var(--red)}
.md p{margin:6px 0}.md p:first-child,.md h4:first-child{margin-top:0}.md h4{font-size:15px;margin:12px 0 4px}.md ul,.md ol{padding-left:20px;margin:6px 0}.md li{margin:3px 0}.md code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:13px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0 4px;margin-top:8px}
.composer textarea{min-height:46px;max-height:140px;resize:none}
.composer .btn{width:46px;padding:0;flex:none}
.composer .btn.rec{background:#dc2626;border-color:#dc2626;color:#fff}
/* nav */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);min-height:50px}
.tab.on{color:var(--pt)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--p);color:var(--onp);box-shadow:var(--shadow);display:grid;place-items:center;z-index:25}
body[data-view=ai] .fab,body[data-view=set] .fab{display:none}
body[data-view=ai] .content{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
/* sheet */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sh .22s ease;overscroll-behavior:contain}
.sh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;z-index:2}
.sh h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes sh{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--bg);text-decoration:underline;font-weight:700;flex:none;min-height:32px}
@media(min-width:900px){
.side{display:flex}.tabs,.fab{display:none!important}
.content{padding:28px 40px 60px}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.composer{bottom:0}
body[data-view=ai] .content{padding-bottom:20px}
#modal{align-items:center}.sheet{border-radius:22px;max-height:88dvh}
#toast{bottom:28px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.sidein{display:flex;flex-direction:column;gap:4px;flex:1}
/* v3 : indicateurs, assistant, diagnostic */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpis>div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.kpis span{display:block;font-size:12px;color:var(--mut)}
.kpis b{display:block;font:600 17px/1.3 var(--num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aibar{display:flex;align-items:center;gap:10px;margin-bottom:8px}.aibar .chips{flex:1;padding:0}
.aistat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin:-2px 0 6px}
.aistat i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mnote{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.45;color:var(--warn);margin-bottom:8px}
.mfoot{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;margin-top:6px;font-size:12px;color:var(--mut)}
.lnk{color:var(--pt);font-weight:650;font-size:12px;min-height:30px;padding:0 2px}
.lnk:hover{text-decoration:underline}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
.sugg .chip{white-space:normal;text-align:left;min-height:34px;padding:6px 12px;line-height:1.3}
.dgl{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.dgl:first-child{border-top:0}
.dgl .ic{margin-top:1px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
/* v4 : marchés, compte, synchro */
.mkidx{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -2px}.mkidx::-webkit-scrollbar{display:none}
.mki{flex:none;display:flex;flex-direction:column;gap:1px;min-width:118px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.mki span:first-child{font-size:12px;color:var(--mut);white-space:nowrap}.mki b{font:600 15px/1.25 var(--num);font-variant-numeric:tabular-nums}
.mki:hover,.mkr:hover{border-color:color-mix(in srgb,var(--pt) 45%,var(--line))}
.mkr{display:grid;grid-template-columns:minmax(0,1fr) auto 76px;gap:10px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;text-align:left;min-height:52px}
.mkn{min-width:0}.mkn b,.mkn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mkn b{font-weight:650;font-size:14px}
.mkp{font:600 15px var(--num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mkch{justify-self:end;display:inline-block;min-width:68px;text-align:center;padding:3px 7px;border-radius:8px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.mkch.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}.mkch.dn{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
.sk{background:linear-gradient(90deg,var(--card2),var(--bg),var(--card2));background-size:200% 100%;animation:skl 1.2s infinite;min-height:52px;border-color:transparent}.mki.sk{min-height:62px}
@keyframes skl{from{background-position:200% 0}to{background-position:-200% 0}}
.ibtn.spin svg{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.acc{display:flex;align-items:center;gap:12px}.acc .av{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--pt);flex:none;overflow:hidden}.acc .av img{width:100%;height:100%;object-fit:cover}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border-radius:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:650}
.gbtn:hover{background:#f7f8f8}

/* v5 : marchés en direct */
.lp{display:inline-flex;align-items:center;gap:7px;margin-right:auto;margin-left:10px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--mut);min-height:28px}
.lp[hidden]{display:none}
.lp i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.lp.direct{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}.lp.direct i{background:var(--ok);animation:pulse 1.6s ease-out infinite}
.lp.rapide{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}.lp.rapide i{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.dot{width:7px;height:7px;margin-right:5px;vertical-align:1px}.dot.live{background:var(--ok)}.dot.delay{background:var(--warn)}.dot.closed,.dot.off{background:var(--mut)}
@keyframes flup{from{background:color-mix(in srgb,var(--ok) 42%,transparent)}to{background:transparent}}
@keyframes fldn{from{background:color-mix(in srgb,var(--red) 42%,transparent)}to{background:transparent}}

/* ===================== Calculs ===================== */
const isRisky=a=>a.cat==='crowd'||a.cat==='immo';
const isDebt=a=>a.cat==='credit';
const live=a=>a.status!=='rembourse';
const owned=()=>D.assets.filter(a=>!isDebt(a));
/* Crédit amortissable : mensualité, échéances déjà payées, capital restant dû (saisi, sinon calculé) */
function loanM(a){const P=num(a.amount),n=Math.round(num(a.dur)),r=num(a.rate)/1200;if(!(P>0)||!(n>0))return 0;return r?P*r/(1-Math.pow(1+r,-n)):P/n}
function loanK(a){
  if(!a.date||!(num(a.dur)>0))return null;const d=new Date(a.date+'T12:00:00');if(isNaN(d))return null;
  const t=new Date();let k=(t.getFullYear()-d.getFullYear())*12+(t.getMonth()-d.getMonth());if(t.getDate()<d.getDate())k--;
  return Math.max(0,Math.min(Math.round(num(a.dur)),k));
}
function crd(a){
  if(a.value!==''&&a.value!=null)return Math.max(0,num(a.value));
  const P=num(a.amount),k=loanK(a),n=Math.round(num(a.dur)),r=num(a.rate)/1200;
  if(k==null)return P;if(k>=n)return 0;const M=loanM(a);
  return Math.max(0,r?P*Math.pow(1+r,k)-M*(Math.pow(1+r,k)-1)/r:P-M*k);
}
function loanEnd(a){if(!a.date||!(num(a.dur)>0))return null;const d=new Date(a.date+'T12:00:00');if(isNaN(d))return null;d.setMonth(d.getMonth()+Math.round(num(a.dur)));return d}
function loanLeft(a){const k=loanK(a);return k==null?null:Math.max(0,Math.round(num(a.dur))-k)}
function val(a){
  if(a.cat==='bourse')return num(a.qty)*(num(a.price)||num(a.pru));
  if(isDebt(a))return crd(a);
  return ((a.value===''||a.value==null)?num(a.amount):num(a.value))*tauxDev(a);
}
function inv(a){
  if(a.cat==='bourse')return num(a.qty)*num(a.pru);
  if(isDebt(a))return 0;
  if(a.cat==='bien')return (a.amount===''||a.amount==null)?val(a):num(a.amount)*tauxDev(a);
  if(a.status==='rembourse'&&val(a)===0)return 0;   // remboursé et retiré : n'entre plus dans les totaux
  return num(a.amount)*tauxDev(a);
}
const col=s=>s>=70?'var(--ok)':s>=50?'var(--warn)':'var(--red)';

function aDetail(a){
  const base=pScore(a.plat||'Autre plateforme');let s=base;const parts=[['Fiabilité de la plateforme',base,true]];
  const add=(l,d)=>{s+=d;parts.push([l,d])};
  if(a.status==='retard')add('Remboursement en retard',-15);
  if(a.status==='defaut')add('Projet en défaut',-50);
  if(num(a.dur)>48)add('Durée supérieure à 4 ans',-5);
  const r=num(a.rate);
  if(r>12)add('Taux supérieur à 12 % (risque proportionnel)',-15);else if(r>10)add('Taux supérieur à 10 %',-8);
  return{score:Math.max(0,Math.min(100,s)),parts};
}
const aScore=a=>aDetail(a).score;
function portfolio(){
  const R=D.assets.filter(a=>isRisky(a)&&live(a)),tot=R.reduce((s,a)=>s+inv(a),0);
  if(!R.length||tot<=0)return null;
  const base=R.reduce((s,a)=>s+aScore(a)*inv(a),0)/tot;let sc=base;
  const by={};R.forEach(a=>{const k=a.plat||'Autre plateforme';by[k]=(by[k]||0)+inv(a)});
  const ents=Object.entries(by).sort((x,y)=>y[1]-x[1]),top=ents[0][1]/tot*100,n=ents.length,notes=[];
  let pc=0,pd=0;
  if(top>40){pc=(top-40)*.5;sc-=pc;notes.push('Concentration : '+Math.round(top)+' % sur une seule plateforme')}
  if(n<3){pd=8;sc-=8;notes.push('Moins de 3 plateformes')}
  const bad=R.filter(a=>a.status==='retard'||a.status==='defaut').length;
  if(bad)notes.push(bad+' projet(s) en retard ou en défaut');
  return{score:Math.max(0,Math.round(sc)),base:Math.round(base),pc:Math.round(pc),pd,notes,tot,n,top,topName:ents[0][0],by:ents,R};
}
/* tv : patrimoine brut (ce que vous possédez) ; debt : capital restant dû ; net = brut − dettes ; fin = brut hors immobilier physique */
function totals(){
  const A=owned(),tv=A.reduce((s,a)=>s+val(a),0),ti=A.reduce((s,a)=>s+inv(a),0),debt=D.assets.filter(isDebt).reduce((s,a)=>s+crd(a),0),bv=A.filter(a=>a.cat==='bien').reduce((s,a)=>s+val(a),0);
  return{tv,ti,debt,net:tv-debt,fin:tv-bv,gain:tv-ti,pct:ti>0?(tv-ti)/ti*100:null};
}

  const by={};owned().forEach(a=>{const v=val(a);if(v>0)by[a.cat]=(by[a.cat]||0)+v});

  if(cap>=goal)return 0;const r=rate/1200;let c=cap;

/* Mini rendu Markdown sûr (l'entrée est échappée avant transformation) */
function md(t){
  const L=esc(t).split('\n');let h='',ul=false,ol=false;
  const cl=()=>{if(ul){h+='</ul>';ul=false}if(ol){h+='</ol>';ol=false}};
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const raw of L){
    const l=raw.trim();let m;
    if(!l){cl();continue}
    if(m=l.match(/^#{1,4}\s+(.*)/)){cl();h+='<h4>'+inl(m[1])+'</h4>'}
    else if(m=l.match(/^[-*•]\s+(.*)/)){if(!ul){cl();h+='<ul>';ul=true}h+='<li>'+inl(m[1])+'</li>'}
    else if(m=l.match(/^\d+[.)]\s+(.*)/)){if(!ol){cl();h+='<ol>';ol=true}h+='<li>'+inl(m[1])+'</li>'}
    else{cl();h+='<p>'+inl(l)+'</p>'}
  }
  cl();return h;
}

const BCAT={logement:'Logement',energie:'Énergie',telecom:'Internet et téléphone',assurance:'Assurances',transport:'Transport',abonnement:'Abonnements',impots:'Impôts',enfants:'Enfants',alimentation:'Courses',sante:'Santé',loisirs:'Loisirs et sorties',autre:'Autre',credit:'Crédits',retrait:'Retraits d’espèces'};
const BTPL={inc:[['Salaire net']],exp:[['Loyer','fixe','logement'],['Électricité et gaz','fixe','energie'],['Internet et téléphone','fixe','telecom'],['Assurances (habitation, auto…)','fixe','assurance'],['Transport (carburant, abonnement)','fixe','transport'],['Abonnements (streaming, sport…)','fixe','abonnement'],['Courses','courant','alimentation'],['Loisirs et sorties','courant','loisirs'],['Santé, vêtements, divers','courant','autre']]};
function budget(){
  const B=D.budget,R=B.inc.reduce((s,l)=>s+num(l.v),0),lp=B.loans?loanPay():0;
  const fixe=B.exp.filter(l=>l.k!=='courant').reduce((s,l)=>s+num(l.v),0)+lp,cour=B.exp.filter(l=>l.k==='courant').reduce((s,l)=>s+num(l.v),0),dep=fixe+cour,cap=R-dep;
  const cash=owned().filter(a=>a.cat==='cash').reduce((s,a)=>s+val(a),0),cible=dep*B.mois,gap=Math.max(0,cible-cash);
  const plan={marge:0,prec:0,goals:0,inv:0,gl:[]};
  if(cap>0){
    let rest=cap;plan.marge=Math.round(cap*Math.min(50,Math.max(0,num(B.marge)))/100);rest-=plan.marge;
    plan.prec=gap>0?Math.min(rest,Math.ceil(gap/Math.max(1,B.delai))):0;rest-=plan.prec;
    (D.goals||[]).forEach(g=>{if(g.src==='net')return;const s=gState(g);if(s.k==='done'||s.need==null||!(s.need>0))return;const put=Math.min(rest,Math.round(s.need));if(put>0){plan.gl.push([g,put,s.need]);plan.goals+=put;rest-=put}});
    plan.inv=Math.max(0,rest);
  }
  return{R,lp,fixe,cour,dep,cap,rav:R-fixe,te:R>0?lp/R*100:null,ts:R>0?cap/R*100:null,cash,cible,gap,plan,mois:B.mois};
}

/* Effort mensuel nécessaire pour atteindre la cible à l'échéance, avec le rendement estimé */
function gNeed(target,cur,m,rate){
  if(cur>=target)return 0;if(m==null)return null;if(m<=0)return target-cur;
  const r=rate/1200,f=Math.pow(1+r,m);return Math.max(0,r?(target-cur*f)*r/(f-1):(target-cur)/m);

  return{cur,t,m,need,mo,yrs,k,p:t>0?Math.max(0,Math.min(100,cur/t*100)):0};
}

/* Calendrier : sommes attendues (capital et intérêts des projets) mois par mois sur 12 mois */
function calendar(){
  const t=new Date(),M=[];for(let k=0;k<12;k++){const d=new Date(t.getFullYear(),t.getMonth()+k,1);M.push({d,v:0,L:[]})}
  D.assets.filter(a=>isRisky(a)&&(a.status==='cours'||a.status==='retard')&&endDate(a)).forEach(a=>{
    const e=endDate(a),k=(e.getFullYear()-t.getFullYear())*12+e.getMonth()-t.getMonth();
    if(k<0||k>11)return;const v=inv(a)*(1+num(a.rate)/100*num(a.dur)/12);M[k].v+=v;M[k].L.push(a)});
  return M;
}
function bars(M,lab){
  const mx=Math.max(1,...M.map(x=>x.v));
  return `<div class="bars" role="img" aria-label="${esc(lab)}">${M.map((x,i)=>`<div title="${esc(fmy(x.d)+' : '+eur(x.v))}"><i class="${x.v?'':'z'}" style="height:${x.v?Math.max(4,x.v/mx*100):2}%"></i>${i%2===0?`<span>${esc(x.d.toLocaleDateString('fr-FR',{month:'short'}))}</span>`:''}</div>`).join('')}</div>`;
}
function calHTML(){
  const M=calendar(),tot=M.reduce((s,x)=>s+x.v,0);if(!D.assets.some(isRisky))return '';
  const next=M.filter(x=>x.v>0).slice(0,3);
  return `<section class="card"><div class="ct"><h3>Remboursements attendus</h3></div>${tot>0?`<div class="big" style="font-size:26px">${eur(tot)}<span class="mut sm" style="font-family:inherit"> sur 12 mois</span></div>${bars(M,'Remboursements attendus mois par mois')}<div class="mt">${next.map(x=>kv(esc(fmy(x.d)),eur(x.v)+` <span class="mut xs">(${x.L.length} projet${x.L.length>1?'s':''})</span>`)).join('')}</div><p class="hint">Capital et intérêts bruts, si tout se passe comme prévu.</p>`:'<p class="sm mut">Aucune échéance prévue dans les 12 prochains mois. Renseignez la date de début et la durée de vos projets pour les voir ici.</p>'}</section>`;
}

function envHTML(){

  const by={};B.forEach(a=>{const k=ENV[a.env]?a.env:'';(by[k]=by[k]||{v:0,i:0,n:0});by[k].v+=val(a);by[k].i+=inv(a);by[k].n++});

function tauxDev(a){const c=devOf(a);if(!c)return 1;if(num(a.fxm)>0)return num(a.fxm);if(DEVFIXE[c])return DEVFIXE[c];const x=D.fx[c];return x&&num(x.r)>0?num(x.r):1}

/* Flux d'un placement : versements (+) et retraits (−) datés, en euros ; à défaut un seul versement à la date d'ouverture */
function flux(a){
  if(isDebt(a)||a.cat==='cash')return null;const k=tauxDev(a);
  if(a.cat!=='bourse'&&a.cat!=='bien'&&(a.value===''||a.value==null)&&a.status!=='rembourse')return null; /* valeur actuelle inconnue : le rendement serait faux */
  if(Array.isArray(a.mv)&&a.mv.length)return a.mv.filter(x=>x&&x.d&&num(x.m)).map(x=>({d:x.d,m:num(x.m)*k}));
  const i=inv(a);if(!(i>0)||!a.date)return null;const F=[{d:a.date,m:i}];
  if(a.cat==='bien'&&num(a.rent)>0){const d=new Date(a.date+'T12:00:00'),t=new Date();if(!isNaN(d)){d.setMonth(d.getMonth()+1);for(let n=0;d<=t&&n<720;n++){F.push({d:d.toLocaleDateString('sv-SE'),m:-num(a.rent)*k});d.setMonth(d.getMonth()+1)}}}
  return F;
}

  const v=val(a),R=CL.tri(F,v);if(!R)return '';const la=livretA(),L=CL.aTauxFixe(F,la);
  let h=`<div class="box mt"><div class="row"><b>Rendement réel</b>${R.tri!=null?`<b class="${R.tri>=0?'pos':'neg'}">${pct(R.tri*100)} par an</b>`:''}</div><div style="margin-top:6px">${kv(a.cat==='bien'?'Prix d’achat moins loyers perçus':'Versé au total (retraits déduits)',eur(R.verse))}${kv('Gain'+(a.cat==='bien'?' (plus-value et loyers bruts)':''),`<span class="${R.gain>=0?'pos':'neg'}">${sgn(R.gain)}</span>`)}`;

  if(num(a.fees)>0){const c=CL.coutFrais(v,a.fees);h+=kv('Frais de gestion ('+nf(a.fees,2)+' %/an)',eur(c.parAn)+' par an')+`<div class="xs mut">Sur 20 ans, à 5 % de rendement brut, ces frais coûteraient environ ${eur(c.total)} de capital en moins.</div>`}
  return h+`</div><p class="hint">Taux de rendement interne : tient compte de la date de chaque versement et de chaque retrait${a.cat==='bien'?', loyers bruts compris (hors charges, travaux et impôts)':''}${devOf(a)?', converti en euros au taux du jour':''}. Le rendement passé ne préjuge pas de l’avenir.</p>`;
}

/* ===================== Revenus passifs sur 12 mois : loyers, intérêts, dividendes, projets ===================== */
const RPT={loyers:['Loyers','#fb923c'],dividendes:['Dividendes','#60a5fa'],projets:['Intérêts des projets','#34d399'],interets:['Intérêts des livrets et fonds euros','#a78bfa']};
function sourcesPassives(){
  const S=[],t=new Date(),k=d=>(d.getFullYear()-t.getFullYear())*12+d.getMonth()-t.getMonth(),dec=11-t.getMonth();
  owned().forEach(a=>{
    const M=Array(12).fill(0),f=tauxDev(a);
    if(a.cat==='bien'){if(num(a.rent)>0){M.fill(num(a.rent)*f);S.push({type:'loyers',nom:a.name,id:a.id,mois:M})}return}
    if(a.cat==='bourse'){
      if(Array.isArray(a.divs)&&a.divs.length){const L=CL.dividendesAVenir(a.divs,a.qty);if(L.some(x=>x))S.push({type:'dividendes',nom:a.name,id:a.id,mois:L})}
      else if(num(a.div)>0){const mo=Math.max(1,Math.min(12,Math.round(num(a.divm))||6))-1;M[(mo-t.getMonth()+12)%12]=num(a.div)*num(a.qty);S.push({type:'dividendes',nom:a.name,id:a.id,mois:M})}
      return}
    if(!live(a)||a.status==='defaut'||!(num(a.rate)>0))return;
    if(isRisky(a)){
      const base=inv(a),e=endDate(a),r=num(a.rate)/100;
      if(a.freq==='mens'||a.freq==='trim'){const s=a.date?new Date(a.date+'T12:00:00'):null,pas=a.freq==='mens'?1:3;for(let i=0;i<12;i++){const d=new Date(t.getFullYear(),t.getMonth()+i,15);if(e&&d>e)break;if(s&&d<s)continue;if(pas===3&&s&&((d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth())%3)continue;M[i]=base*r*pas/12}}
      else if(e){const i=k(e);if(i>=0&&i<12)M[i]=base*r*num(a.dur)/12}
      if(M.some(x=>x))S.push({type:'projets',nom:a.name,id:a.id,mois:M});return}
    M[dec]=val(a)*num(a.rate)/100;S.push({type:'interets',nom:a.name,id:a.id,mois:M}); /* livrets et fonds en euros : intérêts comptés au 31 décembre */
  });
  return S;
}
function passifsHTML(){
  const S=sourcesPassives();if(!S.length)return '';const R=CL.revenusPassifs(S),t=new Date(),mx=Math.max(1,...R.mois.map(x=>x.total));
  const types=Object.keys(RPT).filter(k=>S.some(s=>s.type===k));

/* ===================== Mes banques : comptes liés par Enable Banking (open banking DSP2) =====================
   Les échanges avec la banque passent par l'application Mac (banque/routes, mac/banque-locale.js) : la clé de l'application et
   la session bancaire ne sont jamais dans la page. Ici ne restent que le nom des comptes, leurs soldes (comptés dans le patrimoine) et
   les opérations du compte courant, rangées dans le budget réel comme un relevé importé. Mode d'emploi : docs/BANQUE.md. */
const BQ={busy:false,err:'',code:'',conf:null,sim:false,mock:false,vu:0,manque:[],poll:0};
const BQTYPE={CACC:'Compte courant',SVGS:'Compte d’épargne',CARD:'Carte',LOAN:'Crédit',CASH:'Compte espèces',TRAN:'Compte de transactions',OTHR:'Autre compte'};
/* Adresse des fonctions bancaires : l'application Mac elle-même (app://patrimoine, mac/banque-locale.js) ; sinon config.js (banqueApi)
   ou le site s'il héberge les fonctions. La version en ligne (GitHub Pages) n'en a pas : elle reçoit soldes et opérations par la synchronisation. */
const bqBase=()=>{if(MAC)return location.origin;const c=(window.PATRIMOINE_CONFIG||{}).banqueApi;if(c)return String(c).replace(/\/+$/,'');return !MAC&&/^https?:$/.test(location.protocol)&&!/\.github\.io$/.test(location.hostname)?location.origin:''};
const bqLie=()=>!!(D.bank&&D.bank.liee);
const bqJours=()=>D.bank&&D.bank.valid?Math.floor((Date.parse(D.bank.valid)-Date.now())/864e5):null;
const bqExpire=()=>bqLie()&&(D.bank.statut==='expire'||(bqJours()!=null&&bqJours()<0));
async function bqApi(ch,opt){
  const base=bqBase();if(!base)throw Object.assign(Error('La liaison bancaire n’est pas encore installée pour cette version.'),{code:'non_configure'});
  if(navigator.onLine===false)throw Object.assign(Error('Hors ligne : la banque sera synchronisée au retour de la connexion.'),{code:'hors_ligne'});
  let tok='mac';if(!MAC)try{const{u}=await fbUser();tok=await u.getIdToken()}catch(e){throw Object.assign(Error('Connectez-vous avec Google (Réglages) pour utiliser la liaison bancaire.'),{code:'connexion_requise'})}
  opt=opt||{};const r=await tfetch(base+'/api/banque/'+ch,{method:opt.method||'GET',headers:Object.assign({authorization:'Bearer '+tok},opt.body?{'content-type':'application/json'}:{}),body:opt.body?JSON.stringify(opt.body):undefined},30000),d=await rjson(r);
  if(!r.ok)throw Object.assign(Error(d.message||'Service bancaire indisponible (erreur '+r.status+').'),{code:d.code||'erreur',st:r.status});
  return d;
}
/* Réponse du serveur → D.bank (comptes retrouvés par leur empreinte, stable d'un accord à l'autre) */
function bqApplique(s){
  if(!s)return;if(s.configure===false){BQ.conf=false;BQ.manque=s.manque||[];return}
  BQ.conf=true;BQ.sim=!!s.simulation;BQ.mock=!!s.mockIgnore;
  if(!s.lie){if(bqLie())bqOublier();return}
  const B=D.bank=Object.assign({comptes:[],depuis:{}},D.bank||{}),old=new Map((B.comptes||[]).map(k=>[k.ref,k]));
  Object.assign(B,{banque:s.banque,valid:s.valid,statut:s.statut,liee:s.liee});
  B.comptes=(s.comptes||[]).map(k=>Object.assign({inclus:k.type!=='CARD'&&k.type!=='LOAN'},old.get(k.ref)||{},k));
  if(s.soldes)B.comptes.forEach(k=>{const x=s.soldes[k.uid];if(x&&x.montant!=null){k.solde=x.montant;k.soldeAt=s.at||Date.now();k.soldeDev=x.devise||'EUR';delete k.err}else if(x&&x.erreur)k.err=x.erreur});
}
/* Chaque compte compté devient une ligne « Livrets et liquidités » du patrimoine, mise à jour à chaque synchronisation */
function bqActifs(){
  const B=D.bank;if(!B||!Array.isArray(B.comptes))return;
  B.comptes.forEach(k=>{const id='bq-'+k.ref,i=D.assets.findIndex(x=>x.id===id);
    if(!k.inclus||k.solde==null){if(i>=0&&!k.inclus)D.assets.splice(i,1);return}
    const a=i>=0?D.assets[i]:{id,cat:'cash'};if(i<0){D.assets.push(a);if(D.del)delete D.del[id]}
    Object.assign(a,{name:(B.banque||'Banque')+' · '+k.nom,plat:B.banque||'',amount:k.solde,bq:k.ref,bqAt:k.soldeAt});
    if(k.soldeDev&&k.soldeDev!=='EUR'&&DEVISES[k.soldeDev])a.dev=k.soldeDev;else delete a.dev;delete a.demo});
}
function bqOublier(){D.assets.forEach(a=>{if(a.bq){delete a.bq;delete a.bqAt}});D.bank=null}
function bqInclus(ref){const k=D.bank&&(D.bank.comptes||[]).find(x=>x.ref===ref);if(!k)return;k.inclus=!k.inclus;bqActifs();save();render();toast(k.inclus?'Compte compté dans le patrimoine':'Compte retiré du patrimoine')}
/* Opérations des comptes courants depuis la dernière fois (90 jours au premier passage), page après page */
async function bqOps(){
  const B=D.bank,iso0=d=>d.toLocaleDateString('sv-SE');B.depuis=B.depuis||{};let n=0;
  for(const k of B.comptes.filter(k=>!k.type||k.type==='CACC'||k.type==='TRAN'||k.ops)){
    const d0=new Date();d0.setDate(d0.getDate()-90);let suite='',L=[],i=0;const dep=B.depuis[k.ref]||iso0(d0);
    do{const r=await bqApi('operations?compte='+encodeURIComponent(k.uid)+'&depuis='+dep+(suite?'&suite='+encodeURIComponent(suite):''));L=L.concat(r.operations||[]);suite=r.suite||''}while(suite&&++i<20);
    const neuves=CL.fusionnerOps(D.ops,CL.opsBanque(L,k.ref,D.ops),D.regles,B.banque||'Banque');
    if(k.type&&k.type!=='CACC'&&k.type!=='TRAN')neuves.forEach(o=>{o.cat=CL.pourEpargne(o).cat}); /* épargne : virements neutres, intérêts en revenu */
    if(neuves.length){D.ops=D.ops.concat(neuves);n+=neuves.length}
    const der=L.filter(o=>o.etat!=='PDNG').map(o=>o.d).sort().pop();if(der){const x=new Date(der+'T12:00:00');x.setDate(x.getDate()-5);B.depuis[k.ref]=iso0(x)}
  }
  if(n){opsTrim();UI.bm=''}return n;
}
async function bqSync(force,auto){

    if(!auto)toast('Banque synchronisée'+(n?' : '+n+' nouvelle'+(n>1?'s':'')+' opération'+(n>1?'s':''):''))}
  catch(e){BQ.err=e.message;BQ.code=e.code||'';if(e.code==='consentement_expire'&&D.bank)D.bank.statut='expire';if(e.code==='non_lie')bqOublier();

    save();render();if(!auto)toast(e.message)}

function bqAuto(){if(bqLie()&&D.bank.statut==='actif'&&!bqExpire()&&bqBase()&&(MAC||ID.user)&&navigator.onLine!==false&&Date.now()-(D.bank.sync||0)>6*36e5)bqSync(false,true)}

/* Retour de la banque : l'adresse de l'application reçoit ?code=…&state=… (ou ?error=…), lue une seule fois puis effacée */
/* Retour de la banque : l'adresse de l'application reçoit ?code=…&state=… (ou ?error=…). Gardé le temps de la session du navigateur,
   pour pouvoir terminer la liaison même si la connexion Google n'était pas encore faite (iPhone, autre navigateur), puis effacé. */
const BQRET=(()=>{try{const q=new URLSearchParams(location.search);if(!q.get('state')||/^mac\d/.test(q.get('state'))||!(q.get('code')||q.get('error')))return;
  const r={code:q.get('code')||'',state:q.get('state'),err:q.get('error')?(q.get('error_description')||q.get('error')):'',at:Date.now()};
  history.replaceState(null,'',location.pathname+'#bank');try{sessionStorage.setItem('pat_bq_ret',JSON.stringify(r))}catch(e){BQ.ret=r}}catch(e){}return 1})();
function bqRetourLu(){let r=BQ.ret||null;try{r=JSON.parse(sessionStorage.getItem('pat_bq_ret')||'null')||r}catch(e){}return r&&Date.now()-r.at<30*60e3?r:null}
function bqRetourEfface(){BQ.ret=null;try{sessionStorage.removeItem('pat_bq_ret')}catch(e){}}
async function bqFinir(){
  const R=bqRetourLu();if(!R||BQ.busy)return;
  if(R.err){bqRetourEfface();BQ.err='Liaison annulée : '+R.err+'. Vous pouvez recommencer quand vous voulez.';renderBank();return}
  if(!ID.user){BQ.err='La banque a validé votre accord : connectez-vous avec Google (Réglages) pour terminer la liaison.';BQ.code='connexion_requise';renderBank();return}
  BQ.busy=true;BQ.err='';BQ.code='';renderBank();toast('Finalisation de la liaison bancaire…');
  try{const s=await bqApi('retour',{method:'POST',body:{code:R.code,state:R.state}});bqRetourEfface();bqApplique(s);if(D.bank)D.bank.sync=0;save();BQ.busy=false;BQ.vu=Date.now();toast((s.banque||'Banque')+' liée : '+(s.comptes||[]).length+' compte'+((s.comptes||[]).length>1?'s':''));await bqSync(true,true)}
  catch(e){BQ.busy=false;BQ.err=e.message;BQ.code=e.code||'';if(e.code!=='connexion_requise'&&e.code!=='hors_ligne')bqRetourEfface();renderBank()}
}

/* ===================== Rappels de paiement : versements attendus des plateformes (Bricks le 8, BienPrêter le 5…) =====================
   Le jour prévu, l'application demande si le paiement est arrivé (Oui / Non / Montant différent) ; sans réponse au bout de
   3 jours, il passe « en retard ». Un paiement validé est inscrit dans l'historique du placement et ajouté au patrimoine.
   Si la banque est liée, le virement correspondant est cherché dans ses opérations. Calculs : CL.rappelsDus, CL.rapprocher. */
const RAPST={a_valider:['À confirmer','var(--blue)'],retard:['En retard','var(--warn)']};
const rapDus=()=>CL.rappelsDus(D.rappels,today());
const rapDate=s=>fd(new Date(s+'T12:00:00'));
const plKey=s=>N0(s).replace(/[^a-z0-9]/g,'');
function rapUtilises(){const s=new Set();(D.rappels||[]).forEach(r=>Object.values(r.hist||{}).forEach(h=>{if(h&&h.tx)s.add(h.tx)}));return s}
const rapMatch=x=>bqLie()&&D.ops.length?CL.rapprocher(x.r,x.mois,D.ops,rapUtilises()):null;
/* Placement concerné : celui choisi, sinon les placements en cours de la plateforme du même nom */
function rapPlacements(r){if(r.aid){const a=D.assets.find(x=>x.id===r.aid);return a?[a]:[]}const k=plKey(r.nom);return k?owned().filter(a=>a.cat!=='cash'&&a.plat&&plKey(a.plat)===k&&live(a)):[]}
function rapLigne(x){
  const r=x.r,m=rapMatch(x),st=RAPST[x.statut],q=`data-id="${esc(r.id)}" data-m="${esc(x.mois)}"`,non=r.non&&r.non[x.mois];
  return `<div class="ins"><span style="color:${st[1]}">${ic(x.statut==='retard'?'alert':'bell',22)}</span><div style="flex:1;min-width:0"><div class="row"><b>${esc(r.nom)} : paiement reçu ?</b><span class="badge" style="--c:${st[1]}">${st[0]}</span></div><div class="sm mut">Prévu le ${esc(rapDate(x.date))}${CL.montantHabituel(r)>0?', environ '+eur(CL.montantHabituel(r),2):''}${x.statut==='retard'?', '+x.jours+' jours sans confirmation':''}${non?'. Signalé non reçu le '+esc(rapDate(non)):''}.</div>`
    +(m?`<div class="box sm" style="margin-top:8px"><div style="display:flex;gap:8px;align-items:flex-start"><span style="margin-top:2px">${ic('bank',14)}</span><span>Sur votre compte : <b>${esc(m.lib)}</b>, ${eur(m.m,2)} le ${esc(rapDate(m.d))}.</span></div><div class="acts2"><button class="btn sm" data-act="rapok" ${q} data-tx="${esc(m.id)}">${ic('check',15)}Valider avec cette opération</button></div></div>`:'')
    +`<div class="acts2"><button class="btn sm${m?' sec':''}" data-act="rapoui" ${q}>Oui</button><button class="btn sm sec" data-act="rapnon" ${q}>Non</button><button class="btn sm sec" data-act="rapautre" ${q}>Montant différent</button></div></div></div>`;
}
function rapHTML(){const L=rapDus();if(!L.length)return '';
  return `<section class="card span2" id="rap-card" style="border-color:${L.some(x=>x.statut==='retard')?'var(--warn)':'var(--pt)'}"><div class="ct"><h3>Paiement${L.length>1?'s':''} à confirmer</h3><button class="btn sm sec" data-act="go" data-v="bank">Mes rappels</button></div>${L.map(rapLigne).join('')}</section>`}
/* Où ajouter la somme reçue : le portefeuille de la plateforme (créé au besoin), un compte choisi, ou nulle part.
   Un compte synchronisé avec la banque n'est jamais modifié : son solde inclut déjà le virement. */
function rapDest(r){
  if(r.dest==='aucun')return null;
  if(r.dest==='compte')return D.assets.find(x=>x.id===r.cpt&&x.cat==='cash')||null;
  const id='pf-'+(plKey(r.nom)||r.id);let w=D.assets.find(x=>x.id===id);
  if(!w){w={id,crAt:today(),cat:'cash',name:'Portefeuille '+r.nom,plat:r.nom,amount:0,notes:'Sommes versées par '+r.nom+' et pas encore retirées de la plateforme. Diminuez ce montant quand vous les virez vers votre banque.'};D.assets.push(w)}
  return w;
}
/* Portefeuille d'une plateforme : l'argent versé par la plateforme y reste compté tant qu'il n'est pas viré sur la banque.
   Quand un virement de la plateforme arrive sur le compte lié, le solde de la banque monte : sans correction, la somme serait comptée deux fois. */
const rapPortefeuille=r=>D.assets.find(x=>x.id==='pf-'+(plKey(r.nom)||r.id)&&!x.bq);
function rapRetraits(){
  if(!bqLie()||!D.ops.length)return [];const eb=D.ops.filter(o=>/^eb:/.test(o.fid||'')),out=[];
  (D.rappels||[]).forEach(r=>{const w=rapPortefeuille(r);if(!w||r.dest!=='plateforme'||!(num(w.amount)>0))return;
    const pris=rapUtilises();rapDus().filter(x=>x.r.id===r.id).forEach(x=>{const m=rapMatch(x);if(m)pris.add(m.id)}); /* un virement proposé comme paiement n'est pas un retrait */
    CL.retraitsPossibles(r,eb,pris,w.amount,w.crAt||r.cree).slice(0,3).forEach(x=>out.push({r,w,op:x.op,somme:x.somme}))});
  return out;
}
function rapRetraitHTML(){const L=rapRetraits();if(!L.length)return '';
  return `<section class="card span2 ret-card" style="border-color:var(--blue)"><div class="ct"><h3>Retrait à confirmer</h3></div>${L.map(x=>`<div class="ins"><span style="color:var(--blue)">${ic('bank',22)}</span><div style="flex:1;min-width:0"><b>${esc(x.r.nom)} : ${eur(x.op.m,2)} reçus sur votre compte</b><div class="sm mut">${esc(x.op.lib)}, le ${esc(rapDate(x.op.d))}. Est-ce un retrait de votre portefeuille ${esc(x.r.nom)} (${eur(x.w.amount,2)} comptés) ? Sinon la somme serait comptée deux fois.</div><div class="acts2"><button class="btn sm" data-act="raretire" data-id="${esc(x.r.id)}" data-tx="${esc(x.op.id)}">Oui, retirer ${eur(x.somme,2)} du portefeuille</button><button class="btn sm sec" data-act="raignore" data-id="${esc(x.r.id)}" data-tx="${esc(x.op.id)}">Non, autre chose</button></div></div></div>`).join('')}</section>`}
function rapRetire(id,tx,oui){
  const r=D.rappels.find(x=>x.id===id),o=D.ops.find(x=>x.id===tx),w=r&&rapPortefeuille(r);if(!r||!o||!w)return;
  const avant=JSON.stringify({a:D.assets,r:D.rappels}),som=oui?Math.round(Math.min(o.m,num(w.amount))*100)/100:0;
  r.ret=(r.ret||[]).concat([{tx,d:o.d,m:som,s:oui?'retire':'ignore'}]).slice(-60);if(oui)w.amount=Math.round((num(w.amount)-som)*100)/100;
  save();render();toast(oui?eur(som,2)+' retirés du portefeuille '+r.nom:'D’accord, cette opération est ignorée',{l:'Annuler',fn:()=>{const b=JSON.parse(avant);D.assets=b.a;D.rappels=b.r;save();render()}});
}
function rapValider(id,mois,mt,o){
  const r=D.rappels.find(x=>x.id===id);mt=Math.round(num(mt)*100)/100;if(!r||!(mt>0))return;o=o||{};
  const avant=JSON.stringify({a:D.assets,r:D.rappels}),d=o.d||today(),c=Math.max(0,Math.min(mt,Math.round(num(o.c)*100)/100)),cand=rapPlacements(r);
  const a=o.aid!==undefined?D.assets.find(x=>x.id===o.aid)||null:cand.length===1?cand[0]:null;
  r.hist=Object.assign({},r.hist,{[mois]:{s:'recu',m:mt,c:c||undefined,d,tx:o.tx||undefined,aid:a?a.id:undefined}});if(r.non)delete r.non[mois];
  if(a){ /* historique du placement, versements datés (rendement réel), capital remboursé déduit */
    a.paie=(a.paie||[]).concat([{d,m:mt,c:c||undefined,r:r.id,mois}]).slice(-120);
    if((!Array.isArray(a.mv)||!a.mv.length)&&a.date&&num(a.amount)>0)a.mv=[{d:a.date,m:num(a.amount)}];
    if(Array.isArray(a.mv)&&a.mv.length)a.mv.push({d,m:-mt});
    if(c>0){a.amount=Math.max(0,Math.round((num(a.amount)-c)*100)/100);if(a.value!==''&&a.value!=null)a.value=Math.max(0,Math.round((num(a.value)-c)*100)/100)}
    delete a.demo}
  const w=o.tx?null:rapDest(r);if(w&&!w.bq)w.amount=Math.round((num(w.amount)+mt)*100)/100;
  save();closeM();render();
  toast(eur(mt,2)+' de '+r.nom+' enregistrés'+(o.tx||(w&&w.bq)?', déjà comptés dans le solde de la banque':w?' dans « '+w.name+' »':''),{l:'Annuler',fn:()=>{const b=JSON.parse(avant);D.assets=b.a;D.rappels=b.r;save();render()}});
}
function rapMontant(id,mois){
  const r=D.rappels.find(x=>x.id===id);if(!r)return;const cand=rapPlacements(r);
  sheet('Paiement de '+r.nom,`<p class="sm mut">Prévu le ${esc(rapDate(CL.echeanceR(r,mois)))}. Indiquez la somme réellement reçue.</p><div class="g2"><div class="fld"><label for="rv-m">Montant reçu</label><div class="inp has"><input id="rv-m" type="number" inputmode="decimal" step="any" min="0" value="${CL.montantHabituel(r)||''}"><span class="suf">€</span></div></div><div class="fld"><label for="rv-d">Reçu le</label><input id="rv-d" type="date" value="${today()}"></div></div>
  <div class="fld"><label for="rv-c">Dont capital remboursé<span class="opt">facultatif</span></label><div class="inp has"><input id="rv-c" type="number" inputmode="decimal" step="any" min="0"><span class="suf">€</span></div><div class="hint">Pour un prêt remboursé chaque mois (BienPrêter…) : la part de capital réduit le montant encore investi ; le reste, ce sont les intérêts.</div></div>
  ${cand.length>1?`<div class="fld"><label for="rv-a">Placement concerné</label><select id="rv-a"><option value="">Plusieurs projets (non réparti)</option>${cand.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div>`:cand.length?`<p class="hint">Inscrit dans l’historique de « ${esc(cand[0].name)} ».</p>`:''}<div class="err" id="rv-e"></div><div class="g2 mt" style="margin-top:20px"><button class="btn sec" data-act="closeM">Annuler</button><button class="btn" data-act="rapsave" data-id="${esc(id)}" data-m="${esc(mois)}">Valider</button></div>`);
}
function rapNon(id,mois){
  const r=D.rappels.find(x=>x.id===id);if(!r)return;const q=`data-id="${esc(id)}" data-m="${esc(mois)}"`;
  sheet('Paiement non reçu',`<p class="sm mut">${esc(r.nom)}, prévu le ${esc(rapDate(CL.echeanceR(r,mois)))}.</p><div class="stack mt"><button class="btn" data-act="rapattente" ${q}>Pas encore reçu : me le rappeler</button><div class="hint" style="margin-top:-4px">Le rappel reste affiché ; il passe « en retard » 3 jours après la date prévue.</div><button class="btn sec" data-act="rapabsent" ${q}>Pas de paiement ce mois-ci</button><div class="hint" style="margin-top:-4px">Ferme le rappel de ce mois sans rien enregistrer.</div></div>`);
}
function rapListeHTML(){
  const R=D.rappels||[],perm=!MAC&&typeof Notification!=='undefined'?Notification.permission:'';
  let h=`<section class="card span2"><div class="ct"><h3 style="display:flex;align-items:center;gap:8px">${ic('bell',18)}Rappels de paiement</h3><button class="btn sm sec" data-act="rapnew">${ic('plus',15)}Ajouter</button></div><p class="sm mut">Le jour prévu, l’application vous demande si le paiement est arrivé ; sans réponse au bout de 3 jours, il passe en retard.${bqLie()?' Le virement est cherché dans les opérations de votre banque.':''}</p>`;
  if(perm==='default')h+=`<button class="btn sm sec mt" data-act="rapnotif">${ic('bell',15)}Recevoir aussi une notification du navigateur</button>`;
  else if(perm==='denied')h+='<p class="hint">Notifications du navigateur bloquées : les rappels s’affichent dans l’application.</p>';

const DOCT={contrat:'Contrat',releve:'Relevé',impots:'Impôts',facture:'Facture',autre:'Autre'},DOC_MAX=25e6;
const COF={db:null,cles:{}};
function cofDb(){if(!COF.db)COF.db=new Promise((ok,ko)=>{const r=indexedDB.open('patrimoine-coffre',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs');d.createObjectStore('cles')};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error||Error('stockage indisponible'))});return COF.db}
const cofOp=(st,mode,fn)=>cofDb().then(db=>new Promise((ok,ko)=>{const t=db.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error||Error('stockage'));t.onabort=()=>ko(t.error||Error('stockage plein'))}));
/* Clé AES-256 : sur le Mac, gardée par le trousseau (MAC.cleCoffre) ; dans le navigateur, clé non exportable gardée par l'appareil */
async function cofCle(k){
  if(COF.cles[k])return COF.cles[k];
  if(k==='mac'){const b=await MAC.cleCoffre(),raw=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return COF.cles.mac=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
  let c=await cofOp('cles','readonly',s=>s.get('web'));
  if(!c){c=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await cofOp('cles','readwrite',s=>s.put(c,'web'))}
  return COF.cles.web=c;
}
async function cofAjouter(f,aid,cat){
  if(f.size>DOC_MAX)throw Error(f.name+' dépasse 25 Mo');
  let k=MAC&&MAC.cleCoffre?'mac':'web',cle;try{cle=await cofCle(k)}catch(e){if(k!=='mac')throw e;k='web';cle=await cofCle(k)}
  const iv=crypto.getRandomValues(new Uint8Array(12)),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},cle,await f.arrayBuffer()),id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await cofOp('docs','readwrite',s=>s.put({iv,data},id));
  D.docs.push({id,nom:String(f.name||'document').slice(0,120),type:f.type||'',taille:f.size,date:today(),aid:aid||'',cat:DOCT[cat]?cat:(aid?'contrat':'autre'),k});return id;
}
async function cofLire(id){
  const m=D.docs.find(x=>x.id===id),e=await cofOp('docs','readonly',s=>s.get(id));if(!m||!e)throw Error('document absent de cet appareil');
  return crypto.subtle.decrypt({name:'AES-GCM',iv:e.iv},await cofCle(m.k||'web'),e.data);
}
async function docsAjouter(files,aid,cat){
  let n=0;for(const f of files){try{await cofAjouter(f,aid,cat);n++}catch(e){toast('Document non ajouté : '+e.message)}}
  if(n){save();toast(n+' document'+(n>1?'s':'')+' rangé'+(n>1?'s':'')+' dans le coffre');if(aid&&$('modal').classList.contains('open'))openDetail(aid);else if($('modal').classList.contains('open'))openDocs();if(UI.view==='set')renderSet()}
}
function docOuvrir(id){
  const m=D.docs.find(x=>x.id===id);if(!m)return;
  /* dans le navigateur, seuls les PDF, images et textes s'ouvrent dans un onglet ; le reste (HTML, SVG…) est téléchargé : il ne doit jamais s'exécuter dans l'application */
  const sur=/^(application\/pdf|image\/(png|jpe?g|gif|webp|heic|heif)|text\/plain)$/i.test(m.type||'');if(!MAC&&!sur){docTelecharger(id);return}
  const w=!MAC?window.open('','_blank'):null;
  cofLire(id).then(b=>{if(MAC&&MAC.ouvrirDocument)return MAC.ouvrirDocument(m.nom,new Uint8Array(b));const u=URL.createObjectURL(new Blob([b],{type:m.type}));if(w)w.location=u;else{const a=document.createElement('a');a.href=u;a.download=m.nom;document.body.appendChild(a);a.click();a.remove()}setTimeout(()=>URL.revokeObjectURL(u),6e4)})
    .catch(e=>{if(w)w.close();toast('Ouverture impossible : '+e.message)});
}
function docTelecharger(id){const m=D.docs.find(x=>x.id===id);if(!m)return;cofLire(id).then(b=>{const u=URL.createObjectURL(new Blob([b],{type:m.type||'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download=m.nom;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)}).catch(e=>toast('Téléchargement impossible : '+e.message))}

function calc(){if(UI.tool==='fire')return calcFire();if(UI.tool==='vente')return calcVente();if(UI.tool==='succ')return calcSucc();if(UI.tool==='tax')calcTax();else if(UI.tool==='proj')calcProj();else if(UI.tool==='alloc')calcAlloc();else if(UI.tool==='loan')calcLoan();else calcNew()}
const ALLOC=['bourse','epargne','cash','crowd','immo','autre'];
function allocNow(){const v={};owned().forEach(a=>{if(ALLOC.includes(a.cat))v[a.cat]=(v[a.cat]||0)+val(a)});const t=Object.values(v).reduce((s,x)=>s+x,0),p={};ALLOC.forEach(k=>{p[k]=t>0?(v[k]||0)/t*100:0});return{v,t,p}}
function calcAlloc(){
  const o=$('al-out');if(!o)return;const tg={};let sum=0;
  ALLOC.forEach(k=>{const e=$('al-'+k);if(e&&e.value!==''){tg[k]=Math.max(0,Math.min(100,num(e.value)));sum+=tg[k]}});
  D.target=tg;clearTimeout(calcAlloc.t);calcAlloc.t=setTimeout(save,600);
  if(!sum){o.innerHTML='<p class="sm mut">Saisissez au moins une part visée.</p>';return}
  const cur=allocNow(),add=Math.max(0,num($('al-add').value)),F=cur.t+add;
  let h=Math.abs(sum-100)>0.5?`<div class="box sm warnc">Vos cibles totalisent ${nf(sum,0)} % au lieu de 100 % : elles sont ramenées à 100 % pour le calcul.</div>`:'';
  const need=ALLOC.map(k=>{const w=(tg[k]||0)/sum,goal=w*F,c=cur.v[k]||0;return{k,w,c,gap:goal-c}});
  const pos=need.filter(x=>x.gap>0),ps=pos.reduce((s,x)=>s+x.gap,0);
  need.forEach(x=>{x.put=ps>0&&add>0?Math.min(x.gap,x.gap/ps*add):0});
  h+=`<div class="mt">${need.filter(x=>x.w>0||x.c>0).map(x=>kv(esc(CATS[x.k].n),`${x.gap>=0?'manque ':'excédent '}${eur(Math.abs(x.gap))}${x.put>=1?` <span class="pos xs">→ verser ${eur(x.put)}</span>`:''}`)).join('')}</div>`;
  if(add>0)h+=`<p class="sm mt">Pour vous rapprocher de la cible, répartissez vos ${eur(add)} ainsi : ${need.filter(x=>x.put>=1).map(x=>'<b>'+eur(x.put)+'</b> en '+esc(CATS[x.k].n.toLowerCase())).join(', ')||'aucun écart à combler'}.</p>`;
  o.innerHTML=h;
}
function calcLoan(){
  const g=id=>num($(id).value),P=g('l-amt'),r=g('l-rate')/1200,n=Math.round(g('l-y')*12),ins=P*g('l-ins')/1200,inc=g('l-inc');
  if(!(P>0)||!(n>0)){$('l-out').innerHTML='';return}
  const M=r?P*r/(1-Math.pow(1+r,-n)):P/n,cost=M*n-P,ic=ins*n;
  const yr=[];let c=P;for(let y=1;y<=Math.ceil(n/12);y++){let it=0,cp=0;for(let m=0;m<12&&(y-1)*12+m<n;m++){const i=c*r;it+=i;cp+=M-i;c-=M-i}yr.push({t:y,v:Math.max(0,c),it,cp})}
  let h=`<div class="g2"><div class="box"><div class="sm mut">Mensualité</div><div class="big" style="font-size:26px">${eur(M+ins,2)}</div><div class="xs mut">dont ${eur(ins,2)} d’assurance</div></div><div class="box"><div class="sm mut">Coût total</div><div class="big" style="font-size:26px">${eur(cost+ic)}</div><div class="xs mut">intérêts ${eur(cost)}, assurance ${eur(ic)}</div></div></div>`;
  if(inc>0){const te=(M+ins)/inc*100;h+=`<p class="mt">Taux d’endettement : <b class="${te>35?'neg':'pos'}">${nf(te,1)}\u00a0%</b> ${te>35?'(au-dessus du plafond habituel de 35 % appliqué par les banques)':'(sous le plafond habituel de 35 %)'}. Le calcul compte aussi vos autres crédits en cours : ${eur(loanPay())} par mois enregistrés dans l’application.</p>`}
  if(yr.length>1)h+=lineChart([{p:[{t:0,v:P}].concat(yr.map(x=>({t:x.t,v:x.v}))),c:'var(--red)',area:true}],{id:'l',tf:'year',xl:['Aujourd’hui','Dans '+yr.length+' ans'],aria:'Capital restant dû année après année'})+'<div class="xs mut" style="margin:4px 0 8px">Capital restant dû année après année.</div>';
  h+=[1,Math.ceil(yr.length/2),yr.length].filter((x,i,A)=>A.indexOf(x)===i&&x<=yr.length).map(y=>{const x=yr[y-1];return kv('Année '+y,`${eur(x.cp)} de capital, ${eur(x.it)} d’intérêts`)}).join('');
  $('l-out').innerHTML=h;
}
function calcTax(){
  const g=id=>num($(id).value),I=g('t-inc'),T=g('t-tmi')/100,P=g('t-ps')/100,pfu=I*(.128+P),bar=I*P+I*(1-.068)*T,win=pfu<=bar;
  const bx=(t,v,w)=>`<div class="box"${w?' style="border-color:var(--pt)"':''}><div class="sm mut">${t}</div><div class="big" style="font-size:26px">${eur(v)}</div><div class="sm">net ${eur(I-v)}</div></div>`;

function calcProj(){
  const g=id=>num($(id).value),cap=g('p-cap'),m=g('p-mo'),rr=g('p-r'),r=rr/1200,y=Math.max(0,Math.min(60,Math.round(g('p-y')))),t=num($('p-env').value)/100;
  let c=cap,iv=cap;const A=[{t:0,v:c}],B=[{t:0,v:iv}];
  for(let k=1;k<=y*12;k++){c=c*(1+r)+m;iv+=m;if(k%12===0){A.push({t:k/12,v:c});B.push({t:k/12,v:iv})}}

  if(D.goal>0){const yr=yearsToGoal(D.goal,cap,m,rr);goal=`<div class="kv"><span>Objectif de ${eur(D.goal)}</span><b>${yr===0?'déjà atteint':yr==null?'hors de portée avec ces paramètres':'atteint en '+nf(yr,1)+' ans (avant impôt)'}</b></div>`}

}

/* fetch avec délai maximal : évite qu'une requête bloquée fige l'assistant */
async function tfetch(url,opt,ms){
  if(typeof url==='string'&&url.indexOf('/api/market')===0){let o;try{o=await marketApi(url)}catch(e){o={error:e.message}}return new Response(JSON.stringify(o),{status:o.error?502:200,headers:{'content-type':'application/json'}})}
  ms=ms||45000;const c=typeof AbortController!=='undefined'?new AbortController():null,t=c?setTimeout(()=>c.abort(),ms):0;
  try{return await fetch(url,Object.assign({},opt||{},c?{signal:c.signal}:{}))}
  catch(e){const ab=e&&e.name==='AbortError',x=Error(ab?'Pas de réponse au bout de '+Math.round(ms/1000)+' s.':'Connexion impossible : appareil hors ligne, réseau filtré ou requête bloquée par le navigateur.');x.st=ab?-2:-1;throw x}
  finally{if(t)clearTimeout(t)}
}

/* Trois façons d'envoyer la clé, essayées dans l'ordre ; la première qui passe est retenue.
   0 : en-tête x-goog-api-key   1 : paramètre ?key=   2 : ?key= et corps text/plain (requête « simple », sans pré-vérification CORS) */
async function gFetch(path,key,body,ms){
  const saved=+localStorage.getItem(KGT)||0,modes=[saved].concat([0,1,2].filter(x=>x!==saved));let last;
  for(const mo of modes){
    const url=GAPI+path+(mo?(path.includes('?')?'&':'?')+'key='+encodeURIComponent(key):''),h={};
    if(mo===0)h['x-goog-api-key']=key;if(body&&mo!==2)h['content-type']='application/json';
    try{const r=await tfetch(url,{method:body?'POST':'GET',headers:h,body:body||undefined},ms);if(mo!==saved)localStorage.setItem(KGT,String(mo));return r}
    catch(e){last=e;if(e.st!==-1)throw e}

}

function gKind(m,st){

  if(/referer|referrer/i.test(m))return 'referer';
  if(/location is not supported|not available in your country/i.test(m))return 'region';
  if(st===401||/API key not valid|API_KEY_INVALID|API key expired|invalid api key/i.test(m))return 'key';
  if(st===403&&/SERVICE_DISABLED|has not been used|is disabled|not been enabled/i.test(m))return 'disabled';
  if(st===403)return 'key';
  if(st===404||/not found|not supported for generateContent|no longer available/i.test(m))return 'nomodel';
  if(st===429||/quota|rate.?limit|RESOURCE_EXHAUSTED/i.test(m)){if(/limit:\s*0\b/i.test(m))return 'free0';if(/per.?day|PerDay|daily/i.test(m))return 'daily';return 'rpm'}
  if(st>=500||/overloaded|high demand|UNAVAILABLE|try again later/i.test(m))return 'busy';
  if(st===400&&/thinking/i.test(m))return 'think';

  const rate=q=>{const L=nums(q).filter(x=>x.u==='%'&&!/tmi|tranche/.test(x.before));return L.length?L[0].v:null};
  const months=q=>{const L=nums(q);const m=L.find(x=>x.u==='mois'&&!x.mo);if(m)return m.v;const y=L.find(x=>x.u==='ans');return y?y.v*12:null};

  const STOP=new Set(['exemple','projet','residence','programme','operation','livret','compte','assurance','epargne','fonds','monde','bourse','plateforme','placement','actions','action','immobilier','crowdlending','banque','france','groupe','societe','dans','pour','avec','mon','mes']);
  function findAsset(t){
    let best=null,bs=0;
    D.assets.forEach(a=>{
      const n=N(String(a.name||'').replace(/\(exemple\)/i,''));let s=0;
      if(n.length>=4&&t.includes(n))s=10;
      else n.split(' ').filter(w=>w.length>=4&&!STOP.has(w)).forEach(w=>{if(W(t,w))s+=w.length>=5?2:1});
      if(a.tick&&W(t,N(a.tick)))s+=5;
      if(s>bs){bs=s;best=a}
    });
    return bs>=2?best:null;
  }
  function findPlat(t){
    const L=[...new Set(Object.keys(PL).concat(D.assets.map(a=>a.plat).filter(Boolean)))].filter(p=>p!=='Autre plateforme');

    return L.find(p=>{const n=N(p);return n.length>=4&&t.includes(n)})||null;
  }

  /* ---------- Base de connaissances ---------- */
  const KB=[
    {k:['pfu','flat tax','prelevement forfaitaire'],t:`#### Le PFU (« flat tax »)\nC’est l’imposition par défaut des revenus du capital (intérêts, dividendes, plus-values) : **31,4 %** en 2026, soit **12,8 %** d’impôt sur le revenu et **18,6 %** de prélèvements sociaux (17,2 % pour l’assurance-vie et certains produits d’épargne).\n\n- Il s’applique au crowdlending, au compte-titres et aux dividendes.\n- Vous pouvez opter pour le **barème progressif** si votre tranche marginale est de 0 % ou 11 % : l’option vaut alors pour tous vos revenus du capital de l’année.\n- Le simulateur « Impôt » de l’onglet Outils compare les deux avec vos chiffres.`,s:['Combien d’impôt sur mes intérêts ?','PFU ou barème pour une TMI à 11 % ?']},
    {k:['bareme','tmi','tranche marginale'],t:`#### Barème progressif et TMI\nLa tranche marginale d’imposition (TMI : 0, 11, 30, 41 ou 45 %) est le taux qui s’applique à la dernière part de vos revenus. Opter pour le barème fait imposer vos revenus du capital à votre TMI, plus les prélèvements sociaux, avec 6,8 % de CSG déductible.\n\n- **TMI 0 % ou 11 %** : le barème est généralement plus avantageux que le PFU.\n- **TMI 30 % et plus** : le PFU l’emporte presque toujours.\n\nDites-moi par exemple « impôt avec une TMI à 11 % » pour un calcul sur vos revenus.`,s:['Impôt avec une TMI à 11 %','Qu’est-ce que le PFU ?']},
    {k:['crowdlending','pret participatif','prets participatifs','crowdfunding','financement participatif'],t:`#### Le crowdlending\nVous prêtez de l’argent à une entreprise (souvent un promoteur immobilier) via une plateforme, contre un taux annoncé, souvent de 8 à 12 % par an, pour 12 à 36 mois.\n\n**Les risques**\n- **Perte en capital** : aucune garantie de remboursement, un projet peut faire défaut.\n- **Retards** fréquents, et prolongations prévues par les contrats.\n- **Illiquidité** : l’argent est bloqué jusqu’au remboursement.\n- Remboursement souvent **in fine** : tout le risque se joue à l’échéance.\n\n**Les bonnes pratiques**\n- Petits montants répartis sur de nombreux projets et au moins trois plateformes.\n- Plateforme agréée PSFP par l’AMF (règlement européen, en vigueur depuis novembre 2023).\n- Lire les garanties : hypothèque de premier rang, caution de la maison mère, fiducie.\n- Intérêts imposés au PFU de 31,4 %.`,s:['Quelles garanties regarder ?','Que faire si un projet est en retard ?']},
    {k:['immobilier fractionne','fractionne','briques','brique'],t:`#### L’immobilier fractionné\nDes plateformes comme Bricks ou Ma Première Brique vous permettent d’investir de petites sommes dans des projets immobiliers, souvent sous forme de prêts à un promoteur ou de parts d’un bien.\n\n- Rendement annoncé souvent entre 7 et 11 %, **non garanti**.\n- Mêmes risques que le crowdlending : retard, défaut, argent bloqué.\n- Vérifiez s’il s’agit d’un prêt (obligation, dette) ou d’une part de propriété : le risque et la fiscalité diffèrent.`},
    {k:['scpi','pierre papier'],t:`#### Les SCPI\nUne SCPI achète et loue un parc immobilier (bureaux, commerces, santé…) et vous reverse les loyers. Le rendement de distribution tourne souvent autour de 4 à 6 % brut.\n\n- **Frais d’entrée** élevés (souvent 8 à 12 %) : horizon de 8 à 10 ans conseillé.\n- La valeur des parts peut **baisser**, comme on l’a vu en 2023 et 2024.\n- Revente pas toujours immédiate.\n- Loyers imposés comme revenus fonciers (TMI + 17,2 %), sauf détention via une assurance-vie.`},
    {k:['etf','tracker','fonds indiciel','msci','s p 500','sp 500','nasdaq'],t:`#### Les ETF (trackers)\nUn ETF réplique un indice (MSCI World, S&P 500…) : en une seule ligne, vous détenez des centaines d’entreprises, avec des frais faibles (souvent 0,1 à 0,4 % par an).\n\n- Idéal pour la **diversification** et le **long terme** (8 ans et plus).\n- Il suit le marché à la hausse comme à la baisse : des chutes de 30 % ou plus sont possibles.\n- Beaucoup d’ETF monde sont éligibles au **PEA** grâce à une réplication synthétique.\n- Des versements réguliers (DCA) lissent le prix d’achat.`},
    {k:['pea','plan d epargne en actions'],t:`#### Le PEA\n- Plafond de versement : **150 000 €** (225 000 € avec le PEA-PME).\n- Actions européennes et ETF éligibles, y compris des ETF monde.\n- Après **5 ans** : gains exonérés d’impôt sur le revenu, seuls les prélèvements sociaux restent dus.\n- Retrait avant 5 ans : clôture du plan dans la plupart des cas, et gains imposés au PFU.\n\nC’est souvent l’enveloppe la plus efficace pour investir en actions à long terme.`},
    {k:['assurance vie','assurances vie','fonds euros','fonds euro','unites de compte'],t:`#### L’assurance-vie\n- **Fonds euros** : capital garanti par l’assureur, rendement modeste.\n- **Unités de compte** (ETF, SCPI…) : plus de potentiel, capital non garanti.\n- Fiscalité douce après **8 ans** : abattement annuel de 4 600 € sur les gains retirés (9 200 € pour un couple).\n- Transmission : jusqu’à **152 500 € par bénéficiaire** hors succession pour les versements faits avant 70 ans.\n- L’argent reste disponible à tout moment, contrairement au PER.`},
    {k:['per','plan epargne retraite','epargne retraite'],t:`#### Le PER\n- Les versements sont **déductibles** de votre revenu imposable, dans la limite d’un plafond : intéressant si votre TMI est de 30 % ou plus.\n- L’argent est **bloqué jusqu’à la retraite**, sauf cas précis (achat de la résidence principale, accidents de la vie).\n- À la sortie, le capital issu des versements déduits est imposé.\n\nL’avantage dépend surtout de l’écart entre votre TMI aujourd’hui et celle de votre retraite.`},
    {k:['livret a','ldds','lep','livret'],t:`#### Les livrets réglementés\n- **Livret A** : plafond de 22 950 €. **LDDS** : 12 000 €. **LEP** : 10 000 €, sous conditions de revenus et mieux rémunéré.\n- Intérêts **exonérés** d’impôt et de prélèvements sociaux, argent disponible à tout moment.\n- Taux fixés par l’État et révisés en général deux fois par an.\n\nC’est l’endroit naturel de l’épargne de précaution.`},
    {k:['precaution','epargne de securite','matelas','fonds d urgence'],t:`#### L’épargne de précaution\nC’est une réserve disponible immédiatement pour les imprévus : panne de voiture, perte d’emploi, dépense de santé.\n\n- Repère courant : **3 à 6 mois de dépenses**, davantage pour un indépendant.\n- À placer sur un livret (Livret A, LDDS, LEP) et **jamais** en crowdlending, SCPI ou bourse.\n- Elle passe avant les placements risqués : elle évite de devoir vendre au mauvais moment.\n\nIndiquez vos dépenses mensuelles (par exemple « mes dépenses sont de 2 000 € par mois ») pour que je calcule votre couverture.`},
    {k:['diversif'],t:`#### La diversification\nRépartir son argent pour qu’un seul problème ne fasse pas trop de dégâts :\n- **Entre classes d’actifs** : liquidités, bourse, immobilier, prêts.\n- **À l’intérieur** de chaque classe : un ETF monde plutôt qu’une seule action, beaucoup de petits projets plutôt qu’un gros.\n- **Entre intermédiaires** : plusieurs plateformes, plusieurs porteurs de projet.\n\nDemandez « comment mieux diversifier mes placements ? » pour une analyse de votre répartition.`},
    {k:['interets composes','capitalisation','boule de neige'],t:`#### Les intérêts composés\nLes gains produisent à leur tour des gains. Exemple : 10 000 € placés à 5 % par an deviennent environ **16 289 €** en 10 ans, **26 533 €** en 20 ans et **43 219 €** en 30 ans, sans aucun versement.\n\nLe temps compte donc davantage que le montant de départ. Pour une projection personnalisée, écrivez par exemple : « simule 200 € par mois à 6 % pendant 20 ans ».`},
    {k:['inflation','pouvoir d achat'],t:`#### L’inflation\nElle réduit la valeur réelle de votre argent : avec 2 % d’inflation par an, 10 000 € n’achètent plus que l’équivalent de 8 200 € d’aujourd’hui au bout de 10 ans.\n\n- Un placement à 3 % avec 2 % d’inflation ne rapporte réellement que 1 % environ.\n- Les actions et l’immobilier protègent en général mieux sur le long terme que les livrets.`},
    {k:['dca','investissement programme','versements programmes','lisser','versements reguliers'],t:`#### Investir régulièrement (DCA)\nVerser la même somme chaque mois, quel que soit le marché :\n- Vous achetez davantage de parts quand les prix baissent.\n- Vous évitez de tout investir juste avant une chute.\n- Cela crée une habitude simple, souvent automatisable chez le courtier.\n\nC’est une méthode de discipline, pas une garantie de gain.`},
    {k:['garantie','garanties','hypotheque','caution','gapd','fiducie','nantissement','surete'],t:`#### Les garanties d’un projet\nDe la plus solide à la plus faible, en général :\n- **Fiducie-sûreté** : le bien est transféré à un tiers en garantie.\n- **Hypothèque de premier rang** : vous êtes payé en premier sur la vente du bien. En deuxième rang, la banque passe avant vous.\n- **Garantie autonome à première demande (GAPD)** ou **caution** : ne vaut que ce que vaut le garant. Préférez la maison mère solide à une SPV sans actifs.\n- **Nantissement de parts** : utile, mais faible si la société ne vaut plus rien.\n\nVérifiez qui garantit, à quel rang et pour quel montant par rapport à la dette.`},
    {k:['in fine','amortissable','amortissement'],t:`#### In fine ou amortissable\n- **In fine** : vous recevez les intérêts (parfois seulement à la fin) et tout le capital à l’échéance. Le risque est concentré sur la fin du projet.\n- **Amortissable** : vous récupérez une part du capital à chaque échéance. Le risque diminue avec le temps et l’argent peut être réinvesti progressivement.`},
    {k:['defaut','en retard','retard','recouvrement','procedure collective','redressement','liquidation judiciaire'],t:`#### Projet en retard ou en défaut\n1. Demandez par écrit à la plateforme la cause, la nouvelle date et les garanties activables.\n2. Suivez les communications : la plateforme gère en général le recouvrement et la déclaration de créance.\n3. Ne réinvestissez pas chez le même porteur tant que la situation n’est pas réglée.\n4. Mettez le statut à jour dans l’application pour garder un indice réaliste.\n5. En cas de perte définitive, elle peut sous conditions être imputée sur les intérêts de même nature : demandez l’attestation à la plateforme.\n\nUn retard n’est pas une perte : beaucoup de projets finissent remboursés, avec des intérêts de retard.`},
    {k:['amf','agrement','orias','psfp','regule','regulation','arnaque'],t:`#### Vérifier une plateforme\n- **Crowdlending** : agrément de prestataire de services de financement participatif (PSFP) délivré par l’AMF, à vérifier dans le registre sur amf-france.org.\n- **Conseillers et intermédiaires** : immatriculation à l’ORIAS (orias.fr).\n- Consultez les **listes noires** de l’AMF et de l’ACPR.\n- Méfiez-vous des rendements « garantis » élevés, de la pression pour décider vite et des demandes de virement vers l’étranger.`},
    {k:['crypto','bitcoin','ethereum'],t:`#### Les cryptomonnaies\n- Très **volatiles** : des baisses de 50 à 80 % se sont déjà produites plusieurs fois.\n- Plus-values imposées au moment de la conversion en euros (flat tax), pas lors des échanges entre cryptos.\n- Prestataire à choisir parmi ceux enregistrés auprès de l’AMF (PSAN) ou agréés MiCA.\n- Règle de prudence courante : n’y mettre que ce que vous acceptez de perdre en totalité.`},
    {k:['l or','lingot','napoleon','metal precieux','metaux precieux'],t:`#### L’or\n- Valeur refuge en période de crise, mais ne verse ni intérêts ni dividendes.\n- Or physique : frais d’achat et de revente, stockage. ETC ou ETF sur l’or : plus simple.\n- Fiscalité spécifique : taxe forfaitaire sur le prix de vente, ou régime des plus-values avec justificatifs.\n- Souvent limité à une petite part du patrimoine (5 à 10 %).`},
    {k:['frais'],t:`#### Les frais\nIls grignotent la performance chaque année : 1 % de frais en plus sur 20 ans représente près de 18 % de capital en moins.\n- Comparez les frais de gestion (ETF souvent sous 0,3 %, fonds actifs souvent au-dessus de 1,5 %).\n- En assurance-vie : frais sur versements et frais de gestion annuels.\n- En SCPI : frais d’entrée élevés, d’où un horizon long.`},
    {k:['obligation','obligations'],t:`#### Les obligations\nUne obligation est un prêt à un État ou à une entreprise, remboursé à une date fixée, avec des intérêts réguliers. Le risque dépend de l’émetteur. Leur prix baisse quand les taux montent, et monte quand les taux baissent. Les fonds et ETF obligataires permettent de diversifier.`},
    {k:['krach','baisse des marches','volatil','chute','marche baisse'],t:`#### Quand la bourse baisse\n- Les baisses de 20 à 30 % font partie du cycle normal des marchés.\n- Vendre dans la panique transforme une perte temporaire en perte définitive.\n- Avec une épargne de précaution et un horizon long, on peut attendre, voire continuer ses versements.\n- La diversification (ETF monde) limite l’impact d’une entreprise ou d’un pays.`},
    {k:['document','documents','verifier avant','avant d investir','due diligence','quoi verifier'],t:`#### Avant d’investir dans un projet\n1. **La plateforme** : agrément AMF (PSFP), ancienneté, taux de défaut publiés.\n2. **Le porteur** : comptes sur Pappers ou Infogreffe, historique, procédures (BODACC).\n3. **Le projet** : permis de construire purgé, taux de précommercialisation, apport du promoteur (au moins 10 %).\n4. **Les garanties** : rang de l’hypothèque, qui se porte caution, fiducie.\n5. **Le contrat** : in fine ou amortissable, possibilité de prolongation, subordination.\n6. **Votre exposition** : le projet ne devrait pas dépasser quelques pourcents de votre patrimoine.\n\nL’import de contrat (bouton « Importer ») repère automatiquement une partie de ces points.`},
    {k:['pea','assurance vie'],all:true,t:`#### PEA ou assurance-vie ?\n- **Contenu** : PEA pour les actions et ETF européens ou éligibles ; assurance-vie pour le fonds euros, les unités de compte, les SCPI.\n- **Plafond** : 150 000 € de versements sur le PEA ; pas de plafond en assurance-vie.\n- **Fiscalité** : PEA exonéré d’impôt sur le revenu après 5 ans ; assurance-vie avec abattement de 4 600 € par an (9 200 € en couple) après 8 ans.\n- **Frais** : souvent plus bas sur un PEA en ligne avec des ETF.\n- **Transmission** : avantage net pour l’assurance-vie.\n\nBeaucoup d’épargnants utilisent les deux : le PEA pour les actions à long terme, l’assurance-vie pour la sécurité (fonds euros) et la transmission.`}

  const SUG={news:['Actualités du pétrole en Asie','Actualités technologie aux États-Unis'],budget:['Où en sont mes objectifs ?','Comment mieux diversifier ?'],debt:['Remboursement anticipé : ça vaut le coup ?','Fais le bilan de mon patrimoine'],global:['Que me conseilles-tu en priorité ?','Quels sont mes principaux risques ?','Quand arrivent mes échéances ?'],risk:['Comment mieux diversifier ?','Explique mon indice de fiabilité','Que faire si un projet est en retard ?'],divers:['Que me conseilles-tu en priorité ?','Combien j’ai de liquidités ?'],score:['Quels sont mes principaux risques ?','Comment mieux diversifier ?'],due:['Combien je touche d’intérêts ?','Fais le bilan de mon patrimoine'],income:['Impôt avec une TMI à 11 %','Quand arrivent mes échéances ?'],perf:['Fais le bilan de mon patrimoine','Comment mieux diversifier ?'],total:['Fais le bilan de mon patrimoine','Comment mieux diversifier ?'],tax:['C’est quoi le PFU ?','Combien je touche d’intérêts ?'],sim:['Simule 500 € par mois à 7 % pendant 20 ans','Quand vais-je atteindre mon objectif ?'],goal:['Simule 300 € par mois à 6 % pendant 15 ans','Que me conseilles-tu en priorité ?'],newproj:['Quelles garanties regarder ?','Comment mieux diversifier ?'],liquid:['C’est quoi l’épargne de précaution ?','Fais le bilan de mon patrimoine'],advice:['Quels sont mes principaux risques ?','Simule 300 € par mois à 6 % pendant 15 ans'],list:['Fais le bilan de mon patrimoine'],help:['Fais le bilan de mon patrimoine','Simule 200 € par mois à 5 % pendant 10 ans']};
